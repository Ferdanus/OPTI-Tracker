<div class="system-section-card"><div class="dummy">(bawah)</div></div></div><script>(function () {
    // Form PO di Tahap 8 -- sama seperti halaman Buat PO: seluruh halaman yang di-scroll, bingkai (bar biru + form) tetap menempel
    // di layar, isi form ikut bergerak, dan panel preview ketahan (sticky) tanpa terpotong.
    var track = document.getElementById('paTrack'), wrap = document.getElementById('paFrameWrap'), fr = document.getElementById('paFrame'), btn = document.getElementById('paFull');
    if (!track || !wrap || !fr) { return; }
    var C = 0, V = 0, terakhir = -1, antri = false, topbar = 75;
    function dok() { try { return fr.contentDocument; } catch (e) { return null; } }
    function penuh() { return wrap.classList.contains('pa-full'); }
    function tinggiTopbar() { var t = document.querySelector('.topbar'); return t ? Math.round(t.getBoundingClientRect().height) : 75; }
    // posisi isi form mengikuti seberapa jauh halaman sudah melewati awal bagian ini
    function sinkron() {
        var d = dok();
        if (!d || !d.body || penuh() || track.offsetParent === null) { return; }
        var p = Math.max(0, Math.min(Math.max(0, C - V), topbar - track.getBoundingClientRect().top));
        var w = d.defaultView;
        if (Math.abs(w.scrollY - p) > 0.5) { terakhir = p; w.scrollTo({ top: p, left: 0, behavior: 'instant' }); }
    }
    function ukur() {
        var d = dok();
        if (!d || !d.body || track.offsetParent === null) { return; }
        if (penuh()) { return; }
        d.documentElement.classList.add('pa-pin');
        topbar = tinggiTopbar();
        var bar = wrap.querySelector('.pa-fh');
        var barH = bar ? bar.offsetHeight : 40;
        V = Math.max(420, window.innerHeight - topbar - barH - 2);
        wrap.style.top = topbar + 'px';
        if (Math.abs(fr.offsetHeight - V) > 1) { fr.style.height = V + 'px'; }
        C = Math.max(V, d.documentElement.scrollHeight);
        var T = C + barH + 2;
        if (Math.abs(track.offsetHeight - T) > 1) { track.style.height = T + 'px'; }
        sinkron();
    }
    function jadwalkan() {
        if (antri) { return; }
        antri = true;
        window.requestAnimationFrame(function () { antri = false; sinkron(); });
    }
    function atur(on) {
        var d = dok();
        wrap.classList.toggle('pa-full', on);
        document.body.style.overflow = on ? 'hidden' : '';
        if (btn) { btn.querySelector('span').textContent = on ? 'Tutup layar penuh' : 'Layar penuh'; }
        if (on) {                         // layar penuh: scroll bawaan form
            fr.style.height = '';
            wrap.style.top = '';
            if (d && d.documentElement) { d.documentElement.classList.remove('pa-pin'); }
        } else { ukur(); }
    }
    if (btn) { btn.addEventListener('click', function () { atur(!penuh()); }); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && penuh()) { atur(false); } });
    fr.addEventListener('load', function () {
        ukur();
        var d = dok();
        if (!d || !d.body) { return; }
        if (window.ResizeObserver) { new ResizeObserver(ukur).observe(d.body); }
        // kalau form sendiri menggulir (mis. fokus ke kolom yang belum diisi), halaman ikut menyesuaikan
        d.defaultView.addEventListener('scroll', function () {
            if (penuh()) { return; }
            var y = d.defaultView.scrollY;
            if (Math.abs(y - terakhir) < 1.5) { return; }
            terakhir = y;
            var trAbs = track.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({ top: trAbs - topbar + y, left: 0, behavior: 'instant' });
        });
    });
    var tab8 = document.getElementById('tab-stage-8');
    if (tab8) { tab8.addEventListener('shown.bs.tab', function () { setTimeout(ukur, 100); }); }
    window.addEventListener('scroll', jadwalkan, { passive: true });
    window.addEventListener('resize', ukur);
    setInterval(ukur, 800);
})();
