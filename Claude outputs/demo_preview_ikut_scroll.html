area&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Bagian 7&lt;/h3&gt;&lt;p&gt;Contoh isian form PO (demo).&lt;/p&gt;&lt;label&gt;JUDUL KEGIATAN&lt;/label&gt;&lt;input value=&quot;Permohonan Uji Emisi Cerobong&quot;&gt;&lt;label&gt;KETERANGAN&lt;/label&gt;&lt;textarea rows=&quot;5&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;button class=&quot;btn o&quot;&gt;Simpan Draft&lt;/button&gt;&lt;button class=&quot;btn&quot;&gt;Kirim PO&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;poPreviewCol&quot;&gt;&lt;div class=&quot;po-live-card&quot;&gt;&lt;div class=&quot;po-live-toolbar&quot;&gt;Preview PO (ikut turun saat di-scroll)&lt;/div&gt;&lt;div class=&quot;po-live-viewport&quot;&gt;&lt;div class=&quot;paper&quot;&gt;&lt;b&gt;PETUNJUK OPERASIONAL&lt;/b&gt;&lt;br&gt;&lt;br&gt;1. Judul&lt;br&gt;2. Latar belakang&lt;br&gt;3. Tujuan&lt;br&gt;4. Ruang lingkup&lt;br&gt;5. Metode&lt;br&gt;6. Tim pelaksana&lt;br&gt;7. RAB&lt;br&gt;8. Jadwal&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></div></div></div>
<div class="sec"><div class="dummy">(bawah)</div></div></div><script>(function () {
    // Form PO di Tahap 8: iframe mengikuti tinggi isi form (tanpa scrollbar sendiri) dan lebarnya penuh
    var fr = document.getElementById('paFrame');
    if (!fr) { return; }
    var cache = { kolTop: 0, kolH: 0, kartuH: 0 }, antri = false;
    function dok() { try { return fr.contentDocument; } catch (e) { return null; } }
    // hitung ulang tinggi iframe + ukuran kolom preview (jarang dipanggil)
    function ukur() {
        var d = dok();
        if (!d || !d.body) { return; }
        d.documentElement.style.overflow = 'hidden';
        var h = Math.max(420, Math.ceil(d.body.offsetHeight) + 2);
        if (Math.abs(fr.offsetHeight - h) > 1) { fr.style.height = h + 'px'; }
        var kartu = d.querySelector('.po-live-card'), kol = d.getElementById('poPreviewCol');
        if (kartu && kol) {
            cache.kolTop = kol.getBoundingClientRect().top;
            cache.kolH = kol.offsetHeight;
            cache.kartuH = kartu.offsetHeight;
            if (!kartu.dataset.paSiap) {
                kartu.dataset.paSiap = '1';
                kartu.style.position = 'relative';
                kartu.style.top = '0';
                kartu.style.willChange = 'transform';
                kartu.style.transition = 'transform .14s ease-out';
            }
        }
        geser();
    }
    // dipanggil tiap scroll (ringan, tanpa baca layout isi iframe): panel preview ikut turun, popup muncul di area layar
    function geser() {
        var d = dok();
        if (!d || !d.body) { return; }
        var r = fr.getBoundingClientRect();
        var top = Math.max(0, -r.top);
        var kartu = d.querySelector('.po-live-card');
        if (kartu && cache.kartuH) {
            var mau = Math.max(0, top + 84 - cache.kolTop);
            var maks = Math.max(0, cache.kolH - cache.kartuH);
            kartu.style.transform = 'translate3d(0,' + Math.round(Math.min(mau, maks)) + 'px,0)';
        }
        var vis = Math.max(200, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0));
        var st = d.getElementById('paVis');
        if (!st) { st = d.createElement('style'); st.id = 'paVis'; d.head.appendChild(st); }
        var css = '.swal2-container,.modal,.modal-backdrop{position:absolute!important;top:' + Math.round(top) + 'px!important;height:' + Math.round(vis) + 'px!important;bottom:auto!important}';
        if (st.textContent !== css) { st.textContent = css; }
    }
    function jadwalkan() {
        if (antri) { return; }
        antri = true;
        window.requestAnimationFrame(function () { antri = false; geser(); });
    }
    fr.addEventListener('load', function () {
        ukur();
        var d = dok();
        if (d && d.body && window.ResizeObserver) { new ResizeObserver(ukur).observe(d.body); }
    });
    window.addEventListener('scroll', jadwalkan, { passive: true, capture: true });
    window.addEventListener('resize', ukur);
    setInterval(ukur, 700);
})();
</script></body></html>
