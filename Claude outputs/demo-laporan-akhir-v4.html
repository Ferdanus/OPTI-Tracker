<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<title>Demo Laporan Akhir Popup</title>
<style>
  :root{--navy:#0f172a;--navy2:#1e293b;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--ok:#198754;--okbg:#ecfdf3;--warn:#b45309;--warnbg:#fffbeb;--blue:#2563eb;--bluebg:#eff6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 48px}
  .wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{font-size:1.05rem;margin:0}.sub{color:var(--mut);font-size:.82rem;margin:2px 0 0}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;align-items:center}
  .tabs .lbl{font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:.8rem;font-weight:600;color:var(--mut);cursor:pointer}
  .tabs button.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
  .desc{font-size:.82rem;color:var(--mut);padding:0 2px}
  .desc b{color:var(--navy)}
  /* mini stepper konteks */
  .mini{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.74rem;color:var(--mut)}
  .mini i{font-style:normal;display:inline-flex;align-items:center;gap:5px;font-weight:600}
  .mini i:before{content:"\2713";width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:.6rem;display:inline-flex;align-items:center;justify-content:center}
  .mini i.now{color:var(--navy);font-weight:700}.mini i.now:before{content:"10";background:var(--navy2)}
  .mini i.wait:before{content:"11";background:#fff;color:#94a3b8;border:1.5px solid #cbd5e1}
  .mini i.fin:before{content:"11"}
  .mini i.w9:before{content:"9";background:#fff;color:#94a3b8;border:1.5px solid #cbd5e1}
  .mini .tunggu{color:var(--warn);font-size:.66rem;font-weight:700}
  .mini s{text-decoration:none;color:#cbd5e1}
  .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
  .hd .no{background:var(--navy2);color:#fff;border-radius:6px;font-size:.72rem;font-weight:700;padding:2px 8px}
  .hd h2{font-size:.98rem;margin:0}
  .badge{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid}
  .badge.opt2{color:var(--blue);background:var(--bluebg);border-color:#bfdbfe}
  .badge.ok{color:#15803d;background:var(--okbg);border-color:#bbf7d0}
  .bd{padding:0 18px 18px}
  .btn{border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:8px;padding:9px 16px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center}
  .btn.dark{background:var(--navy2);border-color:var(--navy2);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.sm{padding:5px 10px;font-size:.76rem}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sp{flex:1}
  .file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#f8fafc;min-width:0}
  .file .ic{width:30px;height:36px;border-radius:5px;background:#fee2e2;color:#b91c1c;font-size:.56rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;flex:none}
  .file .nm{font-weight:600;font-size:.84rem;overflow-wrap:anywhere}.file .mt{font-size:.72rem;color:var(--mut)}
  .drop{border:1.5px dashed #94a3b8;border-radius:8px;padding:14px;text-align:center;background:#f8fafc;cursor:pointer;font-size:.8rem;color:var(--mut)}
  .drop:hover{background:#f1f5f9;border-color:var(--navy2)}.drop b{color:var(--navy)}
  .hint{font-size:.76rem;color:var(--mut)}
  .konf{border:1.5px solid var(--navy2);border-radius:10px;padding:12px 14px;background:#fff;margin-top:12px}
  .konf b{font-size:.88rem}
  .done{display:flex;gap:10px;align-items:center;background:var(--okbg);border:1px solid #bbf7d0;color:#14532d;border-radius:8px;padding:10px 14px;font-size:.84rem}
  .foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 10px 10px}
  /* B: langkah */
  .lng{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .lng:first-child{border-top:0}
  .nmr{width:26px;height:26px;border-radius:50%;background:var(--navy2);color:#fff;font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .nmr.ok{background:var(--ok)}
  .lng h3{margin:0;font-size:.9rem}
  /* D: minimalis */
  .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.big{grid-template-columns:1fr}}
  .hidden{display:none!important}
  .reset{margin-left:auto}

  /* ====== ANIMASI ====== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(6px)}60%{transform:scale(1.02)}100%{opacity:1;transform:none}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px);max-height:0}to{opacity:1;transform:none;max-height:200px}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes march{to{background-position:24px 0,-24px 100%,0 -24px,100% 24px}}
  @keyframes fillbar{from{width:0}to{width:100%}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}100%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
  @keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
  @keyframes flipLbl{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
  @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
  .a-fade{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) both}
  .a-pop{animation:popIn .45s cubic-bezier(.2,.8,.3,1.1) both}
  .a-slide{animation:slideDown .35s ease both;overflow:hidden}
  .a-lbl{animation:flipLbl .25s ease both}
  .btn{transition:transform .12s ease,box-shadow .15s ease,background .15s ease,opacity .2s}
  .btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.14)}
  .btn:active:not([disabled]){transform:translateY(0) scale(.97);box-shadow:none}
  .btn[disabled]{opacity:.55;cursor:wait}
  .btn .arr{display:inline-block;animation:bob 1.6s ease-in-out infinite}
  .drop,.file{transition:background .2s,border-color .2s}
  .drop{background-image:linear-gradient(90deg,#94a3b8 50%,transparent 0),linear-gradient(90deg,#94a3b8 50%,transparent 0),linear-gradient(0deg,#94a3b8 50%,transparent 0),linear-gradient(0deg,#94a3b8 50%,transparent 0);background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:12px 1.5px,12px 1.5px,1.5px 12px,1.5px 12px;background-position:0 0,0 100%,0 0,100% 0;border:0;border-radius:8px}
  .drop:hover{animation:march .8s linear infinite}
  .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1e293b,#475569);animation:fillbar 1.2s cubic-bezier(.4,.1,.3,1) forwards}
  .bar.ok i{background:var(--ok);animation:none;width:100%}
  .file .ok-tick{color:var(--ok);font-weight:800;margin-left:6px;animation:popIn .3s both}
  .nmr{transition:background .3s,transform .3s}
  .nmr.ok{animation:popIn .4s both}
  .mini i:before{transition:all .3s}
  .mini i.now:before{animation:ring 1.6s ease-out infinite}
  .mini i.fin:before{animation:popIn .5s both,ring 1.4s ease-out 2}
  .mini i.g:before{content:"\2713";background:var(--ok);animation:popIn .4s both}
  .done{position:relative;overflow:hidden}
  .done svg{flex:none}
  .done svg circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw .5s ease forwards}
  .done svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s ease .45s forwards}
  .conf{position:absolute;left:26px;top:50%;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .9s ease-out .5s both}
  .foot .hint{transition:opacity .2s}
  .tabs button{transition:all .2s}
  .busy{position:relative}
  .busy:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:200px 100%;animation:shimmer 1s linear infinite;pointer-events:none;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<style>
  .ovl{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:ovIn .2s ease both}
  .ovl.out{animation:ovOut .18s ease both}
  .mdl{background:#fff;border-radius:14px;width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 24px 60px rgba(15,23,42,.35);animation:mdIn .35s cubic-bezier(.2,.9,.3,1.15) both;overflow:hidden}
  .ovl.out .mdl{animation:mdOut .18s ease both}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}@keyframes ovOut{to{opacity:0}}
  @keyframes mdIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes mdOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
  .mdl .top{padding:20px 22px 6px;display:flex;gap:14px;align-items:flex-start}
  .mdl .ico{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem;background:var(--bluebg);color:var(--blue)}
  .mdl h3{margin:0;font-size:1rem}.mdl .lead{margin:2px 0 0;font-size:.82rem;color:var(--mut)}
  .mdl .mb{padding:10px 22px 4px}
  .mdl .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px}
  .kv{border:1px solid var(--line);border-radius:8px;background:#f8fafc;margin:8px 0}
  .kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:.82rem;border-top:1px solid var(--line)}
  .kv div:first-child{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;overflow-wrap:anywhere}
  .mdl label{display:block;font-size:.74rem;font-weight:700;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .mdl .suk{text-align:center;padding:30px 22px 34px}
  .mdl .suk svg{width:64px;height:64px}
  .mdl .suk svg circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw .5s ease forwards}
  .mdl .suk svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s ease .45s forwards}
  .mdl .suk h3{margin-top:10px;animation:fadeUp .4s ease .6s both}.mdl .suk .lead{animation:fadeUp .4s ease .7s both}
  .mdl .suk .conf{left:50%;top:62px}
  .mdl .suk{position:relative;overflow:hidden}
  .btn.link{border:0;background:none;color:var(--blue);padding:0;font-weight:600}
  .note{display:flex;gap:10px;background:var(--bluebg);border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 12px;font-size:.82rem}
  .note.warn{background:var(--warnbg);border-color:#fde68a;color:#78350f}
</style>

<style>
  /* ===== Gaya dialog disamakan dengan dialog "ut-" di Daftar PO ===== */
  @keyframes utFade{from{opacity:0}to{opacity:1}}
  @keyframes utRise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes utOut{to{opacity:0}}
  .ut-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:2000;overflow-y:auto;animation:utFade .2s ease both}
  .ut-ov.out{animation:utOut .18s ease both}
  .ut-dlg{width:min(520px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.35);padding:22px;animation:utRise .28s cubic-bezier(.2,.8,.2,1) both;max-height:calc(100vh - 32px);overflow-y:auto;color:#1e293b;position:relative}
  .ut-ov.out .ut-dlg{opacity:0;transform:translateY(8px);transition:all .18s}
  .ut-dlg h5{font-family:"Plus Jakarta Sans","Inter",system-ui,sans-serif;font-size:1.05rem;font-weight:800;margin:0}
  .ut-dlg p{margin:6px 0 0;color:#475569;font-size:.86rem}
  .ut-big{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px;background:#e2e8f0;color:#1e293b;font-size:1.4rem;font-weight:700}
  .ut-sum{margin-top:14px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;padding:10px 12px;font-size:.82rem;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
  .ut-sum span{color:#64748b}.ut-sum b{word-break:break-word}
  .ut-hint{margin-top:12px;font-size:.78rem;color:#64748b}
  .ut-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
  .ut-foot .btn{border-radius:6px;padding:7px 16px;font-size:.9rem;font-weight:600}
  .ut-foot .btn.dark{background:#212529;border-color:#212529;color:#fff}
  .ut-foot .btn.dark:hover:not([disabled]){background:#000;border-color:#000}
  .ut-foot .btn.odark{background:#fff;border:1px solid #212529;color:#212529}
  .ut-foot .btn.odark:hover{background:#212529;color:#fff}
  .ut-drop{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px dashed #94a3b8;border-radius:10px;padding:14px 16px;background:#f8fafc;transition:background .15s,border-color .15s;cursor:pointer}
  .ut-drop:hover{background:#e2e8f0;border-color:#1e293b}
  .ut-drop .arr{display:inline-block;animation:bob 1.6s ease-in-out infinite;font-size:1.4rem;color:#1e293b}
  .ut-drop b{display:block;font-size:.88rem}.ut-drop small{color:#64748b}
  .ut-file{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #cbd5e1;border-radius:10px;padding:12px 16px;background:#f8fafc}
  .ut-file .ut-ico{font-size:.62rem;font-weight:800;color:#b91c1c;background:#fee2e2;border-radius:5px;width:32px;height:38px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;flex:none}
  .ut-file .nm{font-weight:600;font-size:.86rem;overflow-wrap:anywhere}.ut-file small{color:#64748b}
  .ut-prog{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:8px}
  .ut-prog>div{height:100%;width:0;background:#1e293b;animation:fillbar 1.2s cubic-bezier(.4,.1,.3,1) forwards}
  .ut-prog.ok>div{animation:none;width:100%;background:#198754}
  .ut-suk{text-align:center;padding:14px 0 10px;position:relative}
  .ut-suk svg{width:64px;height:64px}
  .ut-suk svg circle{stroke-dasharray:63;stroke-dashoffset:63;animation:draw .5s ease forwards}
  .ut-suk svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s ease .45s forwards}
  .ut-suk h5{margin-top:10px;animation:fadeUp .4s ease .6s both}.ut-suk p{animation:fadeUp .4s ease .7s both}
  .ut-suk .conf{left:50%;top:46px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Tahap "Laporan Akhir": bar bawah + popup</h1>
    <p class="sub">Tetap gaya bar bawah, tapi konfirmasi (dan opsional upload) pindah ke popup. Ada 2 cara, klik tabnya lalu coba upload dan Selesai.</p>
  </div>
  <div class="card tabs" id="tabs">
    <span class="lbl">Cara</span>
    <button data-v="1" class="on">1. Upload di kartu, Selesai popup</button>
    <button data-v="2">2. Upload &amp; Selesai sama-sama popup</button>
    <span class="lbl" style="margin-left:10px">Status PKS</span>
    <button data-p="1" class="on">Sudah dibuat</button>
    <button data-p="0">Belum dibuat</button>
    <button class="reset" id="reset">Ulangi dari awal</button>
  </div>
  <div class="desc" id="desc"></div>
  <div class="card" id="demo"></div>
</div>
<div id="modalRoot"></div>
<script>
(function(){
  var pks=true, mode=1, st={file:null,up:0,done:false,alasan:'Rahasia (permintaan klien)'}, ev='tab', timer=null, modal=null, mu={file:null,up:0}, mtimer=null;
  var FILE='Laporan_Akhir_ORD-2026-0118.pdf';
  var desc={
    1:'<b>Upload tetap di kartu</b> (klik atau seret file), lalu tombol Selesai di bar bawah membuka <b>popup konfirmasi</b> berisi ringkasan.',
    2:'<b>Semua lewat popup.</b> Kartunya bersih: tombol "Upload Laporan Akhir" membuka popup upload, dan tombol Selesai membuka popup konfirmasi.'
  };
  var CEK='<svg viewBox="0 0 24 24" fill="none" stroke="#198754" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  function confetti(){
    var c=['#198754','#2563eb','#f59e0b','#e11d48','#0f172a'], h='';
    for(var k=0;k<16;k++){ var a=(k/16)*Math.PI*2, d=46+Math.random()*40;
      h+='<span class="conf" style="--x:'+Math.round(Math.cos(a)*d)+'px;--y:'+Math.round(Math.sin(a)*d)+'px;background:'+c[k%5]+';animation-delay:'+(.5+Math.random()*.15)+'s"></span>'; }
    return h;
  }
  function mini(){
    var d=st.done;
    var bast = d ? (pks ? '<i class="now fin">BAST <span style="color:var(--blue);font-size:.66rem;font-weight:700">terbuka</span></i>' : '<i class="wait">BAST <span class="tunggu">menunggu PKS</span></i>') : '<i class="wait">BAST</i>';
    return '<div class="mini"><i>PO Kegiatan</i><s>&rsaquo;</s><i class="'+(pks?'':'w9')+'">Kontrak PKS</i><s>&rsaquo;</s><i class="'+(d?'g':'now')+'">Laporan Akhir</i><s>&rsaquo;</s>'+bast+'</div>';
  }
  function head(){
    return mini()+'<div class="hd"><span class="no">Tahap 10</span><h2>Laporan Akhir</h2><span class="badge opt2">Opsional</span>'+(st.done?'<span class="badge ok a-pop">Selesai</span>':'')+'</div>';
  }
  function chip(f,up,ganti,anim){
    return '<div class="file'+(anim?' a-pop':'')+(up===1?' busy':'')+'"><div class="ic">PDF</div><div style="min-width:0;flex:1"><div class="nm">'+FILE+(up===2?'<span class="ok-tick">&#10003;</span>':'')+'</div><div class="mt">'+(up===1?'Mengunggah&hellip;':'1,8 MB &middot; terunggah')+'</div><div class="bar'+(up===2?' ok':'')+'"><i></i></div></div>'+(ganti&&up!==1?'<button class="btn sm" data-a="ganti">Ganti</button>':'')+'</div>';
  }
  function selesaiBox(){
    return '<div class="bd"><div class="done a-pop">'+CEK.replace('<svg','<svg width="26" height="26"')+'<div><b>Order selesai.</b> '+(st.file?'Laporan akhir tersimpan: '+FILE+'.':'Diselesaikan tanpa laporan akhir.')+(pks?' BAST sudah terbuka.':' BAST akan terbuka setelah PKS dibuat.')+'</div>'+confetti()+'</div>'+
      (st.file?'':'<div class="row a-fade" style="margin-top:10px;animation-delay:.6s"><button class="btn sm" data-a="bukaUpload">Unggah laporan (jika nanti ada)</button></div>')+'</div>';
  }
  function card(){
    if(st.done) return head()+selesaiBox();
    var body;
    if(st.file){ body=chip(st.file,st.up,true,ev==='file'||ev==='simpan'); }
    else if(mode===1){ body='<div class="drop" data-a="pilih"><b><span class="arr">&#8593;</span> Upload Laporan Akhir (PDF)</b><br>Klik atau seret file ke sini. Tidak wajib.</div>'; }
    else { body='<div class="row"><button class="btn" data-a="bukaUpload"><span class="arr">&#8593;</span> Upload Laporan Akhir (PDF)</button><span class="hint">Tidak wajib. Kosongkan kalau laporannya rahasia.</span></div>'; }
    return head()+'<div class="bd">'+body+'</div>'+
      '<div class="foot"><span class="hint">'+(st.up===1?'Menunggu unggahan selesai&hellip;':(st.file?'Laporan akhir terlampir.':'Belum ada laporan, order tetap bisa diselesaikan.'))+'</span><span class="sp"></span><button class="btn dark" data-a="selesai"'+(st.up===1?' disabled':'')+'><span class="'+(ev==='file'||ev==='ganti'||ev==='simpan'?'a-lbl':'')+'">'+(st.file?'Selesai':'Selesai tanpa laporan')+'</span></button></div>';
  }
  function modalHtml(){
    if(!modal) return '';
    var inner='';
    if(modal==='konf'){
      inner='<div class="ut-big">?</div><h5>Apakah Anda yakin order ini sudah selesai?</h5>'+
        '<p>Periksa kembali data order di bawah. Jika sudah benar, order ditandai selesai'+(pks?' dan tahap BAST terbuka.':'. Tahap BAST baru terbuka setelah PKS dibuat.')+'</p>'+
        '<div class="ut-sum"><span>No. Order</span><b>ORD-2026-0118</b><span>Klien</span><b>PT Kertas Nusantara</b><span>Layanan</span><b>OPTI Lingkungan</b><span>Judul kegiatan</span><b>Pengujian Kualitas Air Limbah Industri Kertas</b><span>No. Surat Penawaran</span><b>45/SP/BBSPJIS/X/2026</b><span>Nomor PO</span><b>8/PO/BBSPJIS/XI/2026</b><span>Nomor PKS</span><b>'+(pks?'12/PKS/BBSPJIS/XI/2026':'Belum dibuat')+'</b></div>'+
        '<div class="ut-hint">Pastikan seluruh hasil pengujian sudah lengkap sebelum menyelesaikan order.</div>'+
        '<div class="ut-foot"><button class="btn odark" data-a="tutup">Belum</button><button class="btn dark" data-a="ya">Ya, sudah selesai</button></div>';
    } else if(modal==='upload'){
      inner='<div class="ut-big">&#8593;</div><h5>Upload Laporan Akhir</h5><p>Hanya PDF, maks. 30 MB. File hanya terlihat tim internal.</p>'+
        (mu.file?utFile():'<div class="ut-drop" data-a="mpilih"><span class="arr">&#8593;</span><div><b>Klik atau seret file PDF</b><small>Contoh: Laporan_Akhir_ORD-2026-0118.pdf</small></div></div>')+
        '<div class="ut-foot"><button class="btn odark" data-a="tutup">Batal</button><button class="btn dark" data-a="simpan"'+(mu.up===2?'':' disabled')+'>Simpan laporan</button></div>';
    } else if(modal==='sukses'){
      inner='<div class="ut-suk">'+CEK+'<h5>Order selesai</h5><p>'+(pks?'BAST sudah terbuka.':'BAST akan terbuka setelah PKS dibuat.')+'</p>'+confetti()+'</div>';
    }
    return '<div class="ut-ov" id="ovl"><div class="ut-dlg" role="dialog" aria-modal="true">'+inner+'</div></div>';
  }
  function utFile(){
    return '<div class="ut-file"><div class="ut-ico">PDF</div><div style="min-width:0;flex:1"><div class="nm">'+FILE+(mu.up===2?'<span class="ok-tick">&#10003;</span>':'')+'</div><small>'+(mu.up===1?'Mengunggah&hellip;':'1,8 MB &middot; terunggah')+'</small><div class="ut-prog'+(mu.up===2?' ok':'')+'"><div></div></div></div>'+(mu.up===2?'<button class="btn sm" data-a="ganti">Ganti</button>':'')+'</div>';
  }
  function bind(root){
    Array.prototype.forEach.call(root.querySelectorAll('[data-a]'),function(e){ e.onclick=function(){ aksi(e.getAttribute('data-a')); }; });
  }
  function renderCard(){
    document.getElementById('desc').innerHTML=desc[mode];
    var d=document.getElementById('demo'); d.innerHTML=card();
    if(ev==='tab'){ d.classList.remove('a-fade'); void d.offsetWidth; d.classList.add('a-fade'); }
    bind(d);
  }
  function renderModal(){
    var r=document.getElementById('modalRoot'); r.innerHTML=modalHtml();
    var o=document.getElementById('ovl'); if(!o) return;
    o.onmousedown=function(e){ if(e.target===o && modal!=='sukses'){ aksi('tutup'); } };
    bind(r);
  }
  function tutupModal(cb){
    var o=document.getElementById('ovl');
    if(!o){ modal=null; cb&&cb(); return; }
    o.classList.add('out');
    setTimeout(function(){ modal=null; renderModal(); cb&&cb(); },180);
  }
  function aksi(a){
    if(a==='pilih'){
      st.file=FILE; st.up=1; ev='file'; renderCard();
      clearTimeout(timer); timer=setTimeout(function(){ st.up=2; ev='upok'; renderCard(); },1300);
    }
    else if(a==='ganti'){
      if(modal==='upload'){ clearTimeout(mtimer); mu={file:null,up:0}; renderModal(); return; }
      clearTimeout(timer); st.file=null; st.up=0; ev='ganti'; renderCard();
    }
    else if(a==='bukaUpload'){ mu={file:null,up:0}; modal='upload'; renderModal(); }
    else if(a==='mpilih'){
      mu={file:FILE,up:1}; renderModal();
      clearTimeout(mtimer); mtimer=setTimeout(function(){ mu.up=2; if(modal==='upload'){ var o=document.getElementById('ovl'); var f=o.querySelector('.ut-file'); f.querySelector('small').innerHTML='1,8 MB &middot; terunggah'; f.querySelector('.ut-prog').classList.add('ok'); f.querySelector('.nm').insertAdjacentHTML('beforeend','<span class="ok-tick">&#10003;</span>'); f.insertAdjacentHTML('beforeend','<button class="btn sm" data-a="ganti">Ganti</button>'); o.querySelector('[data-a="simpan"]').disabled=false; bind(o); } },1300);
    }
    else if(a==='simpan'){
      st.file=FILE; st.up=2; ev='simpan'; tutupModal(function(){ renderCard(); });
    }
    else if(a==='selesai'){ modal='konf'; ev='konf'; renderModal(); }
    else if(a==='tutup'){ clearTimeout(mtimer); tutupModal(); }
    else if(a==='ya'){
      modal='sukses'; renderModal();
      setTimeout(function(){ st.done=true; ev='done'; tutupModal(function(){ renderCard(); }); },1500);
    }
  }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && modal && modal!=='sukses'){ aksi('tutup'); } });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-v]'),function(b){
    b.onclick=function(){
      mode=parseInt(b.getAttribute('data-v'),10); ev='tab'; hapus();
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-v]'),function(x){ x.classList.toggle('on',x===b); });
      renderCard();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-p]'),function(b){
    b.onclick=function(){
      pks=b.getAttribute('data-p')==='1'; ev='tab'; hapus();
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-p]'),function(x){ x.classList.toggle('on',x===b); });
      renderCard();
    };
  });
  function hapus(){ clearTimeout(timer); clearTimeout(mtimer); st={file:null,up:0,done:false,alasan:'Rahasia (permintaan klien)'}; mu={file:null,up:0}; modal=null; renderModal(); }
  document.getElementById('reset').onclick=function(){ ev='tab'; hapus(); renderCard(); };
  renderCard();
})();
</script>
</body>
</html>
