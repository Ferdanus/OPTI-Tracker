<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo TTD Geser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--dark:#111827;--bad:#dc3545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:22px 16px 70px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:800 18px 'Plus Jakarta Sans',Inter,system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.opsi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.opsi button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font:600 13px Inter,system-ui,sans-serif;color:var(--mut);cursor:pointer;transition:.18s;text-align:left}
.opsi button b{display:block;font:700 13px 'Plus Jakarta Sans',Inter,system-ui,sans-serif;color:var(--ink)}
.opsi button.on{border-color:var(--dark);box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.varian{display:none}.varian.on{display:block;animation:masuk .35s ease}
@keyframes masuk{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 14px;color:var(--mut);font-size:13px;margin-bottom:14px}

.kartu{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.kartu-h{padding:16px 24px;border-bottom:1px solid var(--line);font:700 16px 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
.kartu-b{padding:24px}
.desk{color:var(--mut);margin:0 0 20px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:8px 16px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;transition:.15s;background:#fff}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--dark);color:#fff}.btn-pri:hover{background:#000}.btn-pri:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-out{border-color:#cbd5e1;color:#334155}.btn-out:hover{background:var(--soft)}.btn-out:disabled{opacity:.5;cursor:not-allowed}
.btn-bad{border-color:#f1b0b7;color:var(--bad)}.btn-bad:hover{background:#fdecee}
.btn-sm{padding:6px 12px;font-size:12.5px}
.meta{color:var(--mut);font-size:13px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}

/* ===== tampilan awal: dibagi dua sejajar ===== */
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
@media(max-width:640px){.split{grid-template-columns:1fr;gap:14px}}
.half{min-width:0}
.half.r{display:flex;flex-direction:column;justify-content:center;gap:10px;align-items:flex-start;padding-left:8px}
.half.r .aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chk{background-image:linear-gradient(45deg,#e8ebf0 25%,transparent 25%),linear-gradient(-45deg,#e8ebf0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8ebf0 75%),linear-gradient(-45deg,transparent 75%,#e8ebf0 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:170px;height:100%;padding:8px;overflow:hidden}
.chk img{max-height:130px;max-width:100%;display:block}
.chk img.reveal{animation:tulis 1.1s ease-out}
@keyframes tulis{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.kosong{color:var(--mut);font-size:13px;text-align:center}
.lencana{display:inline-flex;align-items:center;gap:6px;background:#e8f5ee;color:#146c43;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.lencana i{width:7px;height:7px;border-radius:50%;background:#198754;display:block}
.jdl{font:700 17px 'Plus Jakarta Sans',Inter,system-ui,sans-serif;margin:0}

/* ===== panggung: wadah yang animasinya beda tiap varian ===== */
.stage{position:relative;transition:height .55s cubic-bezier(.65,0,.25,1)}
.face{background:var(--card)}
.edhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edhead .kembali{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;color:#334155;transition:.15s}
.edhead .kembali:hover{background:#e2e8f0}
.edfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* A. tirai terbelah */
.stage.A{overflow:hidden}
.stage.A .face{position:absolute;left:0;top:0;width:100%}
.stage.A .front .half{transition:transform .55s cubic-bezier(.65,0,.25,1),opacity .4s}
.stage.A.open .front .half.l{transform:translateX(-115%);opacity:0}
.stage.A.open .front .half.r{transform:translateX(115%);opacity:0}
.stage.A .front{transition:visibility 0s .55s}
.stage.A.open .front{visibility:hidden;pointer-events:none}
.stage.A .back{clip-path:inset(0 50% 0 50%);visibility:hidden;transition:clip-path .6s cubic-bezier(.65,0,.25,1),visibility 0s .6s}
.stage.A.open .back{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .6s cubic-bezier(.65,0,.25,1) .12s,visibility 0s}

/* B. geser kiri-kanan (carousel) */
.stage.B{overflow:hidden}
.stage.B .track{display:flex;width:200%;align-items:flex-start;transition:transform .6s cubic-bezier(.65,0,.25,1)}
.stage.B .face{width:50%;flex:none;padding:0 2px}
.stage.B.open .track{transform:translateX(-50%)}
.stage.B .front{transition:visibility 0s .6s}.stage.B.open .front{visibility:hidden}
.stage.B .back{visibility:hidden;transition:visibility 0s .6s}.stage.B.open .back{visibility:visible;transition:visibility 0s}

/* C. balik kartu 3D */
.stage.C{perspective:1600px}
.stage.C .flip{position:relative;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.stage.C .face{position:absolute;left:0;top:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.stage.C .back{transform:rotateY(180deg)}
.stage.C.open .flip{transform:rotateY(180deg)}
.stage.C .front{transition:visibility 0s .4s}.stage.C.open .front{visibility:hidden}
.stage.C .back{visibility:hidden;transition:visibility 0s .4s}.stage.C.open .back{visibility:visible;transition:visibility 0s .3s}

/* ===== editor ===== */
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font:600 13px Inter,system-ui,sans-serif;color:var(--mut);cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
.pad{position:relative;border:2px dashed #94a3b8;border-radius:12px;background:#fff;transition:.15s}
.pad.aktif{border-style:solid;border-color:#334155}
.pad canvas{display:block;width:100%;height:210px;touch-action:none;cursor:crosshair;border-radius:10px}
.pad .gr{position:absolute;left:6%;right:6%;bottom:46px;border-bottom:1px solid #cbd5e1;pointer-events:none}
.pad .xx{position:absolute;left:6%;bottom:50px;color:#94a3b8;pointer-events:none}
.pad .pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13.5px;pointer-events:none;transition:opacity .2s;text-align:center;padding:0 12px}
.pad.terisi .pt{opacity:0}
.alat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.tinta{display:flex;gap:6px;align-items:center;margin-left:auto}
.tinta button{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;transition:.15s}
.tinta button.on{box-shadow:0 0 0 2px var(--dark)}
.tebal{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tebal input[type=range]{flex:1;min-width:120px;max-width:300px;accent-color:#111827}
.tebal .ujung{font-size:12.5px;color:var(--mut)}
.tebal .contoh{width:64px;height:30px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.tebal .contoh i{display:block;width:44px;border-radius:99px;background:#1e3a8a;transition:height .12s}
.drop{display:block;border:2px dashed #94a3b8;border-radius:12px;padding:32px 16px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
.drop:hover{background:#f8fafc;border-color:#334155}.drop b{display:block;color:var(--ink)}
.foto-prev{margin-top:12px}.foto-prev canvas{max-height:100px;max-width:100%}
input[type=range]{width:100%}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#111827;color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;font-size:13.5px;opacity:0;transition:.3s;z-index:99;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:18px;height:18px;border-radius:50%;background:#198754;display:inline-block;position:relative}
.toast i:after{content:"";position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tanda Tangan Digital: tampilan dibagi dua, lalu menggeser</h1>
  <p class="sub">Tampilan awal: TTD di kiri, info dan tombol di kanan (sama lebar). Klik "Ganti TTD" dan form TTD muncul memenuhi kartu. Semua bisa dicoret dan disimpan beneran.</p>
  <div class="opsi" id="opsi">
    <button class="on" data-v="A"><b>A. Tirai terbelah</b>Dua sisi geser ke kiri dan kanan, form melebar dari tengah</button>
    <button data-v="B"><b>B. Geser samping</b>Tampilan awal keluar ke kiri, form masuk dari kanan</button>
    <button data-v="C"><b>C. Balik kartu</b>Kartu berputar 3D, sisi belakangnya form TTD</button>
  </div>
  <div class="note" id="catatan"></div>
  <section class="varian on" id="vA"></section>
  <section class="varian" id="vB"></section>
  <section class="varian" id="vC"></section>
</div>
<div class="toast" id="toast"><i></i><span id="toastT"></span></div>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var CATATAN={A:'Dua sisi (TTD dan info) bergeser keluar ke kiri dan kanan seperti tirai, lalu form TTD terbuka dari tengah sampai memenuhi kartu.',B:'Tampilan awal bergeser keluar ke kiri, form TTD masuk dari kanan memenuhi kartu. Tombol panah kembali menggeser balik.',C:'Kartu berputar 3D: sisi depan tampilan awal, sisi belakang form TTD. Cocok kalau mau efek yang paling "wah".'};

/* ---------- state TTD ---------- */
var saved=null,savedAt=null,stages=[];
function contoh(){var c=document.createElement('canvas');c.width=520;c.height=170;var x=c.getContext('2d');x.strokeStyle='#1e3a8a';x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(20,120);x.bezierCurveTo(60,20,90,20,100,90);x.bezierCurveTo(110,150,150,40,190,70);x.bezierCurveTo(230,100,260,30,300,80);x.bezierCurveTo(340,130,380,50,470,60);x.stroke();x.beginPath();x.moveTo(40,140);x.lineTo(430,125);x.stroke();return c.toDataURL('image/png')}
function fmt(d){return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')}
function toast(t){$('#toastT').textContent=t;var e=$('#toast');e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2200)}
function renderAll(animate){stages.forEach(function(s){s.render(animate)})}

/* ---------- editor: tab Gambar / Foto + slider tebal ---------- */
function editor(root,onChange){
  root.innerHTML=
   '<div class="seg"><button class="on" data-m="g">✎ Gambar langsung</button><button data-m="f">▣ Upload foto</button></div>'+
   '<div data-p="g"><div class="pad"><canvas></canvas><span class="xx">×</span><span class="gr"></span><div class="pt">Tanda tangan di sini (mouse, jari, atau stylus)</div></div>'+
   '<div class="alat"><button class="btn btn-out btn-sm" data-u disabled>↶ Urungkan</button><button class="btn btn-out btn-sm" data-b disabled>Hapus coretan</button>'+
   '<span class="tinta"><span class="meta">Tinta</span><button class="on" style="background:#1e3a8a" data-w="#1e3a8a" title="Biru tua"></button><button style="background:#111827" data-w="#111827" title="Hitam"></button></span></div>'+
   '<div class="tebal"><span class="meta">Tebal pena</span><span class="ujung">Tipis</span><input type="range" min="1" max="8" step="0.5" value="2.6" data-t><span class="ujung">Tebal</span><span class="contoh"><i></i></span></div></div>'+
   '<div data-p="f" hidden><label class="drop"><b>Pilih foto tanda tangan</b>Tulis di kertas putih lalu foto (PNG / JPG / WEBP)<input type="file" accept="image/*" hidden></label>'+
   '<div class="foto-prev" hidden><div class="chk" style="min-height:110px"><canvas></canvas></div><div class="lbl" style="margin-top:10px">Pembersihan latar</div><input type="range" min="120" max="250" value="215" data-bg></div></div>';
  var mode='g',tinta='#1e3a8a',lebar=2.6,garis=[],cur=null,dpr=1,W=0,H=0,raw=null;
  var padBox=$('.pad',root),cv=$('canvas',padBox),cx=null,fileIn=$('input[type=file]',root),fprev=$('.foto-prev',root),fcv=$('canvas',fprev),rng=$('[data-bg]',root),tb=$('[data-t]',root),cth=$('.tebal .contoh i',root);
  function resize(){var r=cv.getBoundingClientRect();if(!r.width)return;dpr=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx=cv.getContext('2d');cx.setTransform(dpr,0,0,dpr,0,0);draw()}
  function seg(g){var p=g.p;cx.lineWidth=g.w;if(p.length<3){cx.beginPath();cx.arc(p[0][0],p[0][1],g.w/2,0,6.3);cx.fill();return}cx.beginPath();cx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length-1;i++){cx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2)}cx.lineTo(p[p.length-1][0],p[p.length-1][1]);cx.stroke()}
  function draw(){if(!cx)return;cx.clearRect(0,0,W,H);cx.lineCap=cx.lineJoin='round';cx.strokeStyle=cx.fillStyle=tinta;garis.forEach(seg);if(cur)seg(cur)}
  function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  function has(){return mode==='g'?garis.length>0:!!raw}
  function status(){var ada=garis.length>0||!!cur;padBox.classList.toggle('terisi',ada);$('[data-u]',root).disabled=!ada;$('[data-b]',root).disabled=!ada;onChange(has())}
  cv.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur={p:[pt(e)],w:lebar};padBox.classList.add('aktif');status();draw()});
  cv.addEventListener('pointermove',function(e){if(!cur)return;e.preventDefault();((e.getCoalescedEvents&&e.getCoalescedEvents())||[e]).forEach(function(ev){cur.p.push(pt(ev))});draw()});
  function up(){if(!cur)return;garis.push(cur);cur=null;padBox.classList.remove('aktif');status();draw()}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  $('[data-u]',root).onclick=function(){garis.pop();status();draw()};
  $('[data-b]',root).onclick=function(){garis=[];cur=null;status();draw()};
  function cth_(){cth.style.height=Math.max(1,lebar)+'px';cth.style.background=tinta}
  tb.oninput=function(){lebar=+tb.value;cth_()};cth_();
  $$('[data-w]',root).forEach(function(b){b.onclick=function(){tinta=b.dataset.w;cth_();$$('[data-w]',root).forEach(function(x){x.classList.toggle('on',x===b)});draw()}});
  $$('.seg button',root).forEach(function(b){b.onclick=function(){mode=b.dataset.m;$$('.seg button',root).forEach(function(x){x.classList.toggle('on',x===b)});$('[data-p=g]',root).hidden=mode!=='g';$('[data-p=f]',root).hidden=mode!=='f';if(mode==='g')resize();onChange(has())}});
  function fotoDraw(){if(!raw)return;var s=Math.min(1,600/raw.width),w=Math.round(raw.width*s),h=Math.round(raw.height*s);fcv.width=w;fcv.height=h;var x=fcv.getContext('2d');x.drawImage(raw,0,0,w,h);var d=x.getImageData(0,0,w,h),p=d.data,t=+rng.value;for(var i=0;i<p.length;i+=4){var l=.299*p[i]+.587*p[i+1]+.114*p[i+2];if(l>=t){p[i+3]=0;continue}p[i+3]=l>t-40?Math.round(255*(t-l)/40):255;p[i]=30;p[i+1]=58;p[i+2]=138}x.putImageData(d,0,0)}
  fileIn.onchange=function(){var f=fileIn.files[0];if(!f)return;var im=new Image();im.onload=function(){raw=im;fprev.hidden=false;fotoDraw();onChange(has())};im.src=URL.createObjectURL(f)};
  rng.oninput=fotoDraw;
  function crop(src){var x=src.getContext('2d'),w=src.width,h=src.height,d=x.getImageData(0,0,w,h).data,a=w,b=h,c=-1,e=-1;for(var j=0;j<h;j++)for(var i=0;i<w;i++){if(d[(j*w+i)*4+3]>20){if(i<a)a=i;if(i>c)c=i;if(j<b)b=j;if(j>e)e=j}}if(c<0)return null;var p=6,o=document.createElement('canvas');o.width=c-a+1+2*p;o.height=e-b+1+2*p;o.getContext('2d').drawImage(src,a,b,c-a+1,e-b+1,p,p,c-a+1,e-b+1);return o.toDataURL('image/png')}
  return {resize:resize,reset:function(){garis=[];cur=null;raw=null;fileIn.value='';fprev.hidden=true;$$('.seg button',root)[0].click();status();draw()},result:function(){return mode==='g'?crop(cv):crop(fcv)}};
}

/* ---------- satu kartu (varian A / B / C) ---------- */
function mount(sec,kind){
  var depan=
    '<div class="face front"><div class="split">'+
      '<div class="half l"><div class="chk" data-saved></div></div>'+
      '<div class="half r"><span class="lencana" data-badge><i></i>Aktif</span><h3 class="jdl" data-judul-v></h3><span class="meta" data-meta></span>'+
      '<div class="aksi"><button class="btn btn-pri" data-buka></button><button class="btn btn-bad" data-hapus>Hapus</button></div></div>'+
    '</div></div>';
  var belakang=
    '<div class="face back"><div class="edhead"><button class="kembali" data-batal title="Kembali" aria-label="Kembali">←</button><h3 class="jdl" data-judul></h3></div><div data-ed></div>'+
    '<div class="edfoot"><button class="btn btn-out" data-batal>Batal</button><button class="btn btn-pri" data-simpan disabled>Simpan TTD</button></div></div>';
  var isi=kind==='B'?'<div class="track">'+depan+belakang+'</div>':kind==='C'?'<div class="flip">'+depan+belakang+'</div>':depan+belakang;
  sec.innerHTML='<div class="kartu"><div class="kartu-h">✎ Tanda Tangan Digital</div><div class="kartu-b"><p class="desk">Buat sekali (gambar langsung di layar atau upload foto), lalu otomatis dipakai di dokumen PO yang kamu approve. TTD hanya tampil di dokumen setelah kamu menekan Approve.</p><div class="stage '+kind+'">'+isi+'</div></div></div>';
  var stage=$('.stage',sec),front=$('.front',sec),back=$('.back',sec),ed;
  ed=editor($('[data-ed]',sec),function(ok){$('[data-simpan]',sec).disabled=!ok});
  function fit(){stage.style.height=((stage.classList.contains('open')?back:front).offsetHeight)+'px'}
  function buka(b){stage.classList.toggle('open',b);if(b){ed.reset();setTimeout(ed.resize,700)}fit();setTimeout(fit,80);setTimeout(fit,700)}
  $('[data-buka]',sec).onclick=function(){buka(true)};
  $$('[data-batal]',sec).forEach(function(x){x.onclick=function(){buka(false)}});
  $('[data-simpan]',sec).onclick=function(){var r=ed.result();if(r){saved=r;savedAt=new Date();buka(false);renderAll(true);toast('TTD berhasil disimpan')}};
  $('[data-hapus]',sec).onclick=function(){saved=null;renderAll();toast('TTD dihapus')};
  if(window.ResizeObserver){var ro=new ResizeObserver(fit);ro.observe(front);ro.observe(back)}
  var s={fit:fit,ed:ed,render:function(anim){
    var b=$('[data-saved]',sec);b.innerHTML='';
    if(saved){var i=new Image();i.src=saved;i.alt='TTD tersimpan';if(anim)i.className='reveal';b.appendChild(i)}else b.innerHTML='<div class="kosong">Belum ada TTD tersimpan.</div>';
    $('[data-hapus]',sec).style.display=saved?'':'none';$('[data-badge]',sec).style.display=saved?'':'none';
    $('[data-meta]',sec).textContent=saved?'Diperbarui '+fmt(savedAt):'Buat sekali, dipakai di semua PO.';
    $('[data-buka]',sec).innerHTML=saved?'✎ Ganti TTD':'＋ Buat TTD';
    $('[data-judul-v]',sec).textContent=saved?'TTD kamu aktif':'Belum ada TTD';
    $('[data-judul]',sec).textContent=saved?'Ganti tanda tangan':'Buat tanda tangan';
    fit();
  }};
  stages.push(s);return s;
}
mount($('#vA'),'A');mount($('#vB'),'B');mount($('#vC'),'C');

$$('#opsi button').forEach(function(b){b.onclick=function(){
  $$('#opsi button').forEach(function(x){x.classList.toggle('on',x===b)});
  ['A','B','C'].forEach(function(v){$('#v'+v).classList.toggle('on',v===b.dataset.v)});
  $('#catatan').textContent=CATATAN[b.dataset.v];
  setTimeout(function(){stages.forEach(function(s){s.fit()})},30);
}});
$('#catatan').textContent=CATATAN.A;
window.addEventListener('resize',function(){stages.forEach(function(s){s.fit();s.ed.resize()})});
saved=contoh();savedAt=new Date(Date.now()-86400000*3);renderAll();
setTimeout(function(){stages.forEach(function(s){s.fit()})},120);
})();
</script>
