<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo – Kata-kata Dialog Persetujuan PPK BLU</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1f5f9; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 24px 8px; }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 0; font-size: 13px; color: #64748b; max-width: 760px; line-height: 1.5; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px 24px 32px; align-items: flex-start; }
  .opt { flex: 1 1 340px; max-width: 420px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; background: #1e293b; color: #fff; }
  .tag.now { background: #cbd5e1; color: #1e293b; }
  .cap { font-size: 12px; color: #64748b; margin: 0 0 8px; line-height: 1.45; min-height: 34px; }
  .stage { background: #94a3b8; border-radius: 12px; padding: 28px 16px; display: flex; justify-content: center; }
  .dlg { width: 100%; max-width: 360px; background: #fff; border-radius: 18px; padding: 22px 20px 18px; text-align: center; box-shadow: 0 10px 30px rgba(15,23,42,.3); }
  .ico { width: 52px; height: 52px; border-radius: 16px; background: #f1f5f9; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
  .ico svg { width: 26px; height: 26px; stroke: #1e293b; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dlg h3 { margin: 0 0 6px; font-size: 16px; color: #0f172a; }
  .dlg p { margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: #64748b; }
  .btns { display: flex; gap: 8px; }
  .btns button { flex: 1; padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: default; border: 1px solid #cbd5e1; background: #fff; color: #1e293b; }
  .btns button.pri { background: #1e293b; border-color: #1e293b; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Demo: kata-kata dialog persetujuan PPK BLU</h1>
  <p>Data contoh, hanya teks dialog yang beda. Dialog ini muncul waktu PPK BLU menekan tombol di slide Validasi PPK BLU. Pilih nomor yang paling pas, nanti judul, isi, tombol, dan pesan toast-nya disamain.</p>
</header>
<div class="grid" id="g"></div>
<script>
var ICON = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.4 1.7 2.9-.2 1.1 2.7 2.5 1.5-.7 2.8 1 2.7-2 2.1-.4 2.9-2.9.6-2.1 2-2.6-1.3-2.6 1.3-2.1-2-2.9-.6-.4-2.9-2-2.1 1-2.7-.7-2.8 2.5-1.5 1.1-2.7 2.9.2z"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>';
var OPSI = [
  { t: 'Sekarang', now: 1, cap: 'Kata "verifikasi" dan "dinyatakan" terasa kaku, isinya belum jelas dampaknya.',
    j: 'Verifikasi PO ini?', p: 'PO dinyatakan sesuai dan terkunci. Tidak ada revisi lagi. Catatan PPK BLU di kolom bawah ikut tersimpan.', y: 'Ya, verifikasi' },
  { t: 'Opsi 1', cap: 'Pakai "setujui" (sama dengan bahasa DRAFT sampai disetujui PPK BLU), dampaknya dijelaskan.',
    j: 'Setujui PO ini?', p: 'PO akan ditandai disetujui PPK BLU. Setelah itu PO terkunci dan tidak bisa diedit atau direvisi lagi. Catatanmu di kolom bawah ikut tersimpan.', y: 'Ya, setujui' },
  { t: 'Opsi 2', cap: 'Pendek dan to the point.',
    j: 'Setujui PO ini?', p: 'Setelah disetujui, PO terkunci dan tidak bisa direvisi lagi.', y: 'Ya, setujui' },
  { t: 'Opsi 3', cap: 'Tetap pakai kata "verifikasi" tapi bahasanya lebih natural.',
    j: 'Verifikasi PO ini?', p: 'Dengan memverifikasi, PO dianggap sudah sesuai dan terkunci sehingga tidak bisa diubah lagi. Catatan di kolom bawah ikut tersimpan.', y: 'Ya, verifikasi' },
  { t: 'Opsi 4', cap: 'Bentuk pertanyaan konfirmasi, ada pengingat soal catatan.',
    j: 'Yakin PO ini sudah sesuai?', p: 'Kalau sudah, PO disetujui dan terkunci. Pastikan catatan di kolom bawah sudah terisi karena setelah ini tidak ada revisi lagi.', y: 'Ya, sudah sesuai' },
  { t: 'Opsi 5', cap: 'Santai, menyebut perannya (PPK BLU) dan hasil akhirnya.',
    j: 'Setujui PO sebagai PPK BLU?', p: 'PO ini selesai di tahap PPK BLU dan langsung terkunci, jadi tidak ada putaran revisi lagi. Catatanmu ikut tersimpan.', y: 'Setujui PO' }
];
document.getElementById('g').innerHTML = OPSI.map(function (o) {
  return '<div class="opt"><span class="tag' + (o.now ? ' now' : '') + '">' + o.t + '</span><p class="cap">' + o.cap + '</p>' +
    '<div class="stage"><div class="dlg"><div class="ico">' + ICON + '</div><h3>' + o.j + '</h3><p>' + o.p + '</p>' +
    '<div class="btns"><button>Batal</button><button class="pri">' + o.y + '</button></div></div></div></div>';
}).join('');
</script>
</body>
</html>
