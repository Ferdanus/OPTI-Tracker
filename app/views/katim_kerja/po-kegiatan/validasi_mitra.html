<!--
    app/views/katim_kerja/po-kegiatan/validasi_keuangan.html
    Validasi Pembayaran PO (Tim Mitra). PO terkirim masuk sini LANGSUNG, tanpa approval Ketua Tim.
    Fragment (dirender di dalam layout lewat $this->render()). Data dari PoValidasiKeuanganController::index().
    Class berawalan "dpo-" (konsisten dengan halaman Daftar PO / Kontrak).
-->
<style>
    .dpo-root {
        --dpo-primary: var(--color-primary, #334155);
        --dpo-primary-light: var(--color-primary-light, #f1f5f9);
        --dpo-border: var(--color-border, #e2e8f0);
        --dpo-muted: var(--color-text-muted, #64748b);
        --dpo-text: var(--color-text-main, #0f172a);
        --dpo-display: var(--font-display, inherit);
        --dpo-radius: var(--radius-md, 10px);
        color: var(--dpo-text);
    }
    .dpo-root *, .dpo-root *::before, .dpo-root *::after { box-sizing: border-box; }
    .dpo-root [hidden] { display: none !important; }
    .dpo-root button { font-family: inherit; cursor: pointer; }
    
    .dpo-head h1 { font-family: var(--dpo-display); font-size: 1.35rem; font-weight: 800; margin: 0 0 4px; }
    .dpo-head p { margin: 0 0 18px; color: var(--dpo-muted); font-size: .85rem; max-width: 660px; }
    .dpo-alert { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; border-radius: var(--dpo-radius); padding: 10px 14px; margin-bottom: 14px; font-size: .85rem; }
    
    .dpo-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .dpo-tab { background: #fff; border: 1px solid var(--dpo-border); border-radius: 999px; padding: .45rem 1rem; font-size: .82rem; font-weight: 700; color: var(--dpo-muted); display: inline-flex; align-items: center; gap: 7px; }
    .dpo-tab.active { background: var(--dpo-primary); border-color: var(--dpo-primary); color: #fff; }
    .dpo-tab-count { background: rgba(0,0,0,.08); color: inherit; border-radius: 999px; font-size: .7rem; padding: 1px 7px; font-weight: 800; }
    .dpo-tab.active .dpo-tab-count { background: rgba(255,255,255,.25); }

    .dpo-panel { background: #fff; border: 1px solid var(--dpo-border); border-radius: var(--dpo-radius); }
    .dpo-body { padding: 16px; }
    .dpo-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .dpo-search { flex: 1 1 260px; max-width: 380px; border: 1px solid var(--dpo-border); border-radius: 9px; padding: .5rem .75rem; font: inherit; font-size: .85rem; margin: 0; }
    .dpo-select { border: 1px solid var(--dpo-border); border-radius: 9px; padding: .5rem .65rem; font: inherit; font-size: .85rem; background: #fff; color: var(--dpo-text); }
    .dpo-tanggal { font-size: .78rem; color: var(--dpo-muted); }
    .dpo-tanggal b { color: var(--dpo-text); }
    
    .dpo-desk { border: 1px solid var(--dpo-border); border-radius: var(--dpo-radius); overflow: hidden; }
    table.dpo-table { width: 100%; border-collapse: collapse; border: 0; }
    .dpo-table thead th {
        text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .03em;
        color: var(--dpo-muted); font-weight: 700; padding: 11px 16px; background: #f8fafc;
        border-bottom: 1px solid var(--dpo-border); white-space: nowrap;
    }
    .dpo-table td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; font-size: .82rem; }
    .dpo-table tbody tr:last-child td { border-bottom: 0; }
    .dpo-table tbody tr:hover { background: #f8fafc; }
    /* [BARU] Garis halus vertikal antar kolom biar tabelnya kebaca kayak grid, bukan cuma garis horizontal doang. */
    .dpo-table th:not(:last-child), .dpo-table td:not(:last-child) { border-right: 1px solid #f1f5f9; }
    .dpo-table th.dpo-col-aksi, .dpo-table td.dpo-col-aksi { width: 132px; text-align: right; }
    .dpo-table th.dpo-col-mid, .dpo-table td.dpo-col-mid { width: 170px; }
    .dpo-table th.dpo-col-no, .dpo-table td.dpo-col-no { width: 180px; }
    .dpo-table th.dpo-col-urut, .dpo-table td.dpo-col-urut { width: 44px; text-align: center; color: var(--dpo-muted); }
    .dpo-table th.dpo-col-mitra, .dpo-table td.dpo-col-mitra { width: 160px; }
    .dpo-no { font-family: 'Courier New', monospace; font-weight: 700; font-size: .8rem; letter-spacing: .01em; }
    .dpo-sub { font-size: .72rem; color: var(--dpo-muted); margin-top: 2px; }
    .dpo-mitra { font-weight: 600; }
    .dpo-judul { font-size: .8rem; color: var(--dpo-muted); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .dpo-pill { font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; border: 1px solid transparent; margin: 1px 3px 1px 0; }
    .dpo-pill.emerald { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .dpo-pill.amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .dpo-pill.slate { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .dpo-empty { text-align: center; padding: 44px 16px; color: #94a3b8; font-size: .85rem; }
    .dpo-empty i { display: block; font-size: 28px; margin-bottom: 6px; }
    .dpo-mob { display: none; }
    .dpo-pcard { border: 1px solid var(--dpo-border); border-radius: var(--dpo-radius); padding: 13px; margin-bottom: 10px; }
    .dpo-pcard .foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
    .dpo-pcard .foot .btn { width: 100%; }
    
    /* ---------- Modal ---------- */
    .dpo-sheet { background: #fff; border: 0; border-radius: var(--radius-lg, 14px); overflow: hidden; box-shadow: var(--shadow-lg, 0 10px 25px rgba(0,0,0,.18)); }
    .dpo-sheet-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--dpo-border); background: linear-gradient(180deg, #fff, #f8fafc); }
    .dpo-icon { width: 46px; height: 46px; border-radius: 13px; background: var(--dpo-primary-light); color: var(--dpo-primary); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
    .dpo-sheet-head .modal-title { font-family: var(--dpo-display); font-weight: 800; font-size: 1.02rem; margin: 0; }
    .dpo-sheet-sub { font-size: .78rem; color: var(--dpo-muted); margin-top: 2px; }
    .dpo-sheet-body { padding: 16px 20px; background: #f8fafc; max-height: 60vh; overflow-y: auto; }
    .dpo-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .dpo-stat { background: #fff; border: 1px solid var(--dpo-border); border-radius: var(--dpo-radius); padding: 10px 13px; }
    .dpo-stat .l { font-size: .68rem; font-weight: 600; color: var(--dpo-muted); margin-bottom: 2px; }
    .dpo-stat .v { font-weight: 800; font-size: .95rem; }
    .dpo-stat .v.ok { color: #047857; }
    .dpo-stat .v.warn { color: #b45309; }
    .dpo-cat { background: #fff; border: 1px solid var(--dpo-border); border-radius: var(--dpo-radius); padding: 12px 14px; margin-bottom: 8px; }
    .dpo-cat-top { display: flex; align-items: center; gap: 10px; }
    .dpo-cat-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--dpo-primary-light); color: var(--dpo-primary); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
    .dpo-cat-label { font-weight: 700; font-size: .82rem; flex: 1; }
    .dpo-cat-kosong { font-size: .74rem; color: #94a3b8; }
    .dpo-termin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0 0 42px; }
    .dpo-termin-row + .dpo-termin-row { border-top: 1px dashed var(--dpo-border); margin-top: 7px; }
    .dpo-termin-info { font-size: .76rem; color: var(--dpo-muted); }
    .dpo-termin-info b { color: var(--dpo-text); }
    .dpo-catatan-label { font-size: .78rem; font-weight: 700; margin: 14px 0 6px; display: block; }
    .dpo-textarea { width: 100%; border: 1px solid var(--dpo-border); border-radius: 9px; padding: 9px 11px; font: inherit; font-size: .85rem; resize: vertical; min-height: 70px; background: #fff; }
    .dpo-gate { margin-top: 14px; padding: 10px 13px; border-radius: var(--dpo-radius); font-size: .78rem; display: flex; gap: 8px; align-items: flex-start; }
    .dpo-gate.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .dpo-gate.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .dpo-sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--dpo-border); background: #fff; flex-wrap: wrap; }
    .dpo-loading { text-align: center; padding: 34px 16px; color: #94a3b8; font-size: .85rem; }
    
    .dpo-toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -14px); background: #1e293b; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .82rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1100; max-width: calc(100vw - 24px); }
    .dpo-toast.show { opacity: 1; transform: translate(-50%, 0); }
    .dpo-toast.err { background: #b91c1c; }
    
    @media (max-width: 767.98px) { .dpo-desk { display: none; } .dpo-mob { display: block; } }
    </style>
    
    <div class="container-fluid px-0">
        <!-- Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
            <div>
                <h4 class="fw-bold text-dark m-0 d-flex align-items-center gap-2 font-display">
                    <i class="bi bi-wallet2 text-primary"></i> Validasi Pembayaran PO
                </h4>
            </div>
        </div>
    
        <check if="{{ @error_message }}">
            <div class="alert alert-danger d-flex align-items-center border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5 text-danger"></i>
                <div class="small">{{ @error_message }}</div>
            </div>
        </check>

        <!-- KARTU METRIK KPI RINGKASAN -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-4">
                <div class="metric-card cursor-pointer" onclick="window.dvmSetTab('semua')">
                    <div>
                        <span class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 0.05em;">Total PO</span>
                        <h3 class="fw-bold text-dark mb-0 mt-1" id="metricTotal">0</h3>
                        <span class="small text-muted" style="font-size: 0.75rem;">Semua status</span>
                    </div>
                    <div class="metric-icon-box" style="background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1;">
                        <i class="bi bi-clipboard2-data"></i>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-4">
                <div class="metric-card cursor-pointer" onclick="window.dvmSetTab('perlu')">
                    <div>
                        <span class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 0.05em;">Perlu Divalidasi</span>
                        <h3 class="fw-bold text-warning mb-0 mt-1" id="metricPerlu">0</h3>
                        <span class="small text-muted" style="font-size: 0.75rem;">Menunggu verifikasi mitra</span>
                    </div>
                    <div class="metric-icon-box" style="background-color: #fef3c7; color: #d97706;">
                        <i class="bi bi-hourglass-split"></i>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="metric-card cursor-pointer" onclick="window.dvmSetTab('disetujui')">
                    <div>
                        <span class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 0.05em;">Sudah Disetujui</span>
                        <h3 class="fw-bold text-success mb-0 mt-1" id="metricDisetujui">0</h3>
                        <span class="small text-muted" style="font-size: 0.75rem;">Didisposisi ke Keuangan</span>
                    </div>
                    <div class="metric-icon-box" style="background-color: #ecfdf5; color: #047857;">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABEL UTAMA DENGAN FILTER TABS WRAPPER -->
        <div class="card border-0 shadow-sm overflow-hidden mb-4">
            <div class="filter-tabs-wrapper">
                <ul class="nav d-flex align-items-center gap-2 flex-wrap mb-0 p-0 border-0" id="dpoTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link filter-tab-pill active" id="tab-perlu" data-tab="perlu" type="button">
                            <i class="bi bi-hourglass-split text-warning"></i>
                            <span>Perlu Divalidasi</span>
                            <span class="count-chip" id="countPerlu">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link filter-tab-pill" id="tab-disetujui" data-tab="disetujui" type="button">
                            <i class="bi bi-check-circle-fill text-success"></i>
                            <span>Sudah Disetujui</span>
                            <span class="count-chip chip-success" id="countDisetujui">0</span>
                        </button>
                    </li>
                </ul>
            </div>

            <!-- FILTER PENCARIAN & DROPDOWN -->
            <div class="card-body p-3 p-md-4 border-bottom bg-light">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md-5 col-lg-4">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="search" class="form-control border-start-0" id="dpoSearch" placeholder="Cari nomor PO, order, atau mitra...">
                        </div>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2">
                        <select class="form-select form-select-sm" id="dpoDivisi">
                            <option value="">Semua Divisi</option>
                            <option value="lingkungan">Lingkungan</option>
                            <option value="selulosa">Selulosa</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2 col-lg-2">
                        <select class="form-select form-select-sm" id="dpoBulan" hidden></select>
                    </div>
                    <div class="col-6 col-md-2 col-lg-2">
                        <select class="form-select form-select-sm" id="dpoTahun" hidden></select>
                    </div>
                </div>
            </div>

            <div id="dpoList"></div>
        </div>
    
        <div class="modal fade" id="modalValidasi" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content dpo-sheet">
                    <div class="dpo-sheet-head">
                        <div class="dpo-icon"><i class="bi bi-wallet2"></i></div>
                        <div style="flex:1;min-width:0;">
                            <h6 class="modal-title" id="dvJudul">Validasi Pembayaran</h6>
                            <div class="dpo-sheet-sub" id="dvSub">-</div>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>

                    </div>
                    <div class="dpo-sheet-foot">
                        <button type="button" class="btn btn-white btn-sm" id="dvSimpanCatatan"><i class="bi bi-save me-1"></i>Simpan catatan</button>
                        <button type="button" class="btn btn-primary btn-sm" id="dvValidasi" disabled><i class="bi bi-check2-circle me-1"></i>Validasi (Disposisi ke Keuangan)</button>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- [BARU] Modal preview PO -- pakai fragment HTML yang sama kayak "Review PO"
             di halaman Daftar PO (bukan cetak PDF, soalnya PO belum tentu punya file
             PDF jadi -- ini di-generate dari data langsung). Cuma buat dilihat, jadi
             aksinya cuma Tutup. -->
        <div class="modal fade" id="modalPreviewPoFile" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header">
                        <h6 class="modal-title fw-bold"><i class="bi bi-file-earmark-pdf text-primary me-2"></i>File PO</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body p-0" style="background:#e9ecef;">
                        <div id="dpoPreviewPoBody" class="p-3">
                            <div class="dpo-loading"><i class="bi bi-hourglass-split d-block mb-1" style="font-size:22px;"></i>Memuat PO...</div>
                        </div>
                    </div>

                    </div>

        <div class="dpo-toast" id="dpoToast" role="status"></div>

    <script>
    (function () {
        var BASE = '{{ @BASE }}';
        var CSRF = '{{ @csrf_token }}';
        var DATA_PERLU = {{ @daftar_po_json | raw }};
        var DATA_DISETUJUI = {{ @daftar_disetujui_json | raw }};
        var BULAN_INI = {{ @bulan_ini }};
        var TAHUN_INI = {{ @tahun_ini }};
        var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
        var BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var DIVISI_LABEL = { lingkungan: 'Lingkungan', selulosa: 'Selulosa' };

        var tab = 'perlu';
        var q = '';
        var divisi = '';
        var bulan = String(BULAN_INI);
        var tahun = String(TAHUN_INI);
        var current = null;

        function $(id) { return document.getElementById(id); }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function rp(n) { return 'Rp ' + Math.round(parseFloat(n) || 0).toLocaleString('id-ID'); }
        function tglSingkat(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1] + ' ' + m[1] : '-'; }

        function pillsFor(p) {
            var h = p.lunas
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"><i class="bi bi-check-circle-fill me-1"></i>Lunas</span>'
                : '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1"><i class="bi bi-hourglass-split me-1"></i>Belum Lunas</span>';
            if (p.punya_kesanggupan) {
                h += ' <span class="badge bg-light text-secondary border px-2 py-1"><i class="bi bi-file-earmark-text me-1"></i>Ada Kesanggupan</span>';
            }
            return '<div class="d-flex flex-wrap gap-1">' + h + '</div>';
        }

        function divisiPill(d) {
            if (!d) return '';
            var isSelulosa = d === 'selulosa';
            return '<span class="badge ' + (isSelulosa ? 'badge-selulosa' : 'badge-lingkungan') + '">' + esc(DIVISI_LABEL[d] || d) + '</span>';
        }

        window.dvmSetTab = function(t) {
            if (t === 'semua') {
                tab = 'perlu'; // Default ke perlu jika klik semua
            } else {
                tab = t;
            }
            document.querySelectorAll('#dpoTabs [data-tab]').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-tab') === tab);
            });
            dvmPage = 1;
            render();
        };

        // [BARU] Isi opsi dropdown Bulan & Tahun sekali di awal. Tahun diambil
        // dari data yang ada + tahun berjalan, biar gak ada opsi kosong gak
        // berguna tapi tetep selalu ada tahun ini meski belum ada PO disetujui.
        function isiOpsiFilter() {
            var selBulan = $('dpoBulan');
            selBulan.innerHTML = '<option value="">Semua Bulan</option>' +
                BULAN_PANJANG.map(function (nama, i) { return '<option value="' + (i + 1) + '">' + nama + '</option>'; }).join('');
            selBulan.value = bulan;

            var tahunSet = {};
            tahunSet[TAHUN_INI] = true;
            DATA_DISETUJUI.forEach(function (p) { if (p.tahun) { tahunSet[p.tahun] = true; } });
            var daftarTahun = Object.keys(tahunSet).map(Number).sort(function (a, b) { return b - a; });

            var selTahun = $('dpoTahun');
            selTahun.innerHTML = '<option value="">Semua Tahun</option>' +
                daftarTahun.map(function (th) { return '<option value="' + th + '">' + th + '</option>'; }).join('');
            selTahun.value = tahun;
        }

        function cocokTeks(p) {
            if (!q) { return true; }
            return (p.nomor + ' ' + p.order + ' ' + p.mitra).toLowerCase().indexOf(q) !== -1;
        }
        function cocokDivisi(p) {
            return !divisi || p.divisi === divisi;
        }

        var dvmPage = 1;
        var dvmPerPage = 10;

        window.dvmGoPage = function(p, shouldScroll) {
            dvmPage = p;
            render();
            if (shouldScroll) {
                var el = $('dpoList');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        };

        function bikinPaginationHtml(totalRows, curPage, perPage, isTop) {
            var totalPages = Math.ceil(totalRows / perPage);
            if (totalPages <= 1) return '';
            var startIdx = (curPage - 1) * perPage;
            var endIdx = Math.min(startIdx + perPage, totalRows);
            var displayStart = startIdx + 1;
            var displayEnd = endIdx;
            var borderClass = isTop ? 'border-bottom' : 'border-top';

            var html = '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 bg-white ' + borderClass + '">' +
                '<span class="small text-muted fw-medium">Menampilkan <strong>' + displayStart + '&ndash;' + displayEnd + '</strong> dari <strong>' + totalRows + '</strong> data</span>' +
                '<ul class="pagination pagination-sm mb-0">' +
                '<li class="page-item ' + (curPage <= 1 ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="window.dvmGoPage(' + (curPage - 1) + ', ' + (isTop ? 'false' : 'true') + '); return false;">&laquo; Sebelumnya</a></li>';
            for (var i = 1; i <= totalPages; i++) {
                html += '<li class="page-item ' + (i === curPage ? 'active' : '') + '"><a class="page-link" href="#" onclick="window.dvmGoPage(' + i + ', ' + (isTop ? 'false' : 'true') + '); return false;">' + i + '</a></li>';
            }
            html += '<li class="page-item ' + (curPage >= totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" onclick="window.dvmGoPage(' + (curPage + 1) + ', ' + (isTop ? 'false' : 'true') + '); return false;">Berikutnya &raquo;</a></li>' +
                '</ul></div>';
            return html;
        }

        function render() {
            var nPerlu = DATA_PERLU.length;
            var nDisetujui = DATA_DISETUJUI.length;
            var nTotal = nPerlu + nDisetujui;

            if ($('countPerlu')) $('countPerlu').textContent = nPerlu;
            if ($('countDisetujui')) $('countDisetujui').textContent = nDisetujui;
            if ($('metricTotal')) $('metricTotal').textContent = nTotal;
            if ($('metricPerlu')) $('metricPerlu').textContent = nPerlu;
            if ($('metricDisetujui')) $('metricDisetujui').textContent = nDisetujui;

            // Filter bulan/tahun cuma relevan buat tab "Sudah Disetujui" -- di tab
            // "Perlu Divalidasi" semua PO yang nyangkut emang harus kelihatan,
            // gak peduli kapan dikirimnya.
            $('dpoBulan').hidden = tab !== 'disetujui';
            $('dpoTahun').hidden = tab !== 'disetujui';

            if (tab === 'perlu') {
                renderPerlu(DATA_PERLU.filter(cocokTeks).filter(cocokDivisi));
            } else {
                var rows = DATA_DISETUJUI.filter(cocokTeks).filter(cocokDivisi).filter(function (p) {
                    if (bulan && String(p.bulan) !== bulan) { return false; }
                    if (tahun && String(p.tahun) !== tahun) { return false; }
                    return true;
                });
                renderDisetujui(rows);
            }
        }

        function renderPerlu(rows) {
            if (!rows.length) {
                var pesan = (q || divisi) ? 'Tidak ada PO yang cocok dengan pencarian/filter.' : 'Belum ada PO yang perlu divalidasi.';
                $('dpoList').innerHTML = '<div class="text-center py-5 text-muted"><div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle p-3 mb-2" style="width: 56px; height: 56px;"><i class="bi bi-inbox fs-3 text-muted"></i></div><div class="fw-semibold text-dark mt-2">' + pesan + '</div></div>';
                return;
            }

            var totalRows = rows.length;
            var totalPages = Math.ceil(totalRows / dvmPerPage);
            if (dvmPage > totalPages) dvmPage = totalPages || 1;
            if (dvmPage < 1) dvmPage = 1;

            var startIdx = (dvmPage - 1) * dvmPerPage;
            var endIdx = startIdx + dvmPerPage;
            var pagedRows = rows.slice(startIdx, endIdx);

            var tabel = '<div class="table-responsive d-none d-md-block"><table class="table table-hover align-middle mb-0" data-no-paginate="true"><thead class="table-light"><tr><th style="width: 48px;" class="text-center">No</th><th style="width: 190px;">No. PO</th><th>Mitra</th><th>Kegiatan</th><th style="width: 170px;">Status Bayar</th><th style="width: 120px;" class="text-center">Aksi</th></tr></thead><tbody>' +
                pagedRows.map(function (p, idx) {
                    return '<tr><td class="text-center text-muted small">' + (startIdx + idx + 1) + '</td>' +
                        '<td><div class="fw-bold font-monospace text-primary">' + esc(p.nomor) + '</div><div class="small text-muted mt-1">' + esc(p.order) + ' &middot; Dikirim ' + tglSingkat(p.dikirim) + '</div></td>' +
                        '<td><strong class="text-dark">' + esc(p.mitra) + '</strong></td>' +
                        '<td><div class="text-dark">' + esc(p.judul) + '</div></td>' +
                        '<td>' + pillsFor(p) + '</td>' +
                        '<td class="text-center"><button type="button" class="btn btn-primary btn-sm px-3 fw-semibold shadow-sm" data-buka="' + p.id + '"><i class="bi bi-search me-1"></i>Review</button></td></tr>';
                }).join('') + '</tbody></table></div>';

            var kartu = '<div class="d-md-none p-3">' + pagedRows.map(function (p) {
                return '<div class="card border shadow-sm p-3 mb-3"><div class="fw-bold font-monospace text-primary mb-1">' + esc(p.nomor) + '</div><div class="fw-semibold text-dark">' + esc(p.mitra) + '</div>' +
                    '<div class="small text-muted my-2">' + esc(p.judul) + '</div><div class="mb-3">' + pillsFor(p) + '</div>' +
                    '<button type="button" class="btn btn-primary btn-sm w-100 fw-semibold" data-buka="' + p.id + '"><i class="bi bi-search me-1"></i>Review</button></div>';
            }).join('') + '</div>';

            var paginationTop = bikinPaginationHtml(totalRows, dvmPage, dvmPerPage, true);
            var paginationBottom = bikinPaginationHtml(totalRows, dvmPage, dvmPerPage, false);

            $('dpoList').innerHTML = paginationTop + tabel + kartu + paginationBottom;
        }

        function renderDisetujui(rows) {
            if (!rows.length) {
                var pesan = (q || divisi || bulan || tahun) ? 'Tidak ada PO yang cocok dengan pencarian/filter.' : 'Belum ada PO yang disetujui bulan ini.';
                $('dpoList').innerHTML = '<div class="text-center py-5 text-muted"><div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle p-3 mb-2" style="width: 56px; height: 56px;"><i class="bi bi-inbox fs-3 text-muted"></i></div><div class="fw-semibold text-dark mt-2">' + pesan + '</div></div>';
                return;
            }

            var totalRows = rows.length;
            var totalPages = Math.ceil(totalRows / dvmPerPage);
            if (dvmPage > totalPages) dvmPage = totalPages || 1;
            if (dvmPage < 1) dvmPage = 1;

            var startIdx = (dvmPage - 1) * dvmPerPage;
            var endIdx = startIdx + dvmPerPage;
            var pagedRows = rows.slice(startIdx, endIdx);

            var tabel = '<div class="table-responsive d-none d-md-block"><table class="table table-hover align-middle mb-0" data-no-paginate="true"><thead class="table-light"><tr><th style="width: 48px;" class="text-center">No</th><th style="width: 190px;">No. PO</th><th>Mitra</th><th>Kegiatan</th><th style="width: 130px;">Divisi</th><th style="width: 140px;">Disetujui</th><th style="width: 120px;" class="text-center">Aksi</th></tr></thead><tbody>' +
                pagedRows.map(function (p, idx) {
                    return '<tr><td class="text-center text-muted small">' + (startIdx + idx + 1) + '</td>' +
                        '<td><div class="fw-bold font-monospace text-primary">' + esc(p.nomor) + '</div><div class="small text-muted mt-1">' + esc(p.order) + '</div></td>' +
                        '<td><strong class="text-dark">' + esc(p.mitra) + '</strong></td>' +
                        '<td><div class="text-dark">' + esc(p.judul) + '</div></td>' +
                        '<td>' + divisiPill(p.divisi) + '</td>' +
                        '<td><div class="small text-muted"><b>' + tglSingkat(p.tanggal) + '</b></div></td>' +
                        '<td class="text-center"><button type="button" class="btn btn-outline-secondary btn-sm px-3 fw-semibold" data-buka="' + p.id + '"><i class="bi bi-eye me-1"></i>Lihat</button></td></tr>';
                }).join('') + '</tbody></table></div>';

            var kartu = '<div class="d-md-none p-3">' + pagedRows.map(function (p) {
                return '<div class="card border shadow-sm p-3 mb-3"><div class="fw-bold font-monospace text-primary mb-1">' + esc(p.nomor) + '</div><div class="fw-semibold text-dark">' + esc(p.mitra) + '</div>' +
                    '<div class="small text-muted my-2">' + esc(p.judul) + '</div><div class="mb-2">' + divisiPill(p.divisi) + '</div>' +
                    '<div class="small text-muted mb-3">Disetujui <b>' + tglSingkat(p.tanggal) + '</b></div>' +
                    '<button type="button" class="btn btn-outline-secondary btn-sm w-100 fw-semibold" data-buka="' + p.id + '"><i class="bi bi-eye me-1"></i>Lihat Detail</button></div>';
            }).join('') + '</div>';

            var paginationTop = bikinPaginationHtml(totalRows, dvmPage, dvmPerPage, true);
            var paginationBottom = bikinPaginationHtml(totalRows, dvmPage, dvmPerPage, false);

            $('dpoList').innerHTML = paginationTop + tabel + kartu + paginationBottom;
        }
    
        function api(url, opts) {
            opts = opts || {};
            opts.credentials = 'same-origin';
            return fetch(url, opts).then(function (r) {
                return r.text().then(function (t) {
                    var j;
                    try { j = JSON.parse(t); } catch (e) { throw new Error('Server membalas ' + r.status + ' (bukan JSON).'); }
                    if (!r.ok || !j.ok) { throw new Error(j.pesan || 'Terjadi kesalahan.'); }
                    return j;
                });
            });
        }
        function post(url, data) {
            var body = new URLSearchParams();
            body.append('csrf_token', CSRF);
            Object.keys(data || {}).forEach(function (k) { body.append(k, data[k]); });
            return api(url, { method: 'POST', body: body });
        }
    
        function renderDetail(j) {
            $('dvJudul').textContent = 'Validasi ' + j.po.nomor;
            $('dvSub').textContent = j.order.nomor + ' \u00b7 ' + j.order.judul;
    
            var stat = '<div class="dpo-stats">' +
                '<div class="dpo-stat"><div class="l">Nilai kontrak</div><div class="v">' + rp(j.nilai) + '</div></div>' +
                '<div class="dpo-stat"><div class="l">Total terbayar</div><div class="v ' + (j.lunas ? 'ok' : 'warn') + '">' + rp(j.total_terbayar) + '</div></div>' +
                '</div>';
    
            // [BARU] Lihat isi PO-nya sendiri -- PO gak selalu punya file PDF jadi,
            // jadi dipakein fragment preview yang sama kayak "Review PO" di halaman
            // Daftar PO (digenerate dari data, bukan dari file).
            var kat = '<div class="dpo-cat"><div class="dpo-cat-top"><div class="dpo-cat-ic"><i class="bi bi-file-earmark-pdf"></i></div><div class="dpo-cat-label">File PO</div>' +
                '<button type="button" class="btn btn-white btn-sm" data-preview-po="' + j.po.id + '"><i class="bi bi-eye me-1"></i>Lihat file PO</button>' + '</div></div>';

            kat += '<div class="dpo-cat"><div class="dpo-cat-top"><div class="dpo-cat-ic"><i class="bi bi-file-earmark-text"></i></div><div class="dpo-cat-label">Surat Kesanggupan Bayar</div>' +
                (j.kesanggupan.ada ? '<a class="btn btn-white btn-sm" href="' + j.kesanggupan.url + '" target="_blank" rel="noopener"><i class="bi bi-eye me-1"></i>Lihat file</a>' : '<span class="dpo-cat-kosong">Tidak ada</span>') + '</div></div>';
    
            kat += '<div class="dpo-cat"><div class="dpo-cat-top"><div class="dpo-cat-ic"><i class="bi bi-receipt"></i></div><div class="dpo-cat-label">Bukti Pembayaran</div>' +
                (j.termin.length ? '' : '<span class="dpo-cat-kosong">Belum ada</span>') + '</div>' +
                j.termin.map(function (t) {
                    var st = t.status_verifikasi === 'terverifikasi' ? '<span class="dpo-pill emerald">Terverifikasi</span>' : (t.status_verifikasi === 'ditolak' ? '<span class="dpo-pill" style="background:#fff1f2;color:#be123c;border-color:#fecdd3;">Ditolak</span>' : '<span class="dpo-pill amber">Menunggu</span>');
                    return '<div class="dpo-termin-row"><span class="dpo-termin-info">Termin ke-' + esc(t.termin_ke) + ' &middot; ' + rp(t.jumlah) + ' &middot; ' + tglSingkat(t.tanggal_bayar) + ' ' + st + '</span>' +
                        (t.url ? '<a class="btn btn-white btn-sm" href="' + t.url + '" target="_blank" rel="noopener"><i class="bi bi-eye me-1"></i>Lihat file</a>' : '<span class="dpo-cat-kosong">Tanpa file</span>') + '</div>';
                }).join('') + '</div>';
    
            var catatan = '<label class="dpo-catatan-label">Catatan Tim Mitra</label><textarea class="dpo-textarea" id="dvCatatan" placeholder="Catatan opsional untuk Humas / arsip...">' + esc(j.po.catatan) + '</textarea>';
    
            var gate;
            if (j.po.sudah_disetujui) {
                gate = '<div class="dpo-gate ok"><i class="bi bi-check2-circle"></i><span>PO ini sudah divalidasi &amp; didisposisikan ke Keuangan.</span></div>';
            } else {
                gate = j.bisa_validasi
                    ? '<div class="dpo-gate ok"><i class="bi bi-check-circle"></i><span>Syarat terpenuhi. PO ini bisa divalidasi.</span></div>'
                    : '<div class="dpo-gate warn"><i class="bi bi-exclamation-triangle"></i><span>Belum bisa divalidasi: order ini belum lunas dan belum ada surat kesanggupan bayar.</span></div>';
            }

            $('dvBody').innerHTML = stat + kat + catatan + gate;
            // [BARU] PO yang udah disetujui gak perlu lagi divalidasi -- tombolnya
            // disembunyiin aja (bukan cuma di-disable) biar jelas aksinya udah kelar.
            $('dvValidasi').hidden = !!j.po.sudah_disetujui;
            $('dvValidasi').disabled = !j.bisa_validasi;
        }
    
        function bukaModal(id) {
            current = id;
            $('dvJudul').textContent = 'Memuat...';
            $('dvSub').textContent = '-';
            $('dvBody').innerHTML = '<div class="dpo-loading"><i class="bi bi-hourglass-split d-block mb-1" style="font-size:22px;"></i>Memuat...</div>';
            $('dvValidasi').disabled = true;
            $('dvValidasi').hidden = false;
    
            api(BASE + '/po-kegiatan/' + id + '/validasi-detail').then(renderDetail).catch(function (e) {
                $('dvBody').innerHTML = '<div class="dpo-loading" style="color:#b91c1c;"><i class="bi bi-exclamation-triangle d-block mb-1" style="font-size:22px;"></i>' + esc(e.message) + '</div>';
            });
    
            bootstrap.Modal.getOrCreateInstance($('modalValidasi')).show();
        }
    
        var toastTimer;
        function toast(text, galat) {
            var t = $('dpoToast');
            t.textContent = text;
            t.classList.toggle('err', !!galat);
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, galat ? 6000 : 4000);
        }
    
        function bukaPreviewPoFile(id) {
            var body = $('dpoPreviewPoBody');
            body.innerHTML = '<div class="dpo-loading"><i class="bi bi-hourglass-split d-block mb-1" style="font-size:22px;"></i>Memuat PO...</div>';
            bootstrap.Modal.getOrCreateInstance($('modalPreviewPoFile')).show();
            fetch(BASE + '/po-kegiatan/' + id + '/preview', { credentials: 'same-origin' })
                .then(function (res) { if (!res.ok) throw new Error('Gagal memuat PO'); return res.text(); })
                .then(function (html) { body.innerHTML = html; })
                .catch(function () {
                    body.innerHTML = '<div class="text-center text-danger py-5"><i class="bi bi-exclamation-triangle d-block mb-1" style="font-size:22px;"></i>Gagal memuat data PO.</div>';
                });
        }

        document.addEventListener('click', function (e) {
            var el = e.target.closest('[data-buka]');
            if (el) { bukaModal(el.getAttribute('data-buka')); return; }
            var tabBtn = e.target.closest('[data-tab]');
            if (tabBtn) {
                tab = tabBtn.getAttribute('data-tab');
                document.querySelectorAll('#dpoTabs [data-tab]').forEach(function (b) { b.classList.toggle('active', b === tabBtn); });
                dvmPage = 1;
                render();
                return;
            }
            var previewBtn = e.target.closest('[data-preview-po]');
            if (previewBtn) { bukaPreviewPoFile(previewBtn.getAttribute('data-preview-po')); }
        });
        $('dpoSearch').addEventListener('input', function () { q = this.value.trim().toLowerCase(); dvmPage = 1; render(); });
        $('dpoDivisi').addEventListener('change', function () { divisi = this.value; dvmPage = 1; render(); });
        $('dpoBulan').addEventListener('change', function () { bulan = this.value; dvmPage = 1; render(); });
        $('dpoTahun').addEventListener('change', function () { tahun = this.value; dvmPage = 1; render(); });

        $('dvSimpanCatatan').addEventListener('click', function () {
            if (!current) { return; }
            var catatan = $('dvCatatan') ? $('dvCatatan').value : '';
            post(BASE + '/po-kegiatan/' + current + '/catatan', { catatan: catatan })
                .then(function () { toast('Catatan tersimpan.'); })
                .catch(function (e) { toast(e.message, true); });
        });
    
        // [BARU] Popup konfirmasi validasi disamain kayak popup "Disposisi ke Tim
        // Keuangan" di halaman Detail Order (SweetAlert2), bukan window.confirm()
        // bawaan browser lagi -- jatuh balik ke confirm() biasa kalau SweetAlert2
        // kebetulan belum/gagal kemuat.
        function jalankanValidasi(btn) {
            var catatan = $('dvCatatan') ? $('dvCatatan').value : '';
            btn.disabled = true;
            post(BASE + '/po-kegiatan/' + current + '/validasi', { catatan: catatan }).then(function () {
                // [BARU] Begitu divalidasi, PO-nya pindah dari tab "Perlu Divalidasi"
                // ke tab "Sudah Disetujui" tanpa perlu reload halaman -- tanggalnya
                // dicatet pakai waktu sekarang di browser (hampir pasti sama kayak
                // NOW() di server).
                var lama = DATA_PERLU.find(function (p) { return p.id == current; }) || null;
                DATA_PERLU = DATA_PERLU.filter(function (p) { return p.id != current; });
                var sekarang = new Date();
                DATA_DISETUJUI.unshift({
                    id: Number(current),
                    nomor: lama ? lama.nomor : '',
                    order: lama ? lama.order : '',
                    mitra: lama ? lama.mitra : '',
                    judul: lama ? lama.judul : '',
                    divisi: lama ? lama.divisi : '',
                    nilai: lama ? lama.nilai : 0,
                    catatan: catatan,
                    tanggal: sekarang.toISOString().slice(0, 10),
                    bulan: sekarang.getMonth() + 1,
                    tahun: sekarang.getFullYear()
                });
                isiOpsiFilter();
                render();
                bootstrap.Modal.getOrCreateInstance($('modalValidasi')).hide();
                toast('PO berhasil divalidasi dan didisposisikan ke Keuangan.');
            }).catch(function (e) {
                toast(e.message, true);
                btn.disabled = false;
            });
        }

        $('dvValidasi').addEventListener('click', function () {
            if (!current) { return; }
            var btn = this;

            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'Validasi PO ini?',
                    text: 'PO akan ditandai disetujui dan didisposisikan ke Keuangan. PO akan terkunci setelah divalidasi.',
                    icon: 'question',
                    iconColor: '#0f172a',
                    background: '#ffffff',
                    showCancelButton: true,
                    confirmButtonText: '<i class="bi bi-check2-circle me-1"></i> Ya, Validasi dan disposisikan',
                    cancelButtonText: 'Batal',
                    reverseButtons: true,
                    customClass: {
                        popup: 'bg-white rounded-3 shadow border p-4',
                        title: 'fw-bold text-dark fs-6 mb-1',
                        htmlContainer: 'text-muted small mb-3',
                        confirmButton: 'btn btn-dark btn-sm px-3 py-1.5 fw-semibold',
                        cancelButton: 'btn btn-outline-secondary btn-sm px-3 py-1.5 me-2'
                    },
                    buttonsStyling: false
                }).then(function (result) {
                    if (result.isConfirmed) { jalankanValidasi(btn); }
                });
            } else if (window.confirm('Validasi PO ini dan disposisikan ke Keuangan? PO akan terkunci setelah divalidasi.')) {
                jalankanValidasi(btn);
            }
        });

        isiOpsiFilter();
        render();
    })();
    </script>
