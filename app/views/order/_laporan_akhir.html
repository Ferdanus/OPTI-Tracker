<!-- ===================================================================== -->
<!-- LAPORAN AKHIR (tahap baru, ditambahkan Kaa) -- kartu Tahap 10        -->
<!-- Data awal dari OrderController (variabel @laporan_akhir), aksi lewat  -->
<!-- LaporanAkhirController. Gaya dialog disamakan dengan dialog "ut-"      -->
<!-- di Daftar PO (ikon bulat, ringkasan abu muda, tombol hitam-putih).     -->
<!-- ===================================================================== -->
<style>
    @keyframes laFade { from { opacity:0; } to { opacity:1; } }
    @keyframes laRise { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes laOut { to { opacity:0; } }
    @keyframes laPop { 0% { opacity:0; transform:scale(.92) translateY(6px); } 60% { transform:scale(1.02); } 100% { opacity:1; transform:none; } }
    @keyframes laBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @keyframes laDraw { to { stroke-dashoffset:0; } }
    @keyframes laBurst { 0% { transform:translate(0,0) scale(1); opacity:1; } 100% { transform:translate(var(--x),var(--y)) scale(.3); opacity:0; } }
    @keyframes laFadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes laFill { from { width:0; } to { width:100%; } }

    #cardLaporanAkhir .la-body { padding:1.5rem; }
    #cardLaporanAkhir .la-kunci { padding:1rem; text-align:center; color:#6c757d; background:#f8f9fa; border-radius:.75rem; font-size:.875rem; }
    #cardLaporanAkhir .la-drop { display:flex; align-items:center; justify-content:center; text-align:center; gap:12px; flex-wrap:wrap; border:1.5px dashed #94a3b8; border-radius:10px; padding:22px 16px; background:#f8fafc; cursor:pointer; transition:background .15s, border-color .15s; color:#64748b; font-size:.85rem; }
    #cardLaporanAkhir .la-drop:hover, #cardLaporanAkhir .la-drop.la-drag { background:#e2e8f0; border-color:#1e293b; }
    #cardLaporanAkhir .la-drop b { display:block; color:#1e293b; font-size:.9rem; }
    #cardLaporanAkhir .la-arr { display:inline-block; font-size:1.4rem; color:#1e293b; animation:laBob 1.6s ease-in-out infinite; }
    #cardLaporanAkhir .la-file, .la-ov .la-file { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border:1px solid #cbd5e1; border-radius:10px; padding:12px 16px; background:#f8fafc; animation:laPop .4s cubic-bezier(.2,.8,.3,1.1) both; }
    .la-pdf { font-size:.62rem; font-weight:800; color:#b91c1c; background:#fee2e2; border-radius:5px; width:34px; height:40px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; flex:none; }
    .la-fn { min-width:0; flex:1; }
    .la-fn .nm { font-weight:600; font-size:.88rem; overflow-wrap:anywhere; }
    .la-fn small { color:#64748b; }
    .la-bar { height:5px; border-radius:99px; background:#e2e8f0; overflow:hidden; margin-top:6px; }
    .la-bar > div { height:100%; width:0; border-radius:99px; background:#1e293b; transition:width .12s linear; }
    .la-bar.ok > div { width:100%; background:#198754; transition:none; }
    .la-tick { color:#198754; font-weight:800; margin-left:6px; }
    #cardLaporanAkhir .la-foot { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 24px; border-top:1px solid #e2e8f0; background:#f8fafc; border-radius:0 0 12px 12px; }
    #cardLaporanAkhir .la-foot .la-ht { font-size:.78rem; color:#64748b; }
    #cardLaporanAkhir .la-sp { flex:1; }
    #cardLaporanAkhir .la-selesai { display:flex; gap:10px; align-items:center; background:#ecfdf3; border:1px solid #bbf7d0; color:#14532d; border-radius:10px; padding:12px 14px; font-size:.86rem; }
    #cardLaporanAkhir .la-selesai svg { flex:none; }
    #cardLaporanAkhir .la-pesan { margin-bottom:12px; border-radius:10px; padding:10px 14px; font-size:.82rem; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }

    .la-ov { position:fixed; inset:0; background:rgba(15,23,42,.55); display:grid; place-items:center; padding:16px; z-index:2000; overflow-y:auto; animation:laFade .2s ease both; }
    .la-ov.out { animation:laOut .18s ease both; }
    .la-dlg { width:min(520px,100%); background:#fff; border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.35); padding:22px; animation:laRise .28s cubic-bezier(.2,.8,.2,1) both; max-height:calc(100vh - 32px); overflow-y:auto; color:#1e293b; position:relative; }
    .la-ov.out .la-dlg { opacity:0; transform:translateY(8px); transition:all .18s; }
    .la-dlg h5 { font-size:1.05rem; font-weight:800; margin:0; }
    .la-dlg p { margin:6px 0 0; color:#475569; font-size:.86rem; }
    .la-big { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; margin-bottom:12px; background:#e2e8f0; color:#1e293b; font-size:1.4rem; font-weight:700; }
    .la-sum { margin-top:14px; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; padding:10px 12px; font-size:.82rem; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
    .la-sum span { color:#64748b; } .la-sum b { word-break:break-word; }
    .la-hint { margin-top:12px; font-size:.78rem; color:#64748b; }
    .la-dfoot { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px; }
    .la-suk { text-align:center; padding:14px 0 10px; position:relative; }
    .la-suk svg { width:64px; height:64px; }
    .la-suk svg circle { stroke-dasharray:63; stroke-dashoffset:63; animation:laDraw .5s ease forwards; }
    .la-suk svg path { stroke-dasharray:20; stroke-dashoffset:20; animation:laDraw .35s ease .45s forwards; }
    .la-suk h5 { margin-top:10px; animation:laFadeUp .4s ease .6s both; }
    .la-suk p { animation:laFadeUp .4s ease .7s both; }
    .la-conf { position:absolute; left:50%; top:46px; width:7px; height:7px; border-radius:50%; pointer-events:none; animation:laBurst .9s ease-out .5s both; }
    @media (prefers-reduced-motion:reduce) { .la-ov, .la-dlg, .la-arr, .la-file, .la-suk * { animation-duration:.01ms !important; transition:none !important; } }
</style>

<div class="system-section-card mb-3" id="cardLaporanAkhir" data-la="{{ @laporan_akhir.json }}">
    <div class="system-section-header">
        <div>
            <h6 class="m-0 fw-bold text-dark d-flex align-items-center gap-2 font-display">
                <span class="badge bg-primary-subtle text-primary rounded-pill px-2 py-0.5 small fw-bold">10</span>
                <i class="bi bi-journal-check text-primary fs-5"></i> Laporan Akhir
                <span class="badge bg-info-subtle text-info border border-info-subtle fw-semibold">Opsional</span>
            </h6>
        </div>
        <span id="laStatus"></span>
    </div>
    <div id="laBody"></div>
</div>
<input type="file" id="laInput" accept="application/pdf,.pdf" hidden>
<div id="laModalRoot"></div>

<script>
(function () {
    var kartu = document.getElementById('cardLaporanAkhir');
    if (!kartu) { return; }
    var S = {};
    try { S = JSON.parse(kartu.getAttribute('data-la') || '{}'); } catch (e) { S = {}; }
    var BASE = '{{ @BASE }}', CSRF = '{{ @csrf_token }}';
    var URL_ORDER = BASE + '/order/' + S.id + '?tahap=11';
    var modal = null, up = 0, pct = 0, pesan = '', sedangKirim = false;
    var elBody = document.getElementById('laBody'), elStatus = document.getElementById('laStatus'), elRoot = document.getElementById('laModalRoot'), inp = document.getElementById('laInput');
    var CEK = '<svg viewBox="0 0 24 24" fill="none" stroke="#198754" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';

    function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function ukuran(b) { b = Number(b) || 0; if (b >= 1048576) { return (b / 1048576).toFixed(1).replace('.', ',') + ' MB'; } return Math.max(1, Math.round(b / 1024)) + ' KB'; }
    function confetti() {
        var c = ['#198754', '#2563eb', '#f59e0b', '#e11d48', '#0f172a'], h = '';
        for (var k = 0; k < 16; k++) {
            var a = (k / 16) * Math.PI * 2, d = 46 + Math.random() * 40;
            h += '<span class="la-conf" style="--x:' + Math.round(Math.cos(a) * d) + 'px;--y:' + Math.round(Math.sin(a) * d) + 'px;background:' + c[k % 5] + ';animation-delay:' + (0.5 + Math.random() * 0.15) + 's"></span>';
        }
        return h;
    }

    // ---------- kartu ----------
    function chip(bisaUbah) {
        var sedang = (up === 1);
        var tombol = '';
        if (!sedang) {
            tombol = '<a class="btn btn-sm btn-outline-dark fw-semibold" target="_blank" rel="noopener" href="' + esc(S.url.lihat) + '">Lihat</a>' +
                     '<a class="btn btn-sm btn-outline-dark fw-semibold" href="' + esc(S.url.lihat) + '?unduh=1">Unduh</a>';
            if (bisaUbah) { tombol += '<button type="button" class="btn btn-sm btn-outline-dark fw-semibold" data-a="ganti">Ganti</button><button type="button" class="btn btn-sm btn-outline-danger fw-semibold" data-a="hapus">Hapus</button>'; }
        }
        return '<div class="la-file"><div class="la-pdf">PDF</div><div class="la-fn"><div class="nm">' + esc(S.nama) + (up === 2 ? '<span class="la-tick">&#10003;</span>' : '') + '</div>' +
               '<small>' + (sedang ? ('Mengunggah&hellip; <span id="laPct">' + pct + '</span>%') : ukuran(S.ukuran) + ' &middot; PDF') + '</small>' +
               '<div class="la-bar' + (sedang ? '' : ' ok') + '"><div id="laBar" style="' + (sedang ? 'width:' + pct + '%' : '') + '"></div></div></div>' +
               (tombol ? '<div class="d-flex gap-2 flex-wrap">' + tombol + '</div>' : '') + '</div>';
    }
    function render() {
        var h = '', st = '';
        if (!S.akses) {
            st = '<span class="badge bg-light text-secondary border"><i class="bi bi-lock-fill me-1"></i> Terkunci (Menunggu PO TTD)</span>';
            h = '<div class="la-body"><div class="la-kunci"><i class="bi bi-lock-fill text-secondary opacity-50 me-1"></i>Laporan Akhir terbuka setelah <strong>PO bertanda tangan di-upload</strong> pada <strong>Tahap 8</strong> (PO Aktif).</div></div>';
        } else if (S.selesai) {
            st = '<span class="badge bg-success text-white"><i class="bi bi-check2-circle me-1"></i> Selesai</span>';
            h = '<div class="la-body">' +
                '<div class="la-selesai">' + CEK.replace('<svg', '<svg width="26" height="26"') + '<div><b>Order selesai.</b> ' + (S.ada ? 'Laporan akhir tersimpan.' : 'Diselesaikan tanpa laporan akhir.') +
                (S.pks ? ' BAST sudah terbuka.' : ' BAST akan terbuka setelah PKS dibuat.') + '</div></div>' +
                (S.ada ? '<div class="mt-3">' + chip(false) + '</div>' : '') +
                ((!S.ada && S.boleh && !S.bast) ? '<div class="mt-3"><button type="button" class="btn btn-sm btn-outline-dark fw-semibold" data-a="pilih">Unggah laporan (jika nanti ada)</button></div>' : '') +
                (S.selesai_oleh ? '<div class="text-muted small mt-3">Diselesaikan oleh <span class="text-dark fw-medium">' + esc(S.selesai_oleh) + '</span>' + (S.selesai_at ? ' &middot; ' + esc(S.selesai_at) : '') + '</div>' : '') +
                '</div>';
        } else if (!S.boleh) {
            st = '<span class="badge bg-light text-secondary border"><i class="bi bi-hourglass-split me-1"></i> Menunggu Ketua Pelaksana / Ketua Tim</span>';
            h = '<div class="la-body"><div class="la-kunci" style="text-align:left"><i class="bi bi-hourglass-split me-1"></i>Pengujian berjalan. Ketua Pelaksana atau Ketua Tim dapat meng-upload laporan akhir (opsional) lalu menekan <strong>Selesai</strong>.</div>' +
                (S.ada ? '<div class="mt-3">' + chip(false) + '</div>' : '') + '</div>';
        } else {
            st = '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle"><i class="bi bi-hourglass-split me-1"></i> Menunggu penyelesaian</span>';
            var area = S.ada
                ? chip(true)
                : '<div class="la-drop" id="laDrop" data-a="pilih"><span class="la-arr">&#8593;</span><div><b>Upload Laporan Akhir (PDF)</b>Klik atau seret file ke sini. Tidak wajib, boleh dikosongkan kalau laporannya rahasia.</div></div>';
            h = '<div class="la-body">' + (pesan ? '<div class="la-pesan">' + esc(pesan) + '</div>' : '') + area + '</div>' +
                '<div class="la-foot"><span class="la-ht">' + (up === 1 ? 'Menunggu unggahan selesai&hellip;' : (S.ada ? 'Laporan akhir terlampir.' : 'Belum ada laporan, order tetap bisa diselesaikan.')) + '</span><span class="la-sp"></span>' +
                '<button type="button" class="btn btn-dark fw-semibold px-3" data-a="selesai"' + (up === 1 ? ' disabled' : '') + '>' + (S.ada ? 'Selesai' : 'Selesai tanpa laporan') + '</button></div>';
        }
        elStatus.innerHTML = st;
        elBody.innerHTML = h;
        var d = document.getElementById('laDrop');
        if (d) {
            ['dragenter', 'dragover'].forEach(function (n) { d.addEventListener(n, function (e) { e.preventDefault(); d.classList.add('la-drag'); }); });
            ['dragleave', 'drop'].forEach(function (n) { d.addEventListener(n, function (e) { e.preventDefault(); d.classList.remove('la-drag'); }); });
            d.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { kirim(f); } });
        }
    }

    // ---------- upload ----------
    function kirim(file) {
        if (sedangKirim) { return; }
        pesan = '';
        var ext = (file.name.split('.').pop() || '').toLowerCase();
        if (ext !== 'pdf' || (file.type && file.type !== 'application/pdf')) { pesan = 'Format file harus PDF.'; render(); return; }
        if (file.size <= 0) { pesan = 'File kosong. Pilih file yang benar.'; render(); return; }
        if (file.size > 31457280) { pesan = 'Ukuran file terlalu besar (' + ukuran(file.size) + '). Maksimal 30 MB.'; render(); return; }
        var sebelum = { ada: S.ada, nama: S.nama, ukuran: S.ukuran };
        sedangKirim = true; up = 1; pct = 0; S.ada = true; S.nama = file.name; S.ukuran = file.size; render();
        var fd = new FormData();
        fd.append('csrf_token', CSRF);
        fd.append('file_laporan', file, file.name);
        var x = new XMLHttpRequest();
        x.open('POST', S.url.unggah);
        x.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        x.upload.onprogress = function (e) {
            if (!e.lengthComputable) { return; }
            pct = Math.round(e.loaded / e.total * 100);
            var b = document.getElementById('laBar'), t = document.getElementById('laPct');
            if (b) { b.style.width = pct + '%'; } if (t) { t.textContent = pct; }
        };
        function gagal(m) { sedangKirim = false; up = 0; S.ada = sebelum.ada; S.nama = sebelum.nama; S.ukuran = sebelum.ukuran; pesan = m; render(); }
        x.onload = function () {
            var r = null; try { r = JSON.parse(x.responseText); } catch (e) {}
            if (r && r.success) { sedangKirim = false; up = 2; S.ada = true; S.nama = r.nama || file.name; S.ukuran = r.ukuran || file.size; render(); }
            else { gagal((r && r.message) ? r.message : 'Gagal meng-upload file. Coba lagi.'); }
        };
        x.onerror = function () { gagal('Koneksi terputus saat meng-upload. Coba lagi.'); };
        x.send(fd);
    }
    inp.addEventListener('change', function () { var f = inp.files && inp.files[0]; inp.value = ''; if (f) { kirim(f); } });

    // ---------- popup ----------
    function dlg(isi) { modal = true; elRoot.innerHTML = '<div class="la-ov" id="laOv"><div class="la-dlg" role="dialog" aria-modal="true">' + isi + '</div></div>'; var o = document.getElementById('laOv'); o.addEventListener('mousedown', function (e) { if (e.target === o && !sedangKirim) { tutup(); } }); }
    function tutup(cb) {
        var o = document.getElementById('laOv');
        if (!o) { modal = null; if (cb) { cb(); } return; }
        o.classList.add('out');
        setTimeout(function () { modal = null; elRoot.innerHTML = ''; if (cb) { cb(); } }, 180);
    }
    function dialogSelesai() {
        var r = S.ringkas || {};
        dlg('<div class="la-big">?</div><h5>Apakah Anda yakin order ini sudah selesai?</h5>' +
            '<p>Periksa kembali data order di bawah. Jika sudah benar, order ditandai selesai' + (S.pks ? ' dan tahap BAST terbuka.' : '. Tahap BAST baru terbuka setelah PKS dibuat.') + '</p>' +
            '<div class="la-sum"><span>No. Order</span><b>' + esc(r.order) + '</b><span>Klien</span><b>' + esc(r.klien) + '</b><span>Layanan</span><b>' + esc(r.layanan) + '</b>' +
            '<span>Judul kegiatan</span><b>' + esc(r.judul) + '</b><span>No. Surat Penawaran</span><b>' + esc(r.penawaran) + '</b><span>Nomor PO</span><b>' + esc(r.po) + '</b>' +
            '<span>Nomor PKS</span><b>' + esc(r.pks || 'Belum dibuat') + '</b></div>' +
            '<div class="la-hint">Pastikan seluruh hasil pengujian sudah lengkap sebelum menyelesaikan order.</div>' +
            '<div class="la-dfoot"><button type="button" class="btn btn-outline-dark fw-semibold" data-d="batal">Belum</button><button type="button" class="btn btn-dark fw-semibold" data-d="ya">Ya, sudah selesai</button></div>');
    }
    function dialogHapus() {
        dlg('<div class="la-big">!</div><h5>Hapus file laporan akhir?</h5><p>File <b style="word-break:break-word">' + esc(S.nama) + '</b> akan dihapus dari sistem.</p>' +
            '<div class="la-dfoot"><button type="button" class="btn btn-outline-dark fw-semibold" data-d="batal">Batal</button><button type="button" class="btn btn-dark fw-semibold" data-d="hapusya">Ya, hapus</button></div>');
    }
    function dialogGalat(m) {
        dlg('<div class="la-big">!</div><h5>Belum berhasil</h5><p>' + esc(m) + '</p><div class="la-dfoot"><button type="button" class="btn btn-dark fw-semibold" data-d="batal">Tutup</button></div>');
    }
    function post(url, sukses, gagal) {
        var fd = new FormData(); fd.append('csrf_token', CSRF);
        var x = new XMLHttpRequest(); x.open('POST', url); x.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        x.onload = function () { var r = null; try { r = JSON.parse(x.responseText); } catch (e) {} if (r && r.success) { sukses(r); } else { gagal((r && r.message) ? r.message : 'Terjadi kesalahan. Coba lagi.'); } };
        x.onerror = function () { gagal('Koneksi terputus. Coba lagi.'); };
        x.send(fd);
    }
    function selesaikan() {
        sedangKirim = true;
        post(S.url.selesai, function (r) {
            sedangKirim = false;
            dlg('<div class="la-suk">' + CEK + '<h5>Order selesai</h5><p>' + (r.pks ? 'BAST sudah terbuka.' : 'BAST akan terbuka setelah PKS dibuat.') + '</p>' + confetti() + '</div>');
            setTimeout(function () { window.location.href = URL_ORDER; }, 1500);
        }, function (m) { sedangKirim = false; tutup(function () { dialogGalat(m); }); });
    }

    document.addEventListener('click', function (e) {
        var d = e.target.closest && e.target.closest('[data-d]');
        if (d && elRoot.contains(d)) {
            var k = d.getAttribute('data-d');
            if (k === 'batal') { tutup(); }
            else if (k === 'ya') { d.disabled = true; selesaikan(); }
            else if (k === 'hapusya') {
                d.disabled = true;
                post(S.url.hapus, function () { S.ada = false; S.nama = ''; S.ukuran = 0; up = 0; pesan = ''; tutup(render); }, function (m) { tutup(function () { dialogGalat(m); }); });
            }
            return;
        }
        var a = e.target.closest && e.target.closest('#cardLaporanAkhir [data-a]');
        if (!a) { return; }
        var k2 = a.getAttribute('data-a');
        if (k2 === 'pilih' || k2 === 'ganti') { inp.click(); }
        else if (k2 === 'selesai') { dialogSelesai(); }
        else if (k2 === 'hapus') { dialogHapus(); }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal && !sedangKirim) { tutup(); } });
    render();
})();
</script>
