<!--
    app/views/order/_kartu_dokumen_css.html
    Gaya kartu "Dokumen" (kelas "kt-") yang dipakai bersama oleh kartu PO bertanda tangan (Tahap 8) dan kartu Kontrak (Tahap 9) di Detail Order.
    Aman di-include lebih dari sekali. JANGAN menulis tag template (include, check, dan sejenisnya) di komentar: Fat-Free ikut memprosesnya.
-->
<style>
    /* ---- Kartu Kontrak di Detail Order (varian Dokumen): miniatur halaman 1 + rincian + tombol ---- */
    .kt-doc { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: center; }

    .kt-th iframe { position: absolute; left: 0; top: 0; width: 816px; height: 1056px; border: 0; background: #fff; transform: scale(.2059); transform-origin: 0 0; opacity: 0; pointer-events: none; transition: opacity .35s; }
