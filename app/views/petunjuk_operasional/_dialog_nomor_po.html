<!--
    app/views/petunjuk_operasional/_dialog_nomor_po.html
    Dialog "Generate Nomor PO" bersama untuk SEMUA halaman Buat PO layanan (Sertifikasi, Pengujian, dst).
    Alur: klik Kirim -> (validasi isian di halaman masing-masing) -> dialog konfirmasi -> klik "Generate Nomor PO"
          -> loading "Menetapkan nomor PO..." -> nomor tampil -> pindah ke Daftar PO.
    Yang SUNGGUHAN hanya satu permintaan ke server (nomor diterbitkan + PO terkirim dalam satu transaksi, urut aman lewat
    penguncian di PoSchema::nomorBaru). Lamanya dialog (durasi) hanya tampilan agar pesan dan nomor sempat terbaca.

    Pemakaian:
      PoNomorDialog.mulai({
          durasi: 4000,                                  // ms, opsional
          kirim:  function () { return Promise<{ok, nomor, message, errors, redirect}>; },   // dipanggil SETELAH klik Generate
          tujuan: function (j) { return 'url Daftar PO'; },
          sukses: function (j) { },                      // opsional, sebelum pindah halaman
          gagal:  function (j) { }                       // opsional, setelah pesan gagal ditutup / bila ada daftar kekurangan (j.errors)
      });
-->
<style>
    .pnd-spin { width: 54px; height: 54px; margin: 6px auto 14px; border-radius: 50%; border: 4px solid #e2e8f0; border-top-color: #334155; animation: pndSpin .8s linear infinite; }
    .pnd-spin.ok { animation: none; border-color: #16a34a; background: #f0fdf4; position: relative; }
    .pnd-spin.ok::after { content: ''; position: absolute; left: 17px; top: 8px; width: 11px; height: 21px; border: solid #16a34a; border-width: 0 4px 4px 0; transform: rotate(45deg); }
    @keyframes pndSpin { to { transform: rotate(360deg); } }
    .pnd-nomor { margin: 4px auto 6px; display: inline-block; padding: 10px 18px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font: 700 1.1rem/1.25 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; word-break: break-all; }
    .pnd-steps { text-align: left; margin: 12px auto 0; max-width: 290px; font-size: .82rem; color: #64748b; }
    .pnd-s { display: flex; align-items: center; gap: 8px; padding: 3px 0; opacity: .45; transition: opacity .2s; }
    .pnd-s.on { opacity: 1; color: #0f172a; }
    .pnd-s .pnd-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #cbd5e1; flex: none; }
    .pnd-s.done .pnd-dot { background: #16a34a; border-color: #16a34a; }
    .pnd-prog { height: 4px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin: 16px 6px 4px; }
    .pnd-prog i { display: block; height: 100%; width: 0; background: #334155; }
</style>
<script>
(function () {
    var DURASI = 4000;
    var KELAS = { popup: 'rounded-4 shadow', title: 'fw-bold fs-5', htmlContainer: 'text-secondary small', confirmButton: 'btn btn-primary px-4 mx-1', cancelButton: 'btn btn-outline-secondary px-4 mx-1' };

    function adaSwal() { return typeof Swal !== 'undefined'; }
    function el(id) { return document.getElementById(id); }

    function langkah(n, selesai) {
        var e = el('pndS' + n);
        if (e) { e.className = 'pnd-s ' + (selesai ? 'done on' : 'on'); }
    }

    function jalan(o, dur) {
        var t0 = Date.now(), timers = [];
        var batal = function () { timers.forEach(clearTimeout); timers = []; };
        var html = '<div class="pnd-spin" id="pndSpin"></div>' +
            '<div id="pndNomor" class="pnd-nomor d-none"></div>' +
            '<div class="text-muted" id="pndTeks">Mohon tunggu, jangan tutup halaman ini.</div>' +
            '<div class="pnd-steps">' +
              '<div class="pnd-s" id="pndS1"><span class="pnd-dot"></span>Memeriksa kelengkapan data</div>' +
              '<div class="pnd-s" id="pndS2"><span class="pnd-dot"></span>Mengambil nomor urut</div>' +
              '<div class="pnd-s" id="pndS3"><span class="pnd-dot"></span>Menyimpan dan mengirim PO</div>' +
            '</div>' +
            '<div class="pnd-prog"><i id="pndBar"></i></div>';
        Swal.fire({
            title: 'Menetapkan nomor PO...', html: html, showConfirmButton: false, showCancelButton: false,
            allowOutsideClick: false, allowEscapeKey: false, customClass: KELAS, buttonsStyling: false,
            didOpen: function () {
                var bar = el('pndBar');
                if (bar) {
                    bar.style.transition = 'width ' + dur + 'ms linear';
                    requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = '100%'; }); });
                }
                langkah(1);
                timers.push(setTimeout(function () { langkah(1, true); langkah(2); }, dur * 0.18));

                var req;
                try { req = Promise.resolve(o.kirim()); }
                catch (e) { req = Promise.resolve({ ok: false, message: 'Terjadi kesalahan, coba lagi.' }); }
                req.then(function (j) {
                    if (!j || !j.ok) {
                        batal();
                        if (j && j.errors && j.errors.length && o.gagal) { o.gagal(j); return; }
                        Swal.fire({ icon: 'error', title: 'Gagal menetapkan nomor', text: (j && j.message) || 'Terjadi kesalahan, silakan coba lagi.',
                            confirmButtonText: 'Oke', customClass: KELAS, buttonsStyling: false })
                            .then(function () { if (o.gagal) { o.gagal(j || {}); } });
                        return;
                    }
                    var lewat = function () { return Date.now() - t0; };
                    // nomor tampil kira-kira di tengah durasi (atau langsung, kalau server lebih lambat dari itu)
                    timers.push(setTimeout(function () {
                        langkah(1, true); langkah(2, true); langkah(3);
                        var t = Swal.getTitle(); if (t) { t.textContent = j.nomor ? 'Nomor PO Anda' : 'Nomor PO ditetapkan'; }
                        var sp = el('pndSpin'); if (sp) { sp.className = 'pnd-spin ok'; }
                        var nm = el('pndNomor'); if (nm && j.nomor) { nm.textContent = j.nomor; nm.classList.remove('d-none'); }
                        var tk = el('pndTeks'); if (tk) { tk.textContent = 'PO sedang dikirim...'; }
                    }, Math.max(0, dur * 0.5 - lewat())));
                    timers.push(setTimeout(function () { langkah(3, true); }, Math.max(0, dur * 0.8 - lewat())));
                    timers.push(setTimeout(function () {
                        if (o.sukses) { try { o.sukses(j); } catch (e) {} }
                        pergi(o.tujuan ? o.tujuan(j) : (j.redirect || window.location.href));
                    }, Math.max(0, dur - lewat())));
                });
            }
        });
    }

    // Halaman dibuka di iframe (window.__poEmbedTop = true, mis. form PO di Tahap 8 detail order): pindah halaman di jendela induknya
    function pergi(url) {
        var w = window;
        try { if (window.__poEmbedTop && window.top && window.top !== window) { w = window.top; } } catch (e) {}
        w.location.href = url;
    }

    window.PoNomorDialog = {
        mulai: function (o) {
            var dur = o.durasi || DURASI;
            if (!adaSwal()) {   // cadangan bila SweetAlert tidak termuat: langsung kirim
                Promise.resolve(o.kirim()).then(function (j) {
                    if (j && j.ok) { pergi(o.tujuan ? o.tujuan(j) : (j.redirect || window.location.href)); }
                    else if (o.gagal) { o.gagal(j || {}); }
                });
                return;
            }
            Swal.fire({
                icon: 'question', iconColor: '#64748b', title: 'Kirim PO dan terbitkan nomor',
                html: '<p class="mb-2">Nomor PO akan ditetapkan otomatis begitu kamu klik <b>Generate Nomor PO</b>, lalu PO langsung terkirim.</p>' +
                      '<p class="mb-0 small" style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 12px;">Setelah terkirim, PO tidak bisa diedit lagi sampai ada permintaan revisi.</p>',
                showCancelButton: true, confirmButtonText: 'Generate Nomor PO', cancelButtonText: 'Batal', reverseButtons: true,
                allowOutsideClick: false, customClass: KELAS, buttonsStyling: false
            }).then(function (r) { if (r.isConfirmed) { jalan(o, dur); } });
        }
    };
})();
</script>
