</style>
<script>
/* Fungsi bantu editor mini + tampilan teks kaya (dipakai bersama oleh semua halaman Buat PO) */
(function () {
    function e(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    var OK = { B: 1, I: 1, U: 1, STRONG: 1, EM: 1, OL: 1, UL: 1, LI: 1, BR: 1, P: 1, DIV: 1 };
    function bersih(html) {
        var d = document.createElement('div'); d.innerHTML = html;
        (function walk(n) {
            Array.prototype.slice.call(n.childNodes).forEach(function (c) {
                if (c.nodeType === 1) {
                    walk(c);
                    if (!OK[c.nodeName]) { while (c.firstChild) { n.insertBefore(c.firstChild, c); } n.removeChild(c); return; }
                    var st = c.getAttribute('style'), tp = c.nodeName === 'OL' ? c.getAttribute('type') : null;
                    while (c.attributes.length) { c.removeAttribute(c.attributes[0].name); }
                    if (tp) { c.setAttribute('type', tp); }
                    if (st && /^\s*text-align:\s*(left|center|right|justify)\s*;?\s*$/i.test(st)) { c.setAttribute('style', st); }
                } else if (c.nodeType !== 3) { n.removeChild(c); }
            });
        })(d);
        return d.innerHTML;
    }
    /* isi lama (teks polos, ada baris baru) atau isi baru (HTML dari editor) -> HTML aman */
    function adaTag(s) { return /<\/?(p|div|br|b|i|u|strong|em|ol|ul|li)(\s|\/|>)/i.test(s); }
    window.ppRich = function (s) {
        s = String(s == null ? '' : s);
        if (!adaTag(s)) { return e(s).replace(/\r?\n/g, '<br>'); }
        return bersih(s);
    };
    /* sama seperti ppRich, tapi tanpa pembungkus blok: dipakai kalau isinya disisipkan di tengah kalimat */
    window.ppInline = function (s) {
        return window.ppRich(s).replace(/<\/(div|p)>\s*<(div|p)>/gi, '<br>').replace(/<\/?(div|p)>/gi, '');
    };
    /* teks polos dari isi editor (untuk cek kosong / logika berbasis baris) */
    window.ppPlain = function (s) {
        s = String(s == null ? '' : s);
        if (!adaTag(s)) { return s; }
        var t = bersih(s).replace(/<(br|\/div|\/p|\/li)[^>]*>/gi, '\n').replace(/<[^>]+>/g, '');
        var ta = document.createElement('textarea'); ta.innerHTML = t; return ta.value;
    };
    /* isi lama (teks polos; baris berawalan "- " jadi daftar poin) -> HTML untuk dimasukkan ke editor */
    window.ppToHtml = function (s) {
        s = String(s == null ? '' : s);
        if (adaTag(s)) { return bersih(s); }
        var ls = s.split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
        if (ls.length <= 1 && !/^\s*-\s/.test(ls[0] || '')) { return e(ls[0] || ''); }
        var out = '', open = false;
        ls.forEach(function (l) {
            var m = /^\s*-\s*(.*)$/.exec(l);
            if (m) { if (!open) { out += '<ul>'; open = true; } out += '<li>' + e(m[1]) + '</li>'; }
            else { if (open) { out += '</ul>'; open = false; } out += '<div>' + e(l) + '</div>'; }
        });
        return out + (open ? '</ul>' : '');
    };
    /* isi editor -> nilai tersimpan; editor yang dikosongkan (sisa <br>/<div>) dianggap kosong sungguhan */
    window.ppEditorVal = function (el) {
        if ((el.textContent || '').trim() === '' && !el.querySelector('li,img')) { return ''; }
        var h = el.innerHTML;
        /* teks tanpa tag dibungkus <div> supaya bisa dibedakan dari isi lama yang teks polos (mis. "&amp;" tidak digandakan) */
        return /<[a-z]/i.test(h) ? h : '<div>' + h + '</div>';
    };
    var TOOLS = [['bold', '<b>B</b>', 'Tebal'], ['italic', '<i>I</i>', 'Miring'], ['underline', '<u>U</u>', 'Garis bawah'], '|',
        ['insertOrderedList', 'a.', 'Daftar bertingkat a, b, c'], ['num', '1.', 'Daftar angka 1, 2, 3'], ['insertUnorderedList', '&bull;', 'Daftar poin'], '|',
        ['removeFormat', '<i class="bi bi-eraser"></i>', 'Hapus format']];
    /* editor mini: attrs = atribut data-list/data-i/data-k yang menempel di badan editor */
    window.ppMiniRte = function (attrs, isi) {
        var bar = TOOLS.map(function (t) {
            return t === '|' ? '<span class="sep"></span>' : '<button type="button" data-cmd="' + t[0] + '" title="' + t[2] + '">' + t[1] + '</button>';
        }).join('');
        return '<div class="pp-rte pp-rte-mini"><div class="pp-rte-bar">' + bar + '</div><div class="pp-rte-body" contenteditable="true" spellcheck="true" ' + attrs + '>' + window.ppToHtml(isi) + '</div></div>';
    };
})();
/* Tata letak berdampingan (Split View) + pratinjau langsung. Dijalankan setelah skrip halaman selesai. */
var PP_Z = { mode: 'fit', scale: 1 };
window.ppFitHook = function (box, pages, wrap) {
    if (!window.ppSplitSiap) { return false; }
    var avail = box.clientWidth - 32;
    if (avail <= 0) { return true; }
    var sc = PP_Z.mode === 'fit' ? Math.max(0.35, Math.min(1.25, avail / 794)) : PP_Z.scale;
    if (PP_Z.mode === 'fit') { PP_Z.scale = sc; }
    pages.style.transform = 'scale(' + sc + ')';
    wrap.style.height = Math.ceil(pages.offsetHeight * sc) + 'px';
    wrap.style.marginLeft = Math.max(0, Math.floor((avail - 794 * sc) / 2)) + 'px';
    var lb = document.getElementById('ppZoomLabel');
    if (lb) { lb.textContent = (PP_Z.mode === 'fit' ? 'Fit (' : '') + Math.round(sc * 100) + (PP_Z.mode === 'fit' ? '%)' : '%'); }
    return true;
};
document.addEventListener('DOMContentLoaded', function () {
    var root = document.querySelector('.pp-root'), grid = root && root.querySelector('.pp-grid'),
        modal = document.getElementById('ppModal'), dlg = modal && modal.querySelector('.pp-modal-dialog'),
        bar = dlg && dlg.querySelector('.pp-modal-bar'), box = document.getElementById('pvBox'),
        actions = root && root.querySelector('.pp-actions');
    if (!root || !grid || !dlg || !bar || !box || !actions) { return; }

    var LIVE_TXT = window.PP_LIVE_TEXT || 'Live Sync';
    var wrap = document.createElement('div'); wrap.className = 'row g-4 po-split-layout'; wrap.id = 'poSplitWrapper';
    var colF = document.createElement('div'), colP = document.createElement('div'), card = document.createElement('div');
    colF.id = 'poFormCol'; colP.id = 'poPreviewCol'; card.className = 'po-live-card';
    grid.parentNode.insertBefore(wrap, grid);
    colF.appendChild(grid); wrap.appendChild(colF); wrap.appendChild(colP); colP.appendChild(card);

    /* bilah atas pratinjau: Live Sync + loncat halaman + zoom + segarkan + PDF + cetak */
    var lbl = bar.querySelector('.lbl');
    var badge = document.createElement('span'); badge.className = 'po-live-badge'; badge.id = 'ppLiveBadge';
    badge.innerHTML = '<span class="pp-live-dot" id="ppLiveDot"></span><span id="ppLiveText">' + LIVE_TXT + '</span>';
    if (lbl) { lbl.parentNode.replaceChild(badge, lbl); } else { bar.insertBefore(badge, bar.firstChild); }
    var tools = document.createElement('div'); tools.className = 'pp-live-tools';
    tools.innerHTML = '<div class="pp-zoom"><button type="button" data-z="-" title="Perkecil"><i class="bi bi-zoom-out"></i></button>' +
        '<button type="button" class="pp-zoom-label" id="ppZoomLabel" data-z="0" title="Klik untuk reset zoom (100%)">100%</button>' +
        '<button type="button" data-z="+" title="Perbesar"><i class="bi bi-zoom-in"></i></button>' +
        '<button type="button" class="pp-zoom-fit" data-z="fit" title="Pas lebar layar"><i class="bi bi-arrows-angle-expand"></i> Fit</button></div>' +
        '<button type="button" class="pp-tool round" id="ppRefresh" title="Segarkan pratinjau"><i class="bi bi-arrow-clockwise"></i></button>' +
        '<button type="button" class="pp-tool pdf" id="ppToolPdf" title="Simpan sebagai PDF (lewat jendela cetak)"><i class="bi bi-file-earmark-pdf-fill"></i> PDF</button>' +
        '<button type="button" class="pp-tool round" id="ppToolPrint" title="Cetak dokumen"><i class="bi bi-printer"></i></button>';
    bar.appendChild(tools);
    card.appendChild(bar); card.appendChild(box);
    window.ppSplitSiap = true;
    /* mode lihat (Sertifikasi) membuka jendela preview lama sebelum tata letak ini siap: tutup lagi */
    modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); document.body.style.overflow = '';

    function refit() { window.dispatchEvent(new Event('resize')); }
    tools.addEventListener('click', function (e) {
        var z = e.target.closest('[data-z]');
        if (z) {
            var k = z.dataset.z;
            if (k === 'fit') { PP_Z.mode = 'fit'; }
            else { PP_Z.mode = 'manual'; PP_Z.scale = k === '0' ? 1 : Math.max(0.35, Math.min(2, PP_Z.scale + (k === '+' ? 0.1 : -0.1))); }
            refit(); return;
        }
        if (e.target.closest('#ppRefresh')) {
            var rf = document.getElementById('ppRefresh'); rf.classList.remove('spin'); void rf.offsetWidth; rf.classList.add('spin');
            if (window.ppRender) { window.ppRender(); } refit(); return;
        }
        if (e.target.closest('#ppToolPdf, #ppToolPrint')) { var pb = document.getElementById('ppPrint'); if (pb) { pb.click(); } else { window.print(); } }
    });

    /* indikator Live Sync */
    var dot = document.getElementById('ppLiveDot'), txt = document.getElementById('ppLiveText'), tm = null;
    root.addEventListener('input', function () {
        dot.classList.add('syncing'); txt.textContent = 'Menyinkronkan...';
        clearTimeout(tm); tm = setTimeout(function () { dot.classList.remove('syncing'); txt.textContent = LIVE_TXT; }, 450);
    });

    /* pengalih mode */
    var sw = document.createElement('div'); sw.className = 'po-view-switcher'; sw.setAttribute('role', 'group');
    sw.innerHTML = '<button type="button" class="po-mode-btn" data-mode="split" title="Form dan pratinjau berdampingan"><i class="bi bi-layout-split me-1"></i><span class="d-none d-sm-inline">Split View</span></button>' +
        '<button type="button" class="po-mode-btn" data-mode="form" title="Fokus ke form"><i class="bi bi-pencil-square me-1"></i><span class="d-none d-sm-inline">Form Saja</span></button>' +
        '<button type="button" class="po-mode-btn" data-mode="preview" title="Fokus ke pratinjau dokumen"><i class="bi bi-file-earmark-pdf me-1"></i><span class="d-none d-sm-inline">Preview Saja</span></button>';
    actions.insertBefore(sw, actions.firstChild);

    function setMode(mode) {
        if (mode !== 'form' && mode !== 'preview') { mode = 'split'; }
        colF.className = mode === 'form' ? 'col-12' : (mode === 'preview' ? 'd-none' : 'col-12 col-xl-7');
        colP.className = mode === 'form' ? 'd-none' : (mode === 'preview' ? 'col-12' : 'col-12 col-xl-5');
        Array.prototype.forEach.call(sw.querySelectorAll('.po-mode-btn'), function (b) { b.classList.toggle('active', b.dataset.mode === mode); });
        try { localStorage.setItem('po_view_mode', mode); } catch (x) {}
        setTimeout(refit, 120);
    }
    window.ppSetMode = setMode;
    sw.addEventListener('click', function (e) { var b = e.target.closest('.po-mode-btn'); if (b) { setMode(b.dataset.mode); } });
    document.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('#ppPreviewFab, #ppPreview')) { e.stopImmediatePropagation(); e.preventDefault(); setMode('preview'); }
    }, true);

    /* bar tombol bawah form: Batal / Kembali, Lihat Preview (layar sempit), Simpan */
    var back = root.querySelector('.pp-back'), base = back ? back.getAttribute('href') : '#';
    var bot = document.getElementById('ppBottomBar');
    if (bot) {
        bot.classList.add('po-sticky-bar'); bot.classList.remove('mb-5');
        var pv = document.createElement('button'); pv.type = 'button'; pv.className = 'btn btn-outline-primary btn-sm shadow-xs d-xl-none';
        pv.innerHTML = '<i class="bi bi-file-earmark-pdf me-1"></i><span>Lihat Preview</span>'; pv.addEventListener('click', function () { setMode('preview'); });
        bot.insertBefore(pv, bot.firstChild);
    } else {
    bot = document.createElement('div'); bot.className = 'po-sticky-bar';
    bot.innerHTML = '<div><a href="' + base + '" class="btn btn-outline-secondary shadow-xs"><i class="bi bi-arrow-left me-1"></i> Batal / Kembali</a>' +
        '<button type="button" class="btn btn-outline-primary btn-sm shadow-xs d-xl-none" id="ppBarPrev"><i class="bi bi-file-earmark-pdf me-1"></i><span>Lihat Preview</span></button></div><div id="ppBarRight"></div>';
    colF.appendChild(bot);
    bot.querySelector('#ppBarPrev').addEventListener('click', function () { setMode('preview'); });
    var simpan = actions.querySelector('.btn-outline-success');
    if (simpan) { simpan.classList.add('shadow-xs'); bot.querySelector('#ppBarRight').appendChild(simpan); }
    }

    var saved = 'split';
    try { saved = localStorage.getItem('po_view_mode') || (window.innerWidth < 1200 ? 'form' : 'split'); } catch (x) {}
    if (document.body.classList.contains('pp-view-only')) { saved = 'preview'; }
    setMode(saved);

    /* cetak (tombol Cetak / Ctrl+P): sementara kembalikan pratinjau ke wadah cetak lama supaya hanya dokumen yang tercetak */
    window.addEventListener('beforeprint', function () {
        dlg.appendChild(box); modal.classList.add('open'); document.body.appendChild(modal);
    });
    window.addEventListener('afterprint', function () {
        modal.classList.remove('open'); card.appendChild(box); refit();
    });
    refit();
});
</script>
