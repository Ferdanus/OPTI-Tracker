<div class="row justify-content-center" data-aos="fade-up">
    <div class="col-lg-8">
        <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-3 mb-4">
            <a href="{{ @BASE }}/kontrak" class="btn-back">
                <i class="bi bi-arrow-left"></i> Kembali
            </a>
            <h4 class="fw-bold mb-0"><i class="bi bi-journal-plus me-2 text-primary"></i>Input Kontrak PKS Baru</h4>
        </div>

        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Form Perjanjian Kerja Sama (PKS)</h6>
            </div>
            <div class="card-body p-4">
                <form action="{{ @BASE }}/kontrak/simpan" method="POST">
                    <!-- CSRF Token -->
                    <input type="hidden" name="csrf_token" value="{{ @csrf_token }}">
                    
                    <div class="mb-3">
                        <label for="po_id" class="form-label fw-semibold">Pilih Petunjuk Operasional (PO) Terkait <span class="text-danger">*</span></label>
                        <select class="form-select" id="po_id" name="po_id" required>
                            <option value="">-- Pilih Dokumen PO --</option>
                            <repeat group="{{ @daftar_po }}" value="{{ @po }}">
                                <option value="{{ @po.id }}">{{ @po.nomor_po }} - {{ @po.judul_kegiatan }} (Klien: {{ @po.nama_perusahaan }})</option>
                            </repeat>
                        </select>
                        <div class="form-text">Hubungkan nomor PKS ini ke dokumen PO yang sudah terbit di sistem.</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nomor_pks_bbspjis" class="form-label fw-semibold">Nomor PKS BBSPJI Selulosa <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nomor_pks_bbspjis" name="nomor_pks_bbspjis" required placeholder="Contoh: 102/PKS/BBSPJIS/VIII/2026">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nomor_pks_klien" class="form-label fw-semibold">Nomor PKS Klien / Perusahaan <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nomor_pks_klien" name="nomor_pks_klien" required placeholder="Contoh: 005/DIR-PKS/PTXYZ/2026">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nama_penandatangan_bbspjis" class="form-label fw-semibold">Penandatangan BBSPJI Selulosa <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama_penandatangan_bbspjis" name="nama_penandatangan_bbspjis" required placeholder="Nama Pejabat BBSPJI Selulosa" value="Andri T.">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="jabatan_penandatangan_bbspjis" class="form-label fw-semibold">Jabatan Penandatangan BBSPJIS</label>
                            <input type="text" class="form-control" id="jabatan_penandatangan_bbspjis" name="jabatan_penandatangan_bbspjis" placeholder="Contoh: Kepala Balai" value="Kepala Balai Besar">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nama_penandatangan_klien" class="form-label fw-semibold">Penandatangan Klien <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nama_penandatangan_klien" name="nama_penandatangan_klien" required placeholder="Nama Direktur / Manajer Klien">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="jabatan_penandatangan_klien" class="form-label fw-semibold">Jabatan Penandatangan Klien</label>
                            <input type="text" class="form-control" id="jabatan_penandatangan_klien" name="jabatan_penandatangan_klien" placeholder="Contoh: Direktur Utama">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="target_mulai" class="form-label fw-semibold">Tanggal Mulai Berlaku PKS <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="target_mulai" name="target_mulai" required value="{{ date('Y-m-d') }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="target_selesai" class="form-label fw-semibold">Tanggal Selesai Berlaku PKS <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="target_selesai" name="target_selesai" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nilai_kontrak" class="form-label fw-semibold">Nilai Kontrak / Biaya PKS (Rp)</label>
                            <input type="number" class="form-control" id="nilai_kontrak" name="nilai_kontrak" placeholder="Contoh: 25000000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="status_ttd" class="form-label fw-semibold">Status Tanda Tangan <span class="text-danger">*</span></label>
                            <select class="form-select" id="status_ttd" name="status_ttd" required>
                                <option value="belum">Belum Ditandatangani</option>
                                <option value="sudah">Sudah Ditandatangani Keduanya</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="tanggal_ttd" class="form-label fw-semibold">Tanggal Tanda Tangan Kontrak</label>
                        <input type="date" class="form-control" id="tanggal_ttd" name="tanggal_ttd">
                    </div>

                    <div class="mb-3">
                        <label for="ruang_lingkup" class="form-label fw-semibold">Ruang Lingkup PKS</label>
                        <textarea class="form-control" id="ruang_lingkup" name="ruang_lingkup" rows="3" placeholder="Deskripsikan parameter, batasan, atau ketentuan PKS..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="ketentuan_pembayaran" class="form-label fw-semibold">Ketentuan Pembayaran</label>
                        <textarea class="form-control" id="ketentuan_pembayaran" name="ketentuan_pembayaran" rows="3" placeholder="Contoh: DP 30%, Pelunasan setelah BAST terbit..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="{{ @BASE }}/kontrak" class="btn btn-light border">Batal</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Simpan Kontrak PKS
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
