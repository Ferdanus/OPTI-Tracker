<!--
    app/views/kontrak/index.html
    Index kontrak (PKS): PO yang sudah disetujui dan didisposisikan ke Humas.
    Fragment (dirender di dalam layout lewat $this->render()). Class berawalan "dpk-", id berawalan "dpk".
    Data dari PksKontrakController::index(). Tab Selesai memuat tombol Unduh Word.
-->
<style>
    .dpk-root {
        --dpk-primary: var(--color-primary, #334155);
        --dpk-primary-hover: var(--color-primary-hover, #1e293b);
        --dpk-primary-light: var(--color-primary-light, #f1f5f9);
        --dpk-border: var(--color-border, #e2e8f0);
        --dpk-muted: var(--color-text-muted, #64748b);
        --dpk-text: var(--color-text-main, #0f172a);
        --dpk-display: var(--font-display, inherit);
        --dpk-radius: var(--radius-md, 10px);
        color: var(--dpk-text);
    }
    .dpk-root *, .dpk-root *::before, .dpk-root *::after { box-sizing: border-box; }
    .dpk-root [hidden] { display: none !important; }
    .dpk-root button { font-family: inherit; cursor: pointer; }
    .dpk-root :focus-visible { outline: 2px solid var(--dpk-primary); outline-offset: 2px; }
    
    .dpk-head h1 { font-size: 1.35rem; font-weight: 800; margin: 0 0 4px; font-family: var(--dpk-display); }
    .dpk-head p { margin: 0 0 16px; color: var(--dpk-muted); font-size: .85rem; max-width: 660px; }
    .dpk-alert { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; border-radius: var(--dpk-radius); padding: 10px 14px; margin-bottom: 14px; font-size: .85rem; }
    
    .dpk-btn { border: 1.5px solid var(--dpk-border); background: #fff; color: #334155; border-radius: 9px; padding: .5rem .95rem; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; }
    .dpk-btn:hover { border-color: var(--dpk-primary); color: var(--dpk-primary); }
    .dpk-btn.pri { background: var(--dpk-primary); border-color: var(--dpk-primary); color: #fff; }
    .dpk-btn.pri:hover { background: var(--dpk-primary-hover); color: #fff; }
    .dpk-btn.sm { padding: .38rem .8rem; font-size: .78rem; }
    .dpk-btn[disabled] { opacity: .65; cursor: progress; }
    
    .dpk-panel { background: #fff; border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); }
    .dpk-tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--dpk-border); }
    .dpk-tab { flex: 1; border: 0; background: transparent; padding: .65rem .5rem; border-radius: var(--dpk-radius); font-family: var(--dpk-display); font-weight: 700; font-size: .85rem; color: var(--dpk-muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
    .dpk-tab.on { background: var(--dpk-primary-light); color: var(--dpk-primary); }
    .dpk-cnt { background: #e2e8f0; color: var(--dpk-muted); border-radius: 12px; padding: 1px 8px; font-size: .72rem; }
    .dpk-tab.on .dpk-cnt { background: var(--dpk-primary); color: #fff; }
    .dpk-body { padding: 16px; }
    .dpk-search { width: 100%; max-width: 380px; border: 1px solid var(--dpk-border); border-radius: 9px; padding: .5rem .75rem; font: inherit; font-size: .85rem; margin-bottom: 14px; }
    .dpk-search:focus { border-color: var(--dpk-primary); outline: 0; box-shadow: 0 0 0 3px rgba(51,65,85,.12); }
    table.dpk-table { width: 100%; border-collapse: collapse; border: 0; }
    .dpk-table th { text-align: left; font-size: .72rem; color: var(--dpk-muted); font-weight: 700; padding: 0 10px 10px; border-bottom: 1px solid var(--dpk-border); }
    .dpk-table td { padding: 13px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .dpk-table tr:last-child td { border-bottom: 0; }
    .dpk-table tbody tr:hover { background: #fcfcfd; }
    .dpk-no { font-family: 'Courier New', monospace; font-weight: 700; font-size: .8rem; }
    .dpk-sub { font-size: .75rem; color: var(--dpk-muted); }
    .dpk-mitra { font-weight: 600; }
    .dpk-judul { font-size: .8rem; color: var(--dpk-muted); max-width: 320px; }
    .dpk-pill { font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border: 1px solid transparent; }
    .dpk-pill.amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .dpk-pill.blue { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .dpk-pill.emerald { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .dpk-pill.slate { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .dpk-pill.tiny { font-size: .65rem; padding: 1px 8px; margin-top: 4px; }
    .dpk-mini { margin-top: 6px; width: 130px; }
    .dpk-mini .b { height: 5px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
    .dpk-mini .b i { display: block; height: 100%; background: #2563eb; }
    .dpk-mini .t { font-size: .68rem; color: var(--dpk-muted); margin-top: 2px; }
    .dpk-acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .dpk-empty { text-align: center; padding: 44px 16px; color: #94a3b8; font-size: .85rem; }
    .dpk-empty i { display: block; font-size: 28px; margin-bottom: 6px; }
    .dpk-mob { display: none; }
    .dpk-pcard { border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); padding: 13px; margin-bottom: 10px; }
    .dpk-pcard .foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .dpk-pcard .foot .dpk-acts .dpk-btn { flex: 1; }
    
    .dpk-toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -14px); background: #1e293b; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .82rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1100; max-width: calc(100vw - 24px); }
    .dpk-toast.show { opacity: 1; transform: translate(-50%, 0); }
    .dpk-toast.err { background: #b91c1c; }
    
    @media (max-width: 767.98px) {
        .dpk-desk { display: none; }
        .dpk-mob { display: block; }
        .dpk-tab { font-size: .78rem; padding: .6rem .3rem; }
    }
    @media (prefers-reduced-motion: reduce) { .dpk-root * { transition: none !important; } }
    </style>
    
    <div class="dpk-root" id="dpkRoot">
        <div class="dpk-head">
            <h1>Kontrak (PKS)</h1>
            <p>PO yang sudah disetujui dan didisposisikan ke Humas. Pilih PO, lalu buat kontraknya. Data PO diambil otomatis ke form. Kontrak yang sudah selesai bisa diunduh sebagai Word di tab Selesai.</p>
        </div>
    
        <check if="{{ @error_message }}">
            <div class="dpk-alert" role="alert">{{ @error_message }}</div>
        </check>
    
        <div class="dpk-panel">
            <div class="dpk-tabs" id="dpkTabs"></div>
            <div class="dpk-body">
                <input type="search" class="dpk-search" id="dpkCari" placeholder="Cari nomor PO, mitra, judul, atau divisi" aria-label="Cari PO">
                <div id="dpkList"></div>
            </div>
        </div>
    
        <div class="dpk-toast" id="dpkToast" role="status"></div>
    </div>
    
    <script>
    (function () {
        var BASE = '{{ @BASE }}';
        var DATA = {{ @daftar_kontrak_json | raw }};
        var tab = {{ @tab_awal_json | raw }};
        var PESAN_AWAL = {{ @pesan_awal_json | raw }};
        var BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
        var TAB_LABEL = { baru: 'Perlu dibuat', draft: 'Draft', selesai: 'Selesai' };
        var q = '';
    
        function $(id) { return document.getElementById(id); }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function rp(n) { return Math.round(n).toLocaleString('id-ID'); }
        function tglPendek(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN_PENDEK[+m[2] - 1] + ' ' + m[1] : '-'; }
    
        function statusHtml(p) {
            if (p.status === 'baru') { return '<span class="dpk-pill amber"><i class="bi bi-hourglass-split"></i>Belum dibuat</span>'; }
            if (p.status === 'selesai') { return '<span class="dpk-pill emerald"><i class="bi bi-check-circle"></i>Selesai</span><div class="dpk-sub" style="margin-top:4px;">' + esc(p.nomor_pks) + '</div>'; }
            var pct = p.total ? Math.round(p.terisi / p.total * 100) : 0;
            return '<span class="dpk-pill blue"><i class="bi bi-pencil-square"></i>Draft</span><div class="dpk-mini"><div class="b"><i style="width:' + pct + '%"></i></div><div class="t">' + p.terisi + ' dari ' + p.total + ' isian wajib</div></div>';
        }
    
        function divisiHtml(p) { return p.divisi ? '<span class="dpk-pill slate tiny">' + esc(p.divisi) + '</span>' : ''; }
    
        function aksiHtml(p) {
            var form = BASE + '/kontrak/' + p.id + '/form';
            if (p.status === 'selesai') {
                return '<div class="dpk-acts"><button type="button" class="dpk-btn pri sm" data-unduh="' + p.id + '"><i class="bi bi-file-earmark-word"></i>Unduh Word</button>' +
                    '<a class="dpk-btn sm" href="' + form + '"><i class="bi bi-eye"></i>Buka</a></div>';
            }
            var label = p.status === 'baru' ? '<i class="bi bi-file-earmark-plus"></i>Buat kontrak' : '<i class="bi bi-pencil"></i>Lanjutkan';
            return '<div class="dpk-acts"><a class="dpk-btn pri sm" href="' + form + '">' + label + '</a></div>';
        }
    
        function render() {
            var jml = { baru: 0, draft: 0, selesai: 0 };
            DATA.forEach(function (p) { jml[p.status]++; });
            $('dpkTabs').innerHTML = ['baru', 'draft', 'selesai'].map(function (k) {
                return '<button type="button" class="dpk-tab' + (tab === k ? ' on' : '') + '" data-tab="' + k + '">' + TAB_LABEL[k] + ' <span class="dpk-cnt">' + jml[k] + '</span></button>';
            }).join('');
    
            var rows = DATA.filter(function (p) {
                if (p.status !== tab) { return false; }
                if (q) { return (p.nomor + ' ' + p.mitra + ' ' + p.judul + ' ' + (p.divisi || '')).toLowerCase().indexOf(q) !== -1; }
                return true;
            });
    
            if (!rows.length) {
                var pesan = q ? 'Tidak ada PO yang cocok dengan pencarian.' : (tab === 'baru' ? 'Semua PO sudah dibuatkan kontrak.' : 'Belum ada kontrak di tab ini.');
                $('dpkList').innerHTML = '<div class="dpk-empty"><i class="bi bi-inbox"></i>' + pesan + '</div>';
                return;
            }
    
            var tabel = '<div class="dpk-desk"><table class="dpk-table"><thead><tr><th style="width:170px;">Nomor PO</th><th>Mitra dan kegiatan</th><th>Status kontrak</th><th></th></tr></thead><tbody>' +
                rows.map(function (p) {
                    return '<tr><td><div class="dpk-no">' + esc(p.nomor) + '</div><div class="dpk-sub">Disposisi ' + tglPendek(p.disposisi) + '</div>' + divisiHtml(p) + '</td>' +
                        '<td><div class="dpk-mitra">' + esc(p.mitra) + '</div><div class="dpk-judul">' + esc(p.judul) + '</div><div class="dpk-sub">Nilai Rp ' + rp(p.biaya) + '</div></td>' +
                        '<td>' + statusHtml(p) + '</td><td>' + aksiHtml(p) + '</td></tr>';
                }).join('') + '</tbody></table></div>';
            var kartu = '<div class="dpk-mob">' + rows.map(function (p) {
                return '<div class="dpk-pcard"><div class="dpk-no">' + esc(p.nomor) + '</div>' + divisiHtml(p) + '<div class="dpk-mitra" style="margin-top:4px;">' + esc(p.mitra) + '</div>' +
                    '<div class="dpk-judul" style="max-width:none;margin:2px 0 6px;">' + esc(p.judul) + '</div><div class="dpk-sub" style="margin-bottom:8px;">Disposisi ' + tglPendek(p.disposisi) + ' &nbsp;|&nbsp; Rp ' + rp(p.biaya) + '</div>' +
                    statusHtml(p) + '<div class="foot">' + aksiHtml(p) + '</div></div>';
            }).join('') + '</div>';
            $('dpkList').innerHTML = tabel + kartu;
        }
    
        /* ---------- Unduh Word: lewat fetch supaya kegagalan tampil sebagai pesan, bukan halaman error ---------- */
        function unduhWord(id, tombol) {
            var awal = tombol.innerHTML;
            tombol.disabled = true;
            tombol.innerHTML = '<i class="bi bi-hourglass-split"></i>Menyiapkan...';
            fetch(BASE + '/kontrak/' + id + '/unduh', { credentials: 'same-origin' }).then(function (r) {
                var tipe = r.headers.get('Content-Type') || '';
                if (!r.ok || tipe.indexOf('wordprocessingml') === -1) { throw new Error('Server membalas ' + r.status + '. Dokumen Word gagal dibuat: cek template di storage/templates, ekstensi zip PHP, dan log server.'); }
                var cd = r.headers.get('Content-Disposition') || '';
                var m = /filename="?([^";]+)"?/.exec(cd);
                var nama = m ? m[1] : 'PKS.docx';
                return r.blob().then(function (blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url; a.download = nama;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
                    toast('Mengunduh ' + nama);
                });
            }).catch(function (e) {
                toast(e.message, true);
            }).then(function () {
                tombol.disabled = false;
                tombol.innerHTML = awal;
            });
        }
    
        var toastTimer;
        function toast(text, galat) {
            var t = $('dpkToast');
            t.textContent = text;
            t.classList.toggle('err', !!galat);
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, galat ? 7000 : 4200);
        }
    
        $('dpkRoot').addEventListener('click', function (e) {
            var el;
            if ((el = e.target.closest('[data-tab]'))) { tab = el.getAttribute('data-tab'); render(); return; }
            if ((el = e.target.closest('[data-unduh]'))) { unduhWord(el.getAttribute('data-unduh'), el); return; }
        });
        $('dpkCari').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
    
        render();
        if (PESAN_AWAL) { toast(PESAN_AWAL); }
    })();
    </script>
