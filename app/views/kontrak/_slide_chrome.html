<!--
    app/views/kontrak/_slide_chrome.html
    Tambahan tampilan slide ala "Daftar PO Humas" untuk slide BAST (order/_slide_bast.html) dan slide PO (kontrak/_slide_po.html):
    badge status di judul, baris info (Ketua Tim, dikirim, dibuka), alur langkah, tombol unduh di baris tab, dan dock tombol aksi di bawah.
    Dipakai di halaman PKS dan BAST Humas. Tanpa konfigurasi (Detail Order) slide tampil seperti biasa.
    Pemakaian: SlideChrome.pasang(elemenSlide, { pill, meta, steps: [..], c: langkahAktif, note, dock: { hint, label, icon, href } }); SlideChrome.pasang(elemenSlide, null) melepas.
    JANGAN menulis tag template (include, check, dan sejenisnya) di komentar ini: Fat-Free ikut memprosesnya. Kelas berawalan "sc-".
-->
<style>
    .sc-t1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sc-pill { font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #1e293b; line-height: 1.3; white-space: nowrap; }
    .sc-pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .sc-pill.ok { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .sc-meta { font-size: .75rem; color: #64748b; margin-top: 3px; }
    .sc-meta b { color: #0f172a; }
    .sc-stepper { background: #fff; padding: 12px 18px 14px; border-bottom: 1px solid #e2e8f0; flex: none; }
    .sc-steps { display: flex; align-items: center; }
    .sc-step { display: flex; align-items: center; gap: 7px; font-size: .75rem; font-weight: 600; color: #94a3b8; white-space: nowrap; }
    .sc-step .n { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: grid; place-items: center; font-size: .7rem; font-weight: 700; flex-shrink: 0; }
    .sc-step.done { color: #1e293b; }
    .sc-step.done .n { background: #1e293b; color: #fff; }
    .sc-step.cur { color: #0f172a; }
    .sc-step.cur .n { background: #334155; color: #fff; box-shadow: 0 0 0 4px rgba(51,65,85,.15); }
    .sc-sline { flex: 1; height: 2px; background: #e2e8f0; margin: 0 8px; min-width: 14px; }
    .sc-sline.done { background: #1e293b; }
    .sc-note { margin-top: 9px; font-size: .72rem; color: #64748b; }
    .sc-tabtools { margin-left: auto; align-self: center; display: flex; gap: 6px; align-items: center; flex: none; padding-left: 8px; }
    .sc-dock { background: #fff; border-top: 1px solid #e2e8f0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; flex: none; position: relative; z-index: 8; }
    .sc-hint { font-size: .8rem; color: #64748b; flex: 1 1 200px; }
    .sc-hint b { color: #0f172a; }
    .sc-btn { border: 1.5px solid #334155; background: #334155; color: #fff; border-radius: 9px; padding: 8px 16px; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; font-family: inherit; cursor: pointer; transition: background .15s, transform .15s; }
    .sc-btn:hover { background: #1e293b; color: #fff; }
    .sc-btn:active { transform: scale(.97); }
    /* tombol bulat di pojok kanan atas, sama dengan slide PO: sembunyikan info dan alur, lebarkan panel, tutup */
    .sc-ibtn, .sc-on .bs-h .bs-btn.ic, .sc-on .ps-h .ps-btn.ic { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #f1f5f9; color: #0f172a; display: inline-grid; place-items: center; padding: 0; font-size: .95rem; cursor: pointer; flex: none; transition: background .15s; }
    .sc-ibtn:hover, .sc-on .bs-h .bs-btn.ic:hover, .sc-on .ps-h .ps-btn.ic:hover { background: #e2e8f0; color: #0f172a; border-color: transparent; }
    .sc-on.sc-cmp .sc-stepper, .sc-on.sc-cmp .sc-meta, .sc-on.sc-cmp .bs-s, .sc-on.sc-cmp .ps-s { display: none; }
    .sc-on.sc-wide, body.sidebar-collapsed .sc-on.sc-wide { width: 100vw !important; }
    /* satu scrollbar saja: dokumen mengisi tinggi panel dan hanya dokumennya yang menggulir (seperti slide PO) */
    .sc-on #bsPaneBast { overflow: hidden; position: relative; }
    .sc-on .bs-host { position: absolute; inset: 0; overflow: hidden; }
    .sc-on .bs-host .po-live-card, .sc-on .bs-host #dpkRoot, .sc-on .bs-host #dpkPvc, .sc-on .bs-host #dpkWrap, .sc-on .bs-host #dpkPvCol, .sc-on .bs-host iframe { height: 100% !important; min-height: 0 !important; }
    /* tombol unduh di baris tab (satu tombol, seperti "Unduh PO") */
    .sc-on #bsCetak, .sc-on #bsUnduh { display: none !important; }
    .sc-on .sc-tabdl { border: 1px solid #cbd5e1; background: #fff; color: #0f172a; border-radius: 8px; padding: 6px 12px; font-size: .8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; cursor: pointer; font-family: inherit; transition: background .15s, transform .15s; }
    .sc-on .sc-tabdl:hover { background: #f1f5f9; border-color: #94a3b8; color: #0f172a; }
    .sc-on .sc-tabdl:active { transform: scale(.97); }
    /* tanda DRAFT di atas dokumen yang belum selesai */
    .sc-wm { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: grid; place-items: center; overflow: hidden; }
    .sc-wm span { font-size: clamp(64px, 14vw, 170px); font-weight: 900; letter-spacing: .12em; color: rgba(100,116,139,.16); transform: rotate(-28deg); user-select: none; white-space: nowrap; }
    /* animasi: garis tab bergeser, isi panel naik pelan, zoom muncul */
    .sc-on .bs-tabs, .sc-on .ps-tabs { position: relative; }
    .sc-on .bs-tab.on, .sc-on .ps-tab.on { border-bottom-color: transparent; }
    .sc-ind { position: absolute; bottom: 0; left: 0; height: 2px; width: 0; background: #334155; transition: left .32s cubic-bezier(.22,.9,.25,1), width .32s cubic-bezier(.22,.9,.25,1); pointer-events: none; }
    @keyframes scRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes scZm { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .sc-on .bs-pane:not([hidden]), .sc-on .ps-scroll { animation: scRise .35s ease-out both; }
    .sc-on .bs-zm:not([hidden]), .sc-on .ps-zm:not([hidden]) { animation: scZm .35s ease both; }
    @media (max-width: 575.98px) { .sc-step .lb { display: none; } .sc-step.cur .lb { display: inline; } .sc-btn { flex: 1 1 100%; justify-content: center; } }
</style>
<script>
(function () {
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function lepas(sl) {
        if (!sl) { return; }
        var hd = sl.querySelector('.bs-h, .ps-h');
        sl.classList.remove('sc-on', 'sc-cmp', 'sc-wide');
        if (sl._scObs) { try { sl._scObs.disconnect(); } catch (e) {} sl._scObs = null; }
        [].forEach.call(sl.querySelectorAll('.sc-ind, .sc-wm'), function (e) { e.parentNode.removeChild(e); });
        [].forEach.call(sl.querySelectorAll('.sc-tabdl'), function (e) { e.classList.remove('sc-tabdl'); if (e._scAsal != null) { e.innerHTML = e._scAsal; e._scAsal = null; } });
        [].forEach.call(sl.querySelectorAll('.sc-ibtn'), function (e) { e.parentNode.removeChild(e); });
        var w = sl.querySelector('.sc-t1');
        if (w) { var h2 = w.querySelector('h2'); if (h2) { w.parentNode.insertBefore(h2, w); } w.parentNode.removeChild(w); }
        [].forEach.call(sl.querySelectorAll('.sc-meta, .sc-stepper, .sc-dock'), function (e) { e.parentNode.removeChild(e); });
        var tt = sl.querySelector('.sc-tabtools');
        if (tt) {
            var tools = hd ? hd.querySelector('.bs-sp, .ps-sp') : null;
            var tutup = tools ? tools.querySelector('[id$="Tutup"]') : null;
            while (tt.firstChild) { if (tools) { tools.insertBefore(tt.firstChild, tutup); } else { tt.removeChild(tt.firstChild); } }
            tt.parentNode.removeChild(tt);
        }
    }
    function pasang(sl, cfg) {
        if (!sl) { return; }
        lepas(sl);
        if (!cfg) { return; }
        var hd = sl.querySelector('.bs-h, .ps-h'), tabs = sl.querySelector('.bs-tabs, .ps-tabs');
        if (!hd || !tabs) { return; }
        sl.classList.add('sc-on');
        var kotak = hd.firstElementChild, h2 = kotak ? kotak.querySelector('h2') : null;
        if (h2) {
            var w = document.createElement('div'); w.className = 'sc-t1';
            kotak.insertBefore(w, h2); w.appendChild(h2);
            if (cfg.pill) { var p = document.createElement('span'); p.className = 'sc-pill' + (cfg.pillOk ? ' ok' : ''); p.innerHTML = '<span class="d"></span>' + esc(cfg.pill); w.appendChild(p); }
        }
        if (kotak && cfg.meta) { var m = document.createElement('div'); m.className = 'sc-meta'; m.innerHTML = cfg.meta; kotak.appendChild(m); }
        if (cfg.steps && cfg.steps.length) {
            var c = cfg.c || 1, st = document.createElement('div'); st.className = 'sc-stepper';
            var h = '<div class="sc-steps">';
            cfg.steps.forEach(function (s, i) {
                var n = i + 1, kl = n < c ? 'done' : (n === c ? 'cur' : '');
                h += '<div class="sc-step ' + kl + '"><span class="n">' + (n < c ? '<i class="bi bi-check-lg"></i>' : n) + '</span><span class="lb">' + esc(s) + '</span></div>';
                if (i < cfg.steps.length - 1) { h += '<div class="sc-sline' + (n < c ? ' done' : '') + '"></div>'; }
            });
            st.innerHTML = h + '</div>' + (cfg.note ? '<div class="sc-note">' + esc(cfg.note) + '</div>' : '');
            hd.parentNode.insertBefore(st, hd.nextSibling);
        }
        // tombol unduh / PDF / cetak pindah ke ujung kanan baris tab, seperti slide PO di Daftar PO
        var tools = hd.querySelector('.bs-sp, .ps-sp');
        if (tools) {
            var tt = document.createElement('div'); tt.className = 'sc-tabtools';
            [].slice.call(tools.children).forEach(function (el) {
                if (/Tutup$/.test(el.id || '') || /Detail$/.test(el.id || '')) { return; }
                tt.appendChild(el);
            });
            tabs.appendChild(tt);
        }
        // tombol "Detail order" tidak ditampilkan di sini; tombol unduh satu saja dengan label sesuai dokumen
        [].forEach.call(hd.querySelectorAll('[id$="Detail"]'), function (e) { e.hidden = true; });
        var ub = sl.querySelector('#bsPdf, #psUnduh');
        if (ub && cfg.unduhLabel) { ub._scAsal = ub.innerHTML; ub.innerHTML = '<i class="bi bi-download"></i><span>' + esc(cfg.unduhLabel) + '</span>'; ub.classList.add('sc-tabdl'); }
        if (cfg.draft) { var pane = sl.querySelector('#bsPaneBast'); if (pane) { var wm = document.createElement('div'); wm.className = 'sc-wm'; wm.innerHTML = '<span>DRAFT</span>'; pane.appendChild(wm); } }
        // garis penanda tab yang bergeser mulus
        var ind = document.createElement('span'); ind.className = 'sc-ind'; tabs.appendChild(ind);
        var geser = function () { var on = tabs.querySelector('.bs-tab.on, .ps-tab.on'); if (on) { ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px'; } };
        if (window.MutationObserver) { sl._scObs = new MutationObserver(geser); sl._scObs.observe(tabs, { attributes: true, attributeFilter: ['class'], subtree: true }); }
        setTimeout(geser, 30); setTimeout(geser, 400);
        // dua tombol bulat sebelum tombol tutup
        var alat = hd.querySelector('.bs-sp, .ps-sp'), tutupBtn = alat ? alat.querySelector('[id$="Tutup"]') : null;
        if (alat && tutupBtn) {
            var b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'sc-ibtn'; b1.title = 'Sembunyikan info dan alur'; b1.setAttribute('aria-label', 'Sembunyikan info dan alur'); b1.innerHTML = '<i class="bi bi-chevron-up"></i>';
            b1.addEventListener('click', function () { var c = sl.classList.toggle('sc-cmp'); b1.innerHTML = '<i class="bi ' + (c ? 'bi-chevron-down' : 'bi-chevron-up') + '"></i>'; b1.title = c ? 'Tampilkan info dan alur' : 'Sembunyikan info dan alur'; });
            var b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'sc-ibtn'; b2.title = 'Lebarkan panel (sembunyikan sidebar)'; b2.setAttribute('aria-label', 'Lebarkan panel'); b2.innerHTML = '<i class="bi bi-arrows-angle-expand"></i>';
            b2.addEventListener('click', function () { var w2 = sl.classList.toggle('sc-wide'); b2.innerHTML = '<i class="bi ' + (w2 ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand') + '"></i>'; b2.title = w2 ? 'Kecilkan panel' : 'Lebarkan panel (sembunyikan sidebar)'; });
            alat.insertBefore(b1, tutupBtn); alat.insertBefore(b2, tutupBtn);
        }
        if (cfg.dock) {
            var d = document.createElement('div'); d.className = 'sc-dock';
            d.innerHTML = '<div class="sc-hint">' + (cfg.dock.hint || '') + '</div>' +
                (cfg.dock.href ? '<a class="sc-btn" href="' + esc(cfg.dock.href) + '"><i class="bi ' + esc(cfg.dock.icon || 'bi-pencil-square') + '"></i>' + esc(cfg.dock.label) + '</a>' : '');
            sl.appendChild(d);
        }
    }
    window.SlideChrome = { pasang: pasang, lepas: lepas };
})();
</script>
