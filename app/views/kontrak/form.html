<!--
    app/views/kontrak/form.html
    Form kontrak (PKS) dengan pratinjau dokumen live. Fragment (dirender di dalam layout lewat $this->render()).
    Data dari PksKontrakController::form(). Tombol bawah: Kembali, Simpan draft, Selesai.
    Isian berlabel BIRU = dari PO/database, KUNING = diisi manual, ABU = tetap (data BBSPJIS).
    Class berawalan "dpk-", id berawalan "dpk".
-->
<style>
    .dpk-root {
        --dpk-primary: var(--color-primary, #334155);
        --dpk-primary-hover: var(--color-primary-hover, #1e293b);
        --dpk-primary-light: var(--color-primary-light, #f1f5f9);
        --dpk-border: var(--color-border, #e2e8f0);
        --dpk-muted: var(--color-text-muted, #64748b);
        --dpk-text: var(--color-text-main, #0f172a);
        --dpk-display: var(--font-display, inherit);
        --dpk-radius: var(--radius-md, 10px);
        --dpk-db: #2563eb; --dpk-db-bg: #eff6ff;
        --dpk-man: #b45309; --dpk-man-bg: #fffbeb;
        --dpk-danger: #e11d48;
        --dpk-logo-w: 150px; --dpk-logo-h: 52px;   /* kotak logo di dokumen (rasio 250:86 = kotak logo Kemenperin di template Word); dipakai logo klien dan logo BBSPJIS */
        color: var(--dpk-text);
    }
    .dpk-root *, .dpk-root *::before, .dpk-root *::after { box-sizing: border-box; }
    .dpk-root [hidden] { display: none !important; }
    .dpk-root button { font-family: inherit; cursor: pointer; }
    .dpk-root :focus-visible { outline: 2px solid var(--dpk-primary); outline-offset: 2px; }
    
    .dpk-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .dpk-head h1 { font-size: 1.35rem; font-weight: 800; margin: 0 0 4px; font-family: var(--dpk-display); }
    .dpk-head p { margin: 0; color: var(--dpk-muted); font-size: .85rem; max-width: 660px; }
    .dpk-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .dpk-btn { border: 1.5px solid var(--dpk-border); background: #fff; color: #334155; border-radius: 9px; padding: .5rem .95rem; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; }
    .dpk-btn:hover { border-color: var(--dpk-primary); color: var(--dpk-primary); }
    .dpk-btn.pri { background: var(--dpk-primary); border-color: var(--dpk-primary); color: #fff; }
    .dpk-btn.pri:hover { background: var(--dpk-primary-hover); }
    .dpk-btn.sm { padding: .38rem .8rem; font-size: .78rem; }
    .dpk-back { border: 0; background: none; color: var(--dpk-muted); font-weight: 700; font-size: .8rem; padding: 0; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .dpk-back:hover { color: var(--dpk-primary); }
    
    /* ---------- Editor ---------- */
    .dpk-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); padding: 9px 14px; margin-bottom: 14px; font-size: .78rem; }
    .dpk-legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--dpk-muted); }
    .dpk-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dpk-sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .dpk-sw.db { background: var(--dpk-db-bg); border: 1.5px solid var(--dpk-db); }
    .dpk-sw.man { background: var(--dpk-man-bg); border: 1.5px solid var(--dpk-man); }
    .dpk-sw.tetap { background: #f1f5f9; border: 1.5px solid #94a3b8; }
    .dpk-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: var(--dpk-muted); cursor: pointer; }
    .dpk-prog { flex: 1 1 180px; min-width: 160px; }
    .dpk-prog-t { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--dpk-muted); }
    .dpk-prog-b { height: 6px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .dpk-prog-b i { display: block; height: 100%; background: #059669; width: 0; transition: width .2s; }
    
    .dpk-mtabs { display: none; gap: 4px; background: #fff; border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); padding: 4px; margin-bottom: 12px; }
    .dpk-mtabs button { flex: 1; border: 0; background: transparent; padding: .55rem; border-radius: 8px; font-weight: 700; font-size: .82rem; color: var(--dpk-muted); }
    .dpk-mtabs button.on { background: var(--dpk-primary-light); color: var(--dpk-primary); }
    
    .dpk-split { display: grid; grid-template-columns: minmax(340px, 5fr) 6fr; gap: 16px; align-items: start; }
    .dpk-form, .dpk-preview { max-height: calc(100vh - 290px); min-height: 420px; overflow: auto; border-radius: var(--dpk-radius); }
    .dpk-form { padding-right: 4px; }
    .dpk-preview { background: #e2e8f0; padding: 14px; border: 1px solid var(--dpk-border); }
    
    .dpk-card { background: #fff; border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); padding: 14px 16px; margin-bottom: 12px; }
    .dpk-card > h3, .dpk-card > summary { font-family: var(--dpk-display); font-size: .92rem; font-weight: 800; margin: 0 0 10px; }
    .dpk-card > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; margin: 0; }
    .dpk-card > summary::-webkit-details-marker { display: none; }
    .dpk-card[open] > summary { margin-bottom: 10px; }
    .dpk-po-info { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: .75rem; color: var(--dpk-muted); }
    .dpk-po-info b { color: var(--dpk-text); }
    .dpk-f { margin-bottom: 12px; }
    .dpk-f:last-child { margin-bottom: 0; }
    .dpk-fl { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .dpk-fl label { font-size: .78rem; font-weight: 700; margin: 0; }
    .dpk-src { font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .dpk-src.db { background: var(--dpk-db-bg); color: var(--dpk-db); }
    .dpk-src.manual { background: var(--dpk-man-bg); color: var(--dpk-man); }
    .dpk-src.tetap { background: #f1f5f9; color: #475569; }
    .dpk-fin { display: flex; gap: 6px; align-items: flex-start; }
    .dpk-input { flex: 1; width: 100%; min-width: 0; border: 1px solid var(--dpk-border); border-radius: 9px; padding: .5rem .7rem; font: inherit; font-size: .85rem; background: #fff; color: var(--dpk-text); }
    textarea.dpk-input { resize: vertical; }
    .dpk-input.ro { background: #f8fafc; color: #475569; cursor: default; }
    .dpk-input:focus { border-color: var(--dpk-primary); outline: 0; box-shadow: 0 0 0 3px rgba(51,65,85,.12); }
    .dpk-un { border: 0; background: none; color: var(--dpk-primary); font-size: .72rem; font-weight: 700; padding: .5rem 2px; white-space: nowrap; }
    .dpk-un.rst { color: var(--dpk-danger); }
    .dpk-chg { font-size: .65rem; font-weight: 700; color: var(--dpk-danger); }
    .dpk-hint { font-size: .7rem; color: #94a3b8; margin-top: 3px; }
    .dpk-chk { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
    .dpk-derived { background: #f8fafc; border: 1px dashed var(--dpk-border); border-radius: 9px; padding: 8px 10px; font-size: .75rem; color: #475569; margin-top: 6px; }
    .dpk-derived b { font-family: 'Courier New', monospace; color: var(--dpk-text); }
    
    /* ---------- Unggah logo ---------- */
    .dpk-drop { border: 1.5px dashed #94a3b8; border-radius: 10px; background: #f8fafc; padding: 14px; text-align: center; color: var(--dpk-muted); font-size: .8rem; transition: background .15s, border-color .15s; cursor: pointer; }
    .dpk-drop:hover, .dpk-drop.over, .dpk-drop:focus-visible { background: #eff6ff; border-color: var(--dpk-db); color: var(--dpk-db); }
    .dpk-drop i { display: block; font-size: 22px; margin-bottom: 2px; }
    .dpk-drop b { color: var(--dpk-text); }
    .dpk-logo-ok { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .dpk-logo-frame { width: var(--dpk-logo-w); height: var(--dpk-logo-h); border: 1px dashed #cbd5e1; background: #fff; display: flex; align-items: center; justify-content: flex-start; flex-shrink: 0; }
    .dpk-logo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .dpk-logo-ok .k { font-size: .72rem; color: var(--dpk-muted); flex: 1 1 140px; }
    
    /* ---------- Pratinjau dokumen ---------- */
    .dpk-sheet { background: #fff; width: 100%; max-width: 660px; margin: 0 auto 14px; padding: 30px 38px 22px; min-height: 780px; box-shadow: 0 2px 10px rgba(15,23,42,.15); font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; line-height: 1.5; color: #111; text-align: justify; position: relative; display: flex; flex-direction: column; }
    .dpk-sheet .body { flex: 1; }
    .dpk-sheet p { margin: 0 0 8px; }
    .dpk-sheet .c { text-align: center; }
    .dpk-logos { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .dpk-logo-slot { width: var(--dpk-logo-w); height: var(--dpk-logo-h); display: flex; align-items: center; justify-content: flex-start; padding: 0; border: 0; background: none; cursor: pointer; }
    .dpk-logo-slot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .dpk-logo-slot.empty { border: 1.5px dashed #94a3b8; border-radius: 4px; background: #f8fafc; justify-content: center; color: #1d4ed8; font-weight: 700; font-size: 10px; letter-spacing: .3px; }
    .dpk-logo-slot.empty:hover { background: #eff6ff; border-color: #2563eb; }
    .dpk-km { width: var(--dpk-logo-w); height: var(--dpk-logo-h); object-fit: contain; object-position: right center; display: block; }
    .dpk-cover-title { font-weight: 700; font-size: 14px; text-align: center; margin: 4px 0 10px; }
    .dpk-nomor { font-weight: 700; margin: 12px auto 12px; width: fit-content; text-align: left; }
    .dpk-sheet table.k { border-collapse: collapse; margin: 2px 0 6px 18px; font-size: 12.5px; }
    .dpk-sheet table.k td { padding: 0 6px 0 0; vertical-align: top; text-align: left; }
    .dpk-sheet table.k td.no { width: 20px; }
    .dpk-sheet table.k td.n { width: 66px; }
    .dpk-sheet table.k td.t { width: 12px; }
    .dpk-para { margin-left: 18px; }
    .dpk-pasal { text-align: center; font-weight: 700; margin: 14px 0 6px; }
    .dpk-li { padding-left: 26px; text-indent: -26px; margin-bottom: 2px; }
    .dpk-li.sub { padding-left: 46px; }
    .dpk-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; font-size: 10.5px; }
    .dpk-foot table { border-collapse: collapse; font-size: 8px; }
    .dpk-foot td { border: 1px solid #555; padding: 1px 4px; }
    .dpk-foot td.e { width: 24px; }
    .dpk-ttd { display: flex; justify-content: space-between; gap: 20px; margin-top: 18px; text-align: center; }
    .dpk-ttd > div { flex: 1; }
    .dpk-ttd .sp { height: 64px; }
    .dpk-ttd b.n { text-decoration: underline; }
    
    .dpk-v { border-radius: 3px; padding: 0 1px; transition: background .2s; cursor: pointer; }
    .dpk-hl .dpk-v.db { background: var(--dpk-db-bg); box-shadow: inset 0 -1.5px 0 var(--dpk-db); }
    .dpk-hl .dpk-v.manual { background: var(--dpk-man-bg); box-shadow: inset 0 -1.5px 0 var(--dpk-man); }
    .dpk-hl .dpk-v.tetap { background: #f1f5f9; box-shadow: inset 0 -1.5px 0 #94a3b8; }
    .dpk-v.empty { color: #b91c1c; }
    .dpk-v.flash { animation: dpkFlash 1.1s ease; }
    @keyframes dpkFlash { 0%, 60% { background: #fde68a; box-shadow: 0 0 0 3px #fde68a; } 100% { box-shadow: 0 0 0 0 transparent; } }
    
    /* ---------- Popup ---------- */
    .dpk-dlg { position: fixed; inset: 0; z-index: 1090; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15,23,42,.55); opacity: 0; transition: opacity .15s; }
    .dpk-dlg.show { opacity: 1; }
    .dpk-dlg-box { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 28px 24px 22px; text-align: center; box-shadow: 0 24px 60px rgba(15,23,42,.3); transform: translateY(8px) scale(.98); transition: transform .15s; }
    .dpk-dlg.show .dpk-dlg-box { transform: none; }
    .dpk-dlg-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 28px; background: #fffbeb; color: #d97706; }
    .dpk-dlg-box h5 { font-family: var(--dpk-display); font-size: 1.05rem; font-weight: 800; margin: 0 0 6px; }
    .dpk-dlg-box p { color: var(--dpk-muted); font-size: .85rem; margin: 0 0 16px; }
    .dpk-dlg-btns { display: flex; gap: 10px; }
    .dpk-dlg-btns .dpk-btn { flex: 1; }
    
    .dpk-toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -14px); background: #1e293b; color: #fff; padding: 11px 16px; border-radius: 12px; font-size: .82rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1100; max-width: calc(100vw - 24px); }
    .dpk-toast.show { opacity: 1; transform: translate(-50%, 0); }
    .dpk-toast.err { background: #b91c1c; }
    
    @media (max-width: 991.98px) {
        .dpk-mtabs { display: flex; }
        .dpk-split { grid-template-columns: 1fr; }
        .dpk-form, .dpk-preview { max-height: none; overflow: visible; }
        .dpk-root:not(.show-preview) .dpk-preview { display: none; }
        .dpk-root.show-preview .dpk-form { display: none; }
        .dpk-sheet { padding: 22px 18px 16px; min-height: 0; }
        .dpk-toggle { margin-left: 0; }
    }
    @media (max-width: 767.98px) {
        .dpk-desk { display: none; }
        .dpk-mob { display: block; }
        .dpk-tab { font-size: .78rem; padding: .6rem .3rem; }
    }
    @media (prefers-reduced-motion: reduce) { .dpk-root * { transition: none !important; animation: none !important; } }
    
    /* ---------- Bar tombol bawah ---------- */
    .dpk-footbar { position: sticky; bottom: 0; z-index: 30; margin-top: 14px; background: #fff; border: 1px solid var(--dpk-border); border-radius: var(--dpk-radius); box-shadow: 0 -6px 18px rgba(15,23,42,.07); padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .dpk-footbar .hint { font-size: .75rem; color: var(--dpk-muted); flex: 1 1 200px; }
    .dpk-footbar .grp { display: flex; gap: 8px; margin-left: auto; }
    .dpk-btn[disabled] { opacity: .6; cursor: progress; }
    .dpk-alert { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; border-radius: var(--dpk-radius); padding: 10px 14px; margin-bottom: 14px; font-size: .85rem; }
    @media (max-width: 575.98px) { .dpk-footbar .grp { width: 100%; } .dpk-footbar .grp .dpk-btn { flex: 1; } .dpk-footbar .dpk-btn.kembali { flex: 1 1 100%; } }
    </style>
    
    <div class="dpk-root" id="dpkRoot">
        <div class="dpk-head">
            <div>
                <a class="dpk-back" href="{{ @BASE }}/kontrak" data-dpk-act="kembali"><i class="bi bi-arrow-left"></i>Daftar kontrak</a>
                <h1 id="dpkEdJudul">Buat Kontrak (PKS)</h1>
                <p>Isian biru diambil dari PO/database, isian kuning diisi manual. Pratinjau dokumen ikut berubah saat Anda mengetik.</p>
            </div>
        </div>
    
        <div class="dpk-bar">
            <div class="dpk-legend">
                <span><i class="dpk-sw db"></i>Dari PO/database</span>
                <span><i class="dpk-sw man"></i>Isi manual</span>
                <span><i class="dpk-sw tetap"></i>Tetap (BBSPJIS)</span>
            </div>
            <div class="dpk-prog">
                <div class="dpk-prog-t"><span id="dpkProgTxt">Kelengkapan</span><span id="dpkProgPct"></span></div>
                <div class="dpk-prog-b"><i id="dpkProgBar"></i></div>
            </div>
            <label class="dpk-toggle"><input type="checkbox" id="dpkSorot" checked>Sorot isian di pratinjau</label>
        </div>
    
        <div class="dpk-mtabs" role="tablist">
            <button type="button" class="on" data-dpk-tab="form">Form</button>
            <button type="button" data-dpk-tab="preview">Pratinjau</button>
        </div>
    
        <div class="dpk-split">
            <section class="dpk-form" id="dpkForm" aria-label="Form kontrak"></section>
            <section class="dpk-preview dpk-hl" id="dpkPages" aria-label="Pratinjau kontrak"></section>
        </div>
    
        <div class="dpk-footbar">
            <a class="dpk-btn kembali" href="{{ @BASE }}/kontrak" id="dpkBtnKembali" data-dpk-act="kembali"><i class="bi bi-arrow-left"></i>Kembali</a>
            <div class="hint" id="dpkHint"></div>
            <div class="grp">
                <button type="button" class="dpk-btn" id="dpkSimpan"><i class="bi bi-save"></i>Simpan draft</button>
                <button type="button" class="dpk-btn pri" id="dpkSelesai"><i class="bi bi-check2-circle"></i>Selesai</button>
            </div>
        </div>
    
        <div class="dpk-dlg" id="dpkDlg" hidden>
            <div class="dpk-dlg-box" role="alertdialog" aria-modal="true" aria-labelledby="dpkDlgTitle" aria-describedby="dpkDlgMsg">
                <div class="dpk-dlg-icon" id="dpkDlgIcon"><i class="bi bi-exclamation-triangle"></i></div>
                <h5 id="dpkDlgTitle"></h5>
                <p id="dpkDlgMsg"></p>
                <div class="dpk-dlg-btns">
                    <button type="button" class="dpk-btn" id="dpkDlgNo">Buang</button>
                    <button type="button" class="dpk-btn pri" id="dpkDlgYes">Simpan</button>
                </div>
            </div>
        </div>
    
        <input type="file" id="dpk_logoKlien" data-fid="logoKlien" accept="image/png,image/jpeg" hidden>
        <div class="dpk-toast" id="dpkToast" role="status"></div>
    </div>
    
    <script>
    (function () {
        var BASE = '{{ @BASE }}';
        var CSRF = '{{ @csrf_token }}';
        var KONTRAK = {{ @kontrak_json | raw }};
        var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

        /* ---------- Kelengkapan ---------- */
        function updProgress() {
            var terisi = REQ.length - daftarKosongDi(vals).length;
            var pct = Math.round(terisi / REQ.length * 100);
            $('dpkProgTxt').textContent = terisi + ' dari ' + REQ.length + ' isian wajib terisi';
            $('dpkProgPct').textContent = pct + '%';
            $('dpkProgBar').style.width = pct + '%';
        }
    
        
        /* ---------- Logo ---------- */
        function setLogo(file) {
            if (!file) { return; }
            if (!/^image\/(png|jpeg)$/.test(file.type)) { toast('Format logo harus PNG atau JPG.', true); return; }
            if (file.size > LOGO_MAKS_BYTE) { toast('Ukuran logo maksimal 2 MB. File ini ' + (file.size / 1048576).toFixed(1).replace('.', ',') + ' MB.', true); return; }
            var rd = new FileReader();
            rd.onload = function () { logoSrc = String(rd.result); logoFile = file; hapusLogoFlag = false; dirty = true; $('dpkLogoBox').outerHTML = logoFieldHtml(); renderDoc(); toast('Logo terpasang. Ukurannya disamakan dengan logo BBSPJIS.'); };
            rd.onerror = function () { toast('Logo gagal dibaca. Coba file lain.', true); };
            rd.readAsDataURL(file);
        }
        function hapusLogo() { logoSrc = ''; logoFile = null; hapusLogoFlag = true; dirty = true; $('dpkLogoBox').outerHTML = logoFieldHtml(); renderDoc(); }
    
        /* ---------- Sinkron form dan pratinjau ---------- */
        function kilas(fid, gulir) {
            var box = $('dpkPages');
            var els = box.querySelectorAll('[data-f="' + fid + '"]');
            if (!els.length) { return; }
            if (gulir && getComputedStyle(box).overflow !== 'visible') {
                var y = els[0].getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - box.clientHeight / 3;
                box.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
            }
            els.forEach(function (e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
        }
    
        function onInput(e) {
            var el = e.target, fid = el.getAttribute('data-fid');
            if (!fid) { return; }
            var f = F[fid];
            if (f.type === 'check') { vals[fid] = el.checked; }
            else if (f.type === 'money') {
                var angka = parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0;
                vals[fid] = angka;
                el.value = angka ? rp(angka) : '';
            } else { vals[fid] = el.value; }
            dirty = true;
            if (fid === 'alamatPerusahaan' && !unlocked.alamatNotif && String(vals.alamatNotif) === String(dbv.alamatNotif)) {
                dbv.alamatNotif = vals[fid]; vals.alamatNotif = vals[fid];
                if ($('dpk_alamatNotif')) { $('dpk_alamatNotif').value = vals[fid]; }
                updMeta('alamatNotif');
            }
            updMeta(fid);
            updDerived();
            renderDoc();
            updProgress();
            kilas(fid, false);
        }
    
        function onClick(e) {
            var t = e.target, el;
            if ((el = t.closest('[data-idx-tab]'))) { idxTab = el.getAttribute('data-idx-tab'); renderIndex(); return; }
            if ((el = t.closest('[data-dpk-open]'))) { bukaEditor(parseInt(el.getAttribute('data-dpk-open'), 10)); return; }
            if (t.closest('[data-dpk-act="kembali"]')) { kembali(); return; }
            if ((el = t.closest('[data-logo]'))) {
                var aksi = el.getAttribute('data-logo');
                if (aksi === 'hapus') { hapusLogo(); } else { $('dpk_logoKlien').click(); }
                return;
            }
            if (t.closest('#dpkDrop')) { $('dpk_logoKlien').click(); return; }
            if ((el = t.closest('[data-un]'))) {
                var fid = el.getAttribute('data-un'), inp = $('dpk_' + fid);
                if (String(vals[fid]) !== String(dbv[fid])) { vals[fid] = dbv[fid]; inp.value = fmtVal(F[fid], dbv[fid]); unlocked[fid] = false; }
                else { unlocked[fid] = !unlocked[fid]; if (unlocked[fid]) { inp.focus(); } }
                dirty = true;
                updMeta(fid); updDerived(); renderDoc(); updProgress();
                return;
            }
            if ((el = t.closest('[data-dpk-tab]'))) {
                var lihat = el.getAttribute('data-dpk-tab') === 'preview';
                $('dpkRoot').classList.toggle('show-preview', lihat);
                document.querySelectorAll('.dpk-mtabs button').forEach(function (b) { b.classList.toggle('on', b === el); });
                return;
            }
            if ((el = t.closest('.dpk-v[data-f]'))) {
                var target = $('dpk_' + el.getAttribute('data-f'));
                if (!target) { return; }
                if (window.matchMedia('(max-width: 991.98px)').matches) {
                    $('dpkRoot').classList.remove('show-preview');
                    document.querySelectorAll('.dpk-mtabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-dpk-tab') === 'form'); });
                }
                var kartu = target.closest('details'); if (kartu) { kartu.open = true; }
                target.scrollIntoView({ block: 'center', behavior: 'smooth' });
                setTimeout(function () { target.focus({ preventScroll: true }); }, 250);
            }
        }
    
        
        /* ---------- Simpan ke server ---------- */
        function buatForm() {
            var fd = new FormData();
            fd.append('csrf_token', CSRF);
            FIELDS.forEach(function (f) {
                if (f.type === 'logo') { return; }
                var v = vals[f.id];
                if (f.type === 'check') { v = v ? '1' : '0'; }
                fd.append(f.id, v == null ? '' : v);
            });
            if (logoFile) { fd.append('logo', logoFile); }
            else if (hapusLogoFlag) { fd.append('hapus_logo', '1'); }
            return fd;
        }
    
        function kirim(aksi) {
            return fetch(BASE + '/kontrak/' + poAktif.id + '/' + aksi, { method: 'POST', body: buatForm(), credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } }).then(function (r) {
                return r.text().then(function (t) {
                    var j;
                    try { j = JSON.parse(t); } catch (e) { throw new Error('Server membalas ' + r.status + ' (bukan JSON). Bisa sesi berakhir atau error PHP. Buka F12 > Network untuk melihat isinya.'); }
                    if (!r.ok || !j.ok) { var er = new Error(j.pesan || 'Terjadi kesalahan.'); er.kosong = j.kosong || []; throw er; }
                    return j;
                });
            });
        }
    
        function kunciTombol(v) {
            sedangProses = v;
            $('dpkSimpan').disabled = v; $('dpkSelesai').disabled = v;
        }
    
        function terapkanHasilSimpan(j) {
            dirty = false; status = j.status; logoFile = null; hapusLogoFlag = false;
            if (typeof j.logoUrl === 'string') { logoSrc = j.logoUrl; $('dpkLogoBox').outerHTML = logoFieldHtml(); renderDoc(); }
            updHint();
        }
    
        function simpanDraft() {
            if (sedangProses) { return Promise.resolve(false); }
            kunciTombol(true);
            return kirim('simpan').then(function (j) {
                terapkanHasilSimpan(j);
                toast('Draft tersimpan. Kontrak untuk ' + poAktif.nomor + ' ada di tab Draft.');
                return true;
            }).catch(function (e) { toast(e.message, true); return false; }).then(function (ok) { kunciTombol(false); return ok; });
        }
    
        function selesai() {
            if (sedangProses) { return; }
            var k = daftarKosongDi(vals);
            if (k.length) {
                toast('Masih ada ' + k.length + ' isian wajib kosong: ' + k.map(function (f) { return f.label; }).slice(0, 3).join(', ') + (k.length > 3 ? ', dan lainnya' : '') + '.', true);
                kilas(k[0].id, true);
                return;
            }
            if (hariAntara(vals.mulai, vals.selesai) === 0) { toast('Tanggal selesai harus sama atau setelah tanggal mulai.', true); kilas('selesai', true); return; }
            dialog({ judul: 'Tandai kontrak selesai?', pesan: 'Kontrak ' + nomorDari(vals) + ' akan masuk tab Selesai dan bisa diunduh sebagai Word.', ya: 'Ya, selesai', tidak: 'Periksa lagi', ikon: 'bi-check2-circle', warna: 'ok' }).then(function (h) {
                if (h !== 'ya') { return; }
                kunciTombol(true);
                kirim('selesai').then(function () {
                    dirty = false;
                    window.location.href = BASE + '/kontrak?tab=selesai&pesan=selesai';
                }).catch(function (e) {
                    kunciTombol(false);
                    toast(e.message, true);
                    if (e.kosong && e.kosong.length) { kilas(e.kosong[0], true); }
                });
            });
        }
    
        function tabKembali() { return status === 'selesai' ? 'selesai' : (status === 'draft' ? 'draft' : 'baru'); }
        function keIndex() { window.location.href = BASE + '/kontrak?tab=' + tabKembali(); }
    
        function kembali() {
            if (!dirty) { keIndex(); return; }
            dialog({ judul: 'Simpan perubahan?', pesan: 'Ada perubahan yang belum disimpan pada kontrak ' + poAktif.nomor + '.', ya: 'Simpan draft', tidak: 'Buang perubahan', ikon: 'bi-exclamation-triangle', warna: 'warn' }).then(function (h) {
                if (h === 'batal') { return; }
                if (h === 'tidak') { dirty = false; keIndex(); return; }
                simpanDraft().then(function (ok) { if (ok) { keIndex(); } });
            });
        }
    
        function updHint() {
            $('dpkHint').textContent = status === 'selesai'
                ? 'Kontrak ini sudah selesai. Menyimpan sebagai draft memindahkannya kembali ke tab Draft.'
                : (status === 'draft' ? 'Draft tersimpan. Tekan Selesai kalau semua isian wajib sudah lengkap.' : 'Belum pernah disimpan.');
        }
    
        function onInput(e) {
            var el = e.target, fid = el.getAttribute('data-fid');
            if (!fid) { return; }
            var f = F[fid];
            if (f.type === 'check') { vals[fid] = el.checked; }
            else if (f.type === 'money') {
                var angka = parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0;
                vals[fid] = angka;
                el.value = angka ? rp(angka) : '';
            } else { vals[fid] = el.value; }
            dirty = true;
            if (fid === 'alamatPerusahaan' && !unlocked.alamatNotif && String(vals.alamatNotif) === String(dbv.alamatNotif)) {
                dbv.alamatNotif = vals[fid]; vals.alamatNotif = vals[fid];
                if ($('dpk_alamatNotif')) { $('dpk_alamatNotif').value = vals[fid]; }
                updMeta('alamatNotif');
            }
            updMeta(fid);
            updDerived();
            renderDoc();
            updProgress();
            kilas(fid, false);
        }
    
        function onClick(e) {
            var t = e.target, el;
            if ((el = t.closest('[data-dpk-act="kembali"]'))) { e.preventDefault(); kembali(); return; }
            if ((el = t.closest('[data-logo]'))) {
                var aksi = el.getAttribute('data-logo');
                if (aksi === 'hapus') { hapusLogo(); } else { $('dpk_logoKlien').click(); }
                return;
            }
            if (t.closest('#dpkDrop')) { $('dpk_logoKlien').click(); return; }
            if ((el = t.closest('[data-un]'))) {
                var fid = el.getAttribute('data-un'), inp = $('dpk_' + fid);
                if (String(vals[fid]) !== String(dbv[fid])) { vals[fid] = dbv[fid]; inp.value = fmtVal(F[fid], dbv[fid]); unlocked[fid] = false; }
                else { unlocked[fid] = !unlocked[fid]; if (unlocked[fid]) { inp.focus(); } }
                dirty = true;
                updMeta(fid); updDerived(); renderDoc(); updProgress();
                return;
            }
            if ((el = t.closest('[data-dpk-tab]'))) {
                var lihat = el.getAttribute('data-dpk-tab') === 'preview';
                $('dpkRoot').classList.toggle('show-preview', lihat);
                document.querySelectorAll('.dpk-mtabs button').forEach(function (b) { b.classList.toggle('on', b === el); });
                return;
            }
            if ((el = t.closest('.dpk-v[data-f]'))) {
                var target = $('dpk_' + el.getAttribute('data-f'));
                if (!target) { return; }
                if (window.matchMedia('(max-width: 991.98px)').matches) {
                    $('dpkRoot').classList.remove('show-preview');
                    document.querySelectorAll('.dpk-mtabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-dpk-tab') === 'form'); });
                }
                var kartu = target.closest('details'); if (kartu) { kartu.open = true; }
                target.scrollIntoView({ block: 'center', behavior: 'smooth' });
                setTimeout(function () { target.focus({ preventScroll: true }); }, 250);
            }
        }
    
        /* ---------- Popup ---------- */
        var dlgResolve = null, dlgTimer = null, dlgFokus = null;
        function dialog(o) {
            return new Promise(function (resolve) {
                if (dlgResolve) { dlgResolve('batal'); }
                clearTimeout(dlgTimer);
                dlgResolve = resolve; dlgFokus = document.activeElement;
                $('dpkDlgIcon').className = 'dpk-dlg-icon' + (o.warna === 'ok' ? ' ok' : '');
                $('dpkDlgIcon').innerHTML = '<i class="bi ' + (o.ikon || 'bi-exclamation-triangle') + '"></i>';
                $('dpkDlgTitle').textContent = o.judul; $('dpkDlgMsg').textContent = o.pesan;
                $('dpkDlgYes').textContent = o.ya; $('dpkDlgNo').textContent = o.tidak;
                $('dpkDlg').hidden = false;
                requestAnimationFrame(function () { $('dpkDlg').classList.add('show'); });
                setTimeout(function () { $('dpkDlgYes').focus(); }, 30);
            });
        }
        function tutupDialog(hasil) {
            if (!dlgResolve) { return; }
            var r = dlgResolve; dlgResolve = null;
            $('dpkDlg').classList.remove('show');
            dlgTimer = setTimeout(function () { $('dpkDlg').hidden = true; }, 160);
            if (dlgFokus && dlgFokus.focus) { try { dlgFokus.focus(); } catch (e) {} }
            r(hasil);
        }
    
        /* ---------- Toast ---------- */
        var toastTimer;
        function toast(text, galat) {
            var t = $('dpkToast');
            t.textContent = text;
            t.classList.toggle('err', !!galat);
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, galat ? 7000 : 4200);
        }
    
        /* ---------- Event ---------- */
        $('dpkRoot').addEventListener('click', onClick);
        $('dpkForm').addEventListener('input', onInput);
        $('dpkForm').addEventListener('focusin', function (e) {
            var fid = e.target.getAttribute && e.target.getAttribute('data-fid');
            if (fid && window.matchMedia('(min-width: 992px)').matches) { kilas(fid, true); }
        });
        $('dpk_logoKlien').addEventListener('change', function () { setLogo(this.files && this.files[0]); this.value = ''; });
        $('dpkForm').addEventListener('keydown', function (e) {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'dpkDrop') { e.preventDefault(); $('dpk_logoKlien').click(); }
        });
        ['dragenter', 'dragover'].forEach(function (n) { $('dpkForm').addEventListener(n, function (e) { if (e.target.closest && e.target.closest('#dpkDrop')) { e.preventDefault(); $('dpkDrop').classList.add('over'); } }); });
        ['dragleave', 'drop'].forEach(function (n) { $('dpkForm').addEventListener(n, function () { var d = $('dpkDrop'); if (d) { d.classList.remove('over'); } }); });
        $('dpkForm').addEventListener('drop', function (e) { if (e.target.closest && e.target.closest('#dpkDrop')) { e.preventDefault(); setLogo(e.dataTransfer.files && e.dataTransfer.files[0]); } });
        $('dpkSorot').addEventListener('change', function () { $('dpkPages').classList.toggle('dpk-hl', this.checked); });
        $('dpkSimpan').addEventListener('click', simpanDraft);
        $('dpkSelesai').addEventListener('click', selesai);
        $('dpkDlgYes').addEventListener('click', function () { tutupDialog('ya'); });
        $('dpkDlgNo').addEventListener('click', function () { tutupDialog('tidak'); });
        $('dpkDlg').addEventListener('click', function (e) { if (e.target === $('dpkDlg')) { tutupDialog('batal'); } });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && dlgResolve) { e.preventDefault(); tutupDialog('batal'); } });
    
        $('dpkEdJudul').textContent = 'Kontrak untuk ' + poAktif.nomor;
        renderForm(); renderDoc(); updProgress(); updHint();
    })();
    </script>
