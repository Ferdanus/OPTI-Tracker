<div class="container-fluid px-0">
    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <div>
            <h4 class="fw-bold text-dark m-0 d-flex align-items-center gap-2 font-display">
                <i class="bi bi-clipboard2-check text-primary"></i> Order Siap Ditindaklanjuti
            </h4>
        </div>
    </div>

    <!-- 1. CARD FILTER & PENCARIAN (ATAS) -->
    <div class="card mb-4 border-0 shadow-sm">
        <div class="card-body p-3">
            <div class="row g-2 align-items-center">
                <!-- Filter Bulan (Tampil saat tab Sudah Ditunjuk) -->
                <div class="col-6 col-sm-auto col-md-3 col-lg-2 ktp-fp" style="display:none;">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-calendar3"></i></span>
                        <select id="fBulan" class="form-select form-select-sm fw-semibold" title="Filter Berdasarkan Bulan">
                            <option value="">Semua Bulan</option>
                            <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                            <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                            <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
                            <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
                        </select>
                    </div>
                </div>

                <!-- Filter Tahun (Tampil saat tab Sudah Ditunjuk) -->
                <div class="col-6 col-sm-auto col-md-3 col-lg-2 ktp-fp" style="display:none;">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-calendar-event"></i></span>
                        <select id="fTahun" class="form-select form-select-sm fw-semibold" title="Filter Berdasarkan Tahun">
                            <repeat group="{{ @daftar_tahun }}" value="{{ @thn }}">
                                <option value="{{ @thn }}">{{ @thn }}</option>
                            </repeat>
                        </select>
                    </div>
                </div>

                <!-- Input Pencarian -->
                <div class="col-12 col-sm flex-grow-1">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="fSearch" class="form-control border-start-0" placeholder="Cari nomor order, nama mitra industri, perihal kegiatan..." autocomplete="off">
                    </div>
                </div>

                <!-- Filter Divisi (Khusus Superadmin) -->
                <check if="{{ @is_superadmin }}">
                    <true>
                        <div class="col-12 col-sm-auto d-flex justify-content-sm-end">
                            <select id="fDivisi" class="form-select form-select-sm fw-semibold">
                                <option value="">Semua Divisi</option>
                                <option value="selulosa">Divisi Selulosa</option>
                                <option value="lingkungan">Divisi Lingkungan</option>
                            </select>
                        </div>
                    </true>
                    <false>
                        <input type="hidden" id="fDivisi" value="">
                    </false>
                </check>
            </div>

            <!-- Periode Note Info -->
            <div class="alert alert-warning py-2 px-3 small mt-2 mb-0 d-none align-items-center gap-2" id="pNote">
                <i class="bi bi-info-circle-fill text-warning"></i>
                <span id="pNoteText"></span>
            </div>
        </div>
    </div>

    <!-- 2. CARD TABEL UTAMA DENGAN FILTER PILLS NAVIGASI (BAWAH) -->
    <div class="card border-0 shadow-sm overflow-hidden mb-4">
        <div class="filter-tabs-wrapper d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <button type="button" class="filter-tab-pill ktp-tab-btn active" data-tab="belum">
                    <i class="bi bi-clock-history"></i>
                    <span>Baru Lunas</span>
                    <span class="count-chip chip-danger" id="cBelum">0</span>
                </button>
                <button type="button" class="filter-tab-pill ktp-tab-btn" data-tab="sudah">
                    <i class="bi bi-check2-circle"></i>
                    <span>Sudah Ditunjuk</span>
                    <span class="count-chip chip-success" id="cSudah">0</span>
                </button>
            </div>
            <span class="text-muted small">Total: <strong id="totalCountDisplay">0</strong> order</span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 45px;" class="text-center">No.</th>
                        <th style="min-width: 170px;">No. Order</th>
                        <th style="min-width: 200px;">Customer / Mitra</th>
                        <th style="min-width: 260px;">Perihal &amp; Layanan</th>
                        <th style="min-width: 130px;" id="thExtra">Tanggal Lunas</th>
                        <th style="min-width: 170px;" class="text-center text-nowrap">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL PILIH PELAKSANA -->
    <div class="modal fade" id="modalPilihPelaksana" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header bg-light border-bottom py-3 px-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="p-2 rounded-3 bg-primary-subtle text-primary">
                            <i class="bi bi-person-plus-fill fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title fw-bold text-dark mb-0" id="mppLabel">Pilih Ketua Pelaksana</h5>
                            <div class="text-muted small" id="mppNomor">-</div>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
    
                <form action="" method="POST" id="formPilihPelaksana">
                    <input type="hidden" name="csrf_token" value="{{ @csrf_token }}">
                    <div class="modal-body p-4">
                        <div class="card bg-light border-0 mb-4 rounded-3">
                            <div class="card-body p-3 small" id="mppInfo"></div>
                        </div>
        
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark" id="mppSelectLabel">Ketua Pelaksana <span class="text-danger">*</span></label>
                            <select name="ketua_pelaksana_id" id="selectPelaksana" class="form-select searchable-select" required>
                                <option value="">Cari nama pegawai...</option>
                            </select>
                            <div class="form-text small" id="mppHintLingkungan" style="display:none;"></div>
                        </div>
                    </div>
                    <div class="modal-footer border-top py-3 px-4 bg-light d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary btn-sm px-4 d-inline-flex align-items-center gap-1 shadow-sm" id="mppBtnSubmit">
                            <i class="bi bi-check-lg"></i> Tunjuk Ketua Pelaksana
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
var BASE = '{{ @BASE }}';
var BULAN = ['', 'Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
var BULAN_FULL = ['', 'Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DATA_BELUM = {{ @daftar_belum_json | raw }};
var DATA_SUDAH = {{ @daftar_sudah_json | raw }};
var bulanSekarang = {{ @bulan_sekarang }};
var tahunSekarang = {{ @tahun_sekarang }};

var tab = 'belum';
var bSel = document.getElementById('fBulan');
var tSel = document.getElementById('fTahun');
var thExtra = document.getElementById('thExtra');

function tgl(s) {
    if (!s) return '-';
    var d = new Date(s.replace(' ', 'T'));
    if (isNaN(d.getTime())) return s;
    return d.getDate() + ' ' + BULAN[d.getMonth() + 1] + ' ' + d.getFullYear();
}

function divisiBadge(d) {
    if (d === 'selulosa') {
        return '<span class="badge bg-danger-subtle text-danger border border-danger-subtle text-uppercase" style="font-size: 0.65rem;">Selulosa</span>';
    }
    return '<span class="badge bg-success-subtle text-success border border-success-subtle text-uppercase" style="font-size: 0.65rem;">Lingkungan</span>';
}

document.querySelectorAll('.filter-tab-pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-tab-pill').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        tab = btn.dataset.tab;
        if (thExtra) thExtra.textContent = tab === 'sudah' ? 'Ketua Pelaksana' : 'Tanggal Lunas';
        document.getElementById('fSearch').value = '';
        document.querySelectorAll('.ktp-fp').forEach(function (el) { el.style.display = tab === 'sudah' ? 'inline-block' : 'none'; });
        if (tab === 'sudah') { bSel.value = String(bulanSekarang); tSel.value = String(tahunSekarang); }
        render();
    });
});

['fSearch', 'fDivisi', 'fBulan', 'fTahun'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) {
        el.addEventListener('input', render);
        el.addEventListener('change', render);
    }
});

function aksiBelum(o) {
    var divisi = o.jenis_layanan_opti;
    var ikon = divisi === 'lingkungan' ? 'bi-send-check' : 'bi-person-plus-fill';
    var judulTombol = divisi === 'lingkungan' ? 'Disposisikan' : 'Pilih Pelaksana';
    return '<div class="d-inline-flex align-items-center gap-1">' +
        '<button type="button" class="btn btn-primary btn-sm py-1 px-2.5 d-inline-flex align-items-center gap-1 shadow-xs fw-semibold btn-buka-modal-pelaksana"' +
        ' data-order-id="' + o.id + '" data-nomor="' + o.nomor_order + '" data-divisi="' + divisi + '"' +
        ' data-mitra="' + (o.nama_perusahaan || '').replace(/"/g, '&quot;') + '"' +
        ' data-judul="' + (o.judul_kegiatan || '').replace(/"/g, '&quot;') + '"' +
        ' data-nilai="' + (o.biaya_acuan || 0) + '" data-tanggal="' + (o.tanggal_lunas || o.disposisi_katim_at || '') + '"' +
        ' data-pic-id="' + (o.pic_proposal_id || '') + '" data-pic-nama="' + (o.nama_pic_proposal || '').replace(/"/g, '&quot;') + '"' +
        ' title="' + judulTombol + '">' +
        '<i class="bi ' + ikon + '"></i> <span>' + judulTombol + '</span></button>' +
        '<a href="' + BASE + '/order/' + o.id + '" class="btn btn-light border btn-sm py-1 px-2 text-primary" title="Buka Detail Order">' +
        '<i class="bi bi-folder2-open"></i></a>' +
        '</div>';
}

function aksiSudah(o) {
    return '<div class="d-inline-flex align-items-center gap-1">' +
        statusPoBadge(o) +
        '<a href="' + BASE + '/order/' + o.id + '" class="btn btn-light border btn-sm py-1 px-2 text-primary" title="Buka Detail Order">' +
        '<i class="bi bi-folder2-open"></i></a>' +
        '</div>';
}

function statusPoBadge(o) {
    if (!o.sudah_ada_po) {
        return '<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"><i class="bi bi-person-check-fill me-1"></i>Pelaksana Terpilih</span>';
    }
    if (o.po_status === 'terkirim') {
        return '<span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1"><i class="bi bi-check-circle-fill me-1"></i>PO Diterbitkan</span>';
    }
    return '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1"><i class="bi bi-pencil-square me-1"></i>PO Dalam Draft</span>';
}

function kolomExtra(o) {
    if (tab === 'sudah') {
        return '<div class="fw-semibold text-dark">' + (o.nama_pelaksana || '-') + '</div>' +
            '<div class="text-muted" style="font-size:11px;">Ditunjuk ' + tgl(o.ketua_pelaksana_at) + '</div>';
    }
    var tglLunas = o.tanggal_lunas || o.disposisi_katim_at;
    return '<span class="text-dark">' + tgl(tglLunas) + '</span>';
}

function render() {
    var q = (document.getElementById('fSearch').value || '').trim().toLowerCase();
    var divisi = document.getElementById('fDivisi') ? document.getElementById('fDivisi').value : '';
    var bulan = document.getElementById('fBulan') ? document.getElementById('fBulan').value : '';
    var tahun = document.getElementById('fTahun') ? document.getElementById('fTahun').value : '';

    document.getElementById('cBelum').textContent = DATA_BELUM.length;
    document.getElementById('cSudah').textContent = DATA_SUDAH.length;

    var sumber = tab === 'belum' ? DATA_BELUM : DATA_SUDAH;
    var hasil = sumber.filter(function (o) {
        if (divisi && o.jenis_layanan_opti !== divisi) return false;
        var cocok = !q || ((o.nomor_order || '') + ' ' + (o.nama_perusahaan || '') + ' ' + (o.judul_kegiatan || '')).toLowerCase().indexOf(q) !== -1;
        if (tab === 'sudah') {
            if (q) return cocok;
            if (bulan && String(o.bulan_tunjuk) !== bulan) return false;
            if (tahun && String(o.tahun_tunjuk) !== tahun) return false;
            return true;
        }
        return cocok;
    });

    var note = document.getElementById('pNote');
    var noteText = document.getElementById('pNoteText');
    var showNote = tab === 'sudah' && !q;
    if (showNote) {
        note.classList.remove('d-none');
        note.classList.add('d-flex');
        noteText.textContent = 'Menampilkan data ' + (bulan ? BULAN_FULL[bulan] : 'Semua Bulan') + ' ' + (tahun || 'Semua Tahun') + '. Ketik di kolom cari untuk menjangkau seluruh periode.';
    } else {
        note.classList.add('d-none');
        note.classList.remove('d-flex');
    }

    var tbody = document.getElementById('tbody');
    var totalDisplay = document.getElementById('totalCountDisplay');
    if (totalDisplay) totalDisplay.textContent = hasil.length;

    if (hasil.length === 0) {
        var pesan = tab === 'belum' ? 'Belum ada order yang siap ditunjuk.' : 'Tidak ada order di periode ini.';
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">' +
            '<i class="bi bi-inbox fs-1 d-block mb-2 text-secondary opacity-50"></i>' +
            '<span class="small">' + pesan + '</span></td></tr>';
        return;
    }

    tbody.innerHTML = hasil.map(function (o, idx) {
        var aksi = tab === 'belum' ? aksiBelum(o) : aksiSudah(o);
        var kesanggupanBadge = (o.punya_kesanggupan_bayar == 1 || o.surat_kesanggupan_bayar) ? 
            '<div class="mt-1"><span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle" style="font-size: 0.65rem;"><i class="bi bi-file-earmark-check me-1"></i>Kesanggupan Bayar</span></div>' : '';

        return '<tr>' +
            '<td class="text-muted text-center small">' + (idx + 1) + '</td>' +
            '<td>' +
                '<a href="' + BASE + '/order/' + o.id + '" class="fw-bold font-monospace text-primary text-decoration-none d-block">' + o.nomor_order + '</a>' +
                '<div class="mt-1">' + divisiBadge(o.jenis_layanan_opti) + '</div>' +
            '</td>' +
            '<td>' +
                '<strong class="text-dark d-block">' + (o.nama_perusahaan || '-') + '</strong>' +
                kesanggupanBadge +
            '</td>' +
            '<td>' +
                '<div class="text-dark small fw-medium text-truncate" style="max-width: 280px;" title="' + (o.judul_kegiatan || '') + '">' +
                    (o.judul_kegiatan || '-') +
                '</div>' +
            '</td>' +
            '<td class="text-nowrap small">' + kolomExtra(o) + '</td>' +
            '<td class="text-center text-nowrap">' + aksi + '</td>' +
        '</tr>';
    }).join('');
}

var DATA_PELAKSANA = {{ @daftar_pelaksana_json | raw }};
var tomPelaksana = null;

document.addEventListener('click', function (e) {
    var btn = e.target.closest('.btn-buka-modal-pelaksana');
    if (!btn) return;

    var orderId = btn.getAttribute('data-order-id');
    var divisi = btn.getAttribute('data-divisi');
    var picId = btn.getAttribute('data-pic-id');
    var picNama = btn.getAttribute('data-pic-nama');

    document.getElementById('mppNomor').textContent = btn.getAttribute('data-nomor');
    document.getElementById('mppInfo').innerHTML =
        '<div class="d-flex justify-content-between py-1 border-bottom"><span class="text-muted">Mitra Industri:</span><strong class="text-dark">' + btn.getAttribute('data-mitra') + '</strong></div>' +
        '<div class="d-flex justify-content-between py-1 border-bottom"><span class="text-muted">Perihal Kegiatan:</span><strong class="text-dark text-truncate text-end" style="max-width: 320px;">' + btn.getAttribute('data-judul') + '</strong></div>' +
        '<div class="d-flex justify-content-between py-1 border-bottom"><span class="text-muted">Nilai Kontrak:</span><strong class="text-dark">Rp ' + Math.round(btn.getAttribute('data-nilai') || 0).toLocaleString('id-ID') + '</strong></div>' +
        '<div class="d-flex justify-content-between py-1"><span class="text-muted">Tanggal Lunas:</span><strong class="text-dark">' + tgl(btn.getAttribute('data-tanggal')) + '</strong></div>' +
        (divisi === 'lingkungan' ? '<div class="d-flex justify-content-between py-1 border-top"><span class="text-muted">PIC Proposal:</span><strong class="text-dark">' + (picNama || '-') + '</strong></div>' : '');

    document.getElementById('formPilihPelaksana').action = BASE + '/ketua-tim/' + orderId + '/pilih-pelaksana';

    if (divisi === 'lingkungan') {
        document.getElementById('mppLabel').textContent = 'Disposisikan ke PIC Proposal';
        document.getElementById('mppSelectLabel').textContent = 'Pelaksana (otomatis dari PIC Proposal)';
        document.getElementById('mppHintLingkungan').style.display = 'block';
        document.getElementById('mppBtnSubmit').innerHTML = '<i class="bi bi-send-check me-1"></i>Disposisikan';

        if (tomPelaksana) {
            tomPelaksana.clear();
            if (picId) {
                if (!tomPelaksana.options[picId]) { tomPelaksana.addOption({ value: picId, text: picNama || ('User #' + picId) }); }
                tomPelaksana.setValue(picId);
            }
            tomPelaksana.lock();
        }
    } else {
        document.getElementById('mppLabel').textContent = 'Pilih Ketua Pelaksana';
        document.getElementById('mppSelectLabel').innerHTML = 'Ketua Pelaksana <span class="text-danger">*</span>';
        document.getElementById('mppHintLingkungan').style.display = 'none';
        document.getElementById('mppBtnSubmit').innerHTML = '<i class="bi bi-check-lg me-1"></i>Tunjuk Ketua Pelaksana';

        if (tomPelaksana) {
            tomPelaksana.unlock();
            tomPelaksana.clear();
        }
    }

    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPilihPelaksana')).show();
});

document.addEventListener('DOMContentLoaded', function () {
    var selectEl = document.getElementById('selectPelaksana');
    if (selectEl && typeof TomSelect !== 'undefined') {
        DATA_PELAKSANA.forEach(function (u) {
            var opt = document.createElement('option');
            opt.value = u.id_user;
            opt.textContent = u.nama_user;
            selectEl.appendChild(opt);
        });

        if (!selectEl.tomselect) {
            new TomSelect(selectEl, {
                create: false,
                sortField: { field: "text", direction: "asc" },
                placeholder: 'Ketik untuk mencari nama pegawai...',
                maxOptions: 200,
            });
        }
        tomPelaksana = selectEl.tomselect;
    }
});

render();
</script>
